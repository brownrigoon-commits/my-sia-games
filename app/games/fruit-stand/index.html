<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#B9473B">
<title>과일 가게 계산대</title>
<style>
:root{--ink:#1C2333;--blue:#2F6BFF;--yellow:#F2C14E;--orange:#E88F4D;--green:#3F7D5B;--red:#DB5F52;--wood:#B98B5E}
html,body{margin:0;height:100%;background:#8B3A30;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1024px;height:768px;transform-origin:center center;overflow:hidden;background:#FFF3D6;touch-action:none}
canvas#game{position:absolute;left:0;top:0;width:1024px;height:768px}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:none;display:none}
.screen.on{display:block}
.screen > *{pointer-events:auto}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;padding:0}
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:220px;height:74px;padding:0 34px;border-radius:40px;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(#8FC08A,#3F7D5B);box-shadow:0 6px 0 #2C5A40,0 12px 22px rgba(0,0,0,.25);border:4px solid #fff;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #2C5A40,0 6px 12px rgba(0,0,0,.25)}
.big.blue{background:linear-gradient(#6B9BFF,#2F6BFF);box-shadow:0 6px 0 #1E48B0,0 12px 22px rgba(0,0,0,.25)}
.big.blue:active{box-shadow:0 2px 0 #1E48B0,0 6px 12px rgba(0,0,0,.25)}
.big.orange{background:linear-gradient(#F2B48B,#E88F4D);box-shadow:0 6px 0 #B5652A,0 12px 22px rgba(0,0,0,.25)}
.big.orange:active{box-shadow:0 2px 0 #B5652A,0 6px 12px rgba(0,0,0,.25)}
.big[disabled]{opacity:.5;transform:none}
.rbtn{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--ink);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.rbtn:active{transform:translateY(3px);box-shadow:none}
#btnClose{left:18px;top:18px}
#btnSound{right:18px;top:18px;font-size:26px}
#btnLang{right:96px;top:18px;font-size:20px}
#logo{position:absolute;left:0;right:0;top:40px;pointer-events:none;text-align:center;font-size:74px;font-weight:900;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink),0 10px 24px rgba(0,0,0,.25);animation:bob 3s ease-in-out infinite}
#logo small{display:block;font-size:26px;-webkit-text-stroke:0;text-shadow:none;color:var(--ink);font-weight:700;margin-top:6px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#bands{position:absolute;left:0;right:0;top:392px;display:flex;justify-content:center;gap:12px}
#bands button{height:60px;min-width:150px;padding:0 20px;border-radius:30px;background:#fff;border:4px solid var(--ink);font-size:24px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#bands button.on{background:var(--yellow);transform:scale(1.08)}
#levels{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:24px;font-weight:800}
#levels button{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--ink);font-size:28px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#levels button.on{background:var(--yellow);transform:scale(1.12)}
#lvlHint{position:absolute;left:40px;right:40px;top:548px;text-align:center;font-size:20px;font-weight:700;color:#5A6377}
#btnStart{position:absolute;right:44px;top:650px}
#btnParent{position:absolute;right:18px;top:96px;height:44px;padding:0 16px;border-radius:22px;background:#fff;border:3px solid var(--ink);font-size:16px;font-weight:800;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.15);touch-action:none}
#btnParent i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--yellow);font-style:normal}
#btnParent.holding i{width:100%;transition:width 2s linear}
#btnParent span{position:relative}
#btnSetAge{position:absolute;right:44px;top:590px;height:44px;padding:0 16px;border-radius:22px;background:#fff;border:3px solid var(--ink);font-size:16px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#gateWrap{position:absolute;inset:0;display:none}
#gateWrap.on{display:block}
#gateCard{width:560px;padding:22px 26px 24px;box-sizing:border-box}
#gateCard h2{margin:0 0 4px;font-size:32px}
#gateAsk{font-size:21px;font-weight:800;margin:6px 0 12px;line-height:1.35;word-break:keep-all}
#gateYear{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
#gateYear span{width:50px;height:58px;box-sizing:border-box;border-radius:12px;border:3px solid var(--ink);background:#F6F8FC;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
#gatePad{display:grid;grid-template-columns:repeat(6,66px);gap:8px;justify-content:center;margin:0 0 16px}
#gatePad button{height:54px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:24px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#gatePad button:active{transform:translateY(2px);box-shadow:none}
.haru{position:absolute;left:22px;bottom:14px;display:flex;align-items:flex-end;gap:10px}
.haru .face{width:110px;height:110px;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.haru .face svg{width:100%;height:100%}
.bubble{position:relative;max-width:520px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:12px 18px;font-size:22px;font-weight:700;line-height:1.35;margin-bottom:26px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bubble::before{content:"";position:absolute;left:-18px;bottom:16px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-12px;bottom:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
#s-title .bubble{max-width:380px}
#s-play .bubble{max-width:440px;font-size:20px}
#lvlBadge{position:absolute;left:96px;top:26px;height:48px;padding:0 16px;border-radius:24px;background:var(--yellow);border:4px solid var(--ink);font-size:20px;font-weight:900;display:flex;align-items:center;white-space:nowrap}
#progress{position:absolute;right:24px;top:22px;height:56px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:4px solid var(--ink);border-radius:32px;padding:0 18px;font-size:24px;font-weight:900}
#progress i{font-style:normal;font-size:26px;letter-spacing:2px}
#btnAct{position:absolute;right:30px;bottom:24px}
#choices{position:absolute;left:640px;top:400px;width:340px;display:none;flex-wrap:wrap;gap:12px;justify-content:center}
#choices.on{display:flex}
#choices button{width:150px;height:74px;border-radius:20px;background:#fff;border:4px solid var(--ink);font-size:34px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#choices.won button{font-size:24px}
#choices.wide{gap:10px}
#choices.wide button{width:340px;height:auto;min-height:58px;padding:6px 12px;font-size:19px;line-height:1.25}
#choices button.ok{background:#DDF3DE;border-color:var(--green)}#choices button.no{background:#FDE7E4;border-color:var(--red);opacity:.6}
#pad{position:absolute;left:650px;top:384px;width:330px;box-sizing:border-box;display:none;flex-direction:column;gap:8px;padding:10px;background:#CBD2DE;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#pad.on{display:flex}
#clockIn{position:absolute;left:650px;top:384px;width:330px;box-sizing:border-box;display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:12px;background:#CBD2DE;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#clockIn.on{display:flex}
#clockIn .cl{display:flex;flex-direction:column;align-items:center;gap:6px}
#clockIn .cl button{width:76px;height:44px;border-radius:12px;background:#fff;border:3px solid var(--ink);font-size:22px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#clockIn .cl button:active{transform:translateY(2px);box-shadow:none}
#clockIn .cl div{width:76px;height:60px;border-radius:12px;background:var(--ink);color:#F2C14E;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center}
#clockIn b{font-size:26px;min-width:12px}
#clOk{width:100%;height:52px;border-radius:14px;background:#DDF3DE;border:3px solid var(--green);font-size:24px;font-weight:900;margin-top:4px}
#padDisp{height:52px;border-radius:12px;background:var(--ink);color:#F2C14E;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:flex-end;padding:0 14px}
#padDisp.empty{color:#5A6377}
#pad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pad .keys button{height:54px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:28px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#pad .keys button:active{transform:translateY(2px);box-shadow:none}
#pad .keys button.okk{background:#DDF3DE;border-color:var(--green);font-size:24px}
#pad .keys button.bs{background:#FDE7E4}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:26px;font-weight:900;padding:10px 26px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.dim{position:absolute;inset:0;background:rgba(28,35,51,.45)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 rgba(0,0,0,.2);text-align:center;animation:cardin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#doneCard{width:640px;padding:26px 30px 30px}
#doneCard h2{margin:0;font-size:44px}
#bigStars{font-size:84px;letter-spacing:6px;margin:6px 0 10px;color:#D9C9A6}
#bigStars i{font-style:normal;display:inline-block;transform:scale(0)}
#bigStars i.on{color:var(--yellow);-webkit-text-stroke:2px var(--ink);animation:star .5s cubic-bezier(.2,1.6,.4,1) forwards}
#bigStars i.off{animation:star .4s forwards}
@keyframes star{to{transform:scale(1)}}
#doneCard p{font-size:24px;font-weight:800;color:#3A4358;margin:0 0 6px}
#doneCard p small{display:block;font-size:17px;font-weight:700;color:#8A93A6;margin:6px 0 10px}
#feel{margin:4px 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#feel b{font-size:24px}
#feel .faces{display:flex;gap:12px}
#feel .faces button{width:150px;height:66px;border-radius:20px;background:#F6F8FC;border:4px solid var(--ink);font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
#feel .faces button i{font-style:normal;font-size:30px}
#feel .faces button.on{background:#FFF3C4;border-color:var(--orange);transform:scale(1.06)}
#feelMsg{font-size:20px;font-weight:800;color:var(--blue);min-height:26px}
#doneCard .row{display:flex;gap:16px;justify-content:center}
/* sound menu (🔊 on the title screen) and the parent voice hint */
#voiceMenu.hidden,#voiceHint.hidden,#vmVoiceRow.hidden{display:none!important}
#voiceMenu{position:absolute;inset:0;z-index:5}
#vmCard{position:absolute;right:18px;top:96px;width:400px;background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 rgba(0,0,0,.2);padding:16px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;text-align:left;animation:vmin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes vmin{0%{transform:translateX(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
#vmCard > b{font-size:19px;color:#5A6377}
.vmb{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border-radius:18px;border:4px solid var(--ink);background:linear-gradient(#fff,#EEF3FC);box-shadow:0 4px 0 var(--ink);font-size:22px;font-weight:900;color:var(--ink);text-align:left;cursor:pointer}
.vmb span{flex:1;word-break:keep-all}.vmb.on{background:linear-gradient(#FFE36B,#FFC22E)}.vmb.sm{font-size:19px;padding:10px 14px}.vmb.cl{background:#fff;color:#5A6377}
.vmb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.vmrow{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:#5A6377}
.vmrow select{flex:1;min-width:0;font-size:17px;font-weight:800;border:4px solid var(--ink);border-radius:14px;padding:8px 10px;background:#F2F6FD;color:var(--ink)}
.vmnew{display:inline-block;width:10px;height:10px;border-radius:50%;background:#FF5D5D;margin-left:8px;vertical-align:middle;box-shadow:0 0 0 2px #fff}
#voiceHint{position:absolute;inset:0;z-index:6}
#vhCard{width:660px;padding:22px 28px 24px;box-sizing:border-box;text-align:left;font-size:19px;font-weight:700;line-height:1.5;word-break:keep-all}
#vhCard #vhWho{display:inline-block;padding:4px 12px;border-radius:999px;background:#EEF3FC;border:3px solid var(--ink);font-size:15px;font-weight:900;color:#5A6377}
#vhCard h2{margin:8px 0 6px;font-size:32px}
#vhCard #vhNow{margin:0 0 8px;padding:8px 12px;border-radius:14px;background:#FFF6D9;border:3px solid #F0D48A;color:#6B4A12;font-size:18px}
#vhCard p{margin:6px 0}#vhCard ol{margin:6px 0 6px 26px;padding:0;font-weight:800}#vhCard li{margin:4px 0}
#vhCard small{display:block;color:#5A6377;font-size:16px;margin-top:6px;line-height:1.45}
#vhCard .big{margin-top:14px;width:100%}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="game"></canvas>
<div id="ui">
  <div id="s-title" class="screen">
    <button class="rbtn" id="btnSound">🔊</button>
    <button class="rbtn" id="btnLang">EN</button>
    <div id="voiceMenu" class="hidden"><div id="vmCard">
      <b id="vmTitle">소리</b>
      <button id="vmMute" class="vmb on">🔊<span>소리 켜짐</span></button>
      <div id="vmVoiceRow" class="vmrow hidden"><span id="vmVoiceL">목소리</span><select id="vmVoice"></select></div>
      <button id="vmSample" class="vmb sm">▶<span>들어보기</span></button>
      <button id="vmHint" class="vmb sm">💡<span>더 자연스러운 목소리 받기</span></button>
      <button id="vmClose" class="vmb sm cl">✕<span>닫기</span></button>
    </div></div>
    <div id="voiceHint" class="hidden"><div class="dim"></div><div class="card" id="vhCard"><span id="vhWho">부모님께</span><h2 id="vhTitle">더 자연스러운 목소리</h2><p id="vhNow"></p><p id="vhIntro"></p><ol id="vhSteps"></ol><p id="vhAfter"></p><small id="vhOther"></small><button class="big blue" id="vhOk">알겠어요</button></div></div>
    <div id="logo">과일 가게 계산대<small>손님이 원하는 만큼 담고, 돈을 계산해 봐!</small></div>
    <div id="bands"><button data-b="K">5–7살</button><button data-b="E1">8–9살</button><button data-b="E2">10–11살</button><button data-b="E3">12–13살</button></div>
    <div id="levels"><span id="lvlLabel">레벨</span><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div>
    <div id="lvlHint"></div>
    <button class="big" id="btnStart">🍎 가게 열기</button>
    <button id="btnParent"><i></i><span>나이 바꾸기 (부모님)</span></button>
    <button id="btnSetAge">아이 나이를 이 묶음으로 저장</button>
    <div class="haru"><div class="face" id="haruT"></div><div class="bubble" id="bubbleT"></div></div>
    <div id="gateWrap"><div class="dim"></div><div class="card" id="gateCard"><h2 id="gateTitle">나이 묶음 바꾸기</h2><p id="gateAsk"></p><div id="gateYear"></div><div id="gatePad"></div><button class="big blue" id="btnGateClose">닫기</button></div></div>
  </div>
  <div id="s-play" class="screen">
    <button class="rbtn" id="btnClose">✕</button>
    <div id="lvlBadge">5–7살 · 레벨 1</div>
    <div id="progress"><span id="progText">손님 1/6</span><i id="progHearts"></i></div>
    <div id="choices"></div>
    <div id="pad"><div id="padDisp"></div><div class="keys"></div></div>
    <div id="clockIn"><div class="cl"><button data-c="h+">▲</button><div id="clH">9</div><button data-c="h-">▼</button></div><b id="clHl">시</b><div class="cl"><button data-c="m+">▲</button><div id="clM">00</div><button data-c="m-">▼</button></div><b id="clMl">분</b><button id="clOk">확인</button></div>
    <button class="big orange" id="btnAct">다 담았어!</button>
    <div class="haru"><div class="face" id="haruP"></div><div class="bubble" id="bubbleP"></div></div>
    <div id="toast"></div>
  </div>
  <div id="s-done" class="screen"><div class="dim"></div>
    <div class="card" id="doneCard"><h2 id="doneTitle">가게 문 닫는 시간!</h2><div id="bigStars"><i>★</i><i>★</i><i>★</i></div><p id="doneMsg"></p><div id="feel"><b id="feelQ">어땠어?</b><div class="faces"><button data-f="hard"><i>😅</i><span>어려웠어</span></button><button data-f="good"><i>🙂</i><span>딱 좋아</span></button><button data-f="easy"><i>😎</i><span>쉬웠어</span></button></div><div id="feelMsg"></div></div><div class="row"><button class="big" id="btnAgain">다시 하기</button><button class="big blue" id="btnTitle">처음으로</button></div></div>
  </div>
</div>
</div></div>
<script>
(function(){
'use strict';
const W=1024,H=768,INK='#1C2333',FONT='-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const Q=new URLSearchParams(location.search);
let LANG=(Q.get('lang')||navigator.language||'ko').slice(0,2)==='en'?'en':'ko';
const CHILD=Q.get('name')||'';
const $=id=>document.getElementById(id);
const num=n=>Number(n).toLocaleString('en-US');
const won=n=>LANG==='ko'?num(n)+'원':'₩'+num(n);
const hasJong=s=>{s=String(s);const c=s.charCodeAt(s.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;};
const jo=(s,a,b)=>s+(hasJong(s)?a:b);
// Korean reading of a number ends in a consonant when the last digit is 0 (십·백·천·만), 1, 3, 6, 7 or 8
const numJong=n=>[0,1,3,6,7,8].includes(Math.abs(Math.round(n))%10);
const nj=(n,a,b)=>num(n)+(numJong(n)?a:b);
// a decimal is read digit by digit after the point ("0.8" = 영 점 팔), so its last digit decides the particle: 0.8은 · 1.25는
const djo=(s,a,b)=>s+([0,1,3,6,7,8].includes(+String(s).slice(-1))?a:b);
const ro=n=>[0,3,6].includes(Math.abs(n)%10)?'으로':'로'; // 3으로, 6으로, 10으로 · 2로, 7로, 8로
const iya=n=>numJong(n)?'이야':'야'; // 6 × 3이야 · 6 × 4야
const joinRang=a=>a.map((s,i)=>i<a.length-1?jo(s,'이랑','랑'):s).join(' ');
const joinEn=a=>a.length<=2?a.join(' and '):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const pl=(f,n)=>n===1?f:f+'s';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad2=m=>String(m).padStart(2,'0');
const kgStr=c=>String(c/100); // c = hundredths of a kg (125 → "1.25")
const gcd=(a,b)=>b?gcd(b,a%b):a;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ── age band × level (LEVELS.md RULE v2 §1, §4) ─── */
const BANDS=['K','E1','E2','E3'],BASE={K:1,E1:6,E2:11,E3:16}; // d = BASE[band] + level − 1 → 1..20, no overlap
const ageBand=a=>a<=7?'K':a<=9?'E1':a<=11?'E2':'E3';

 switch(d){case 1:case 2:return rep(['pack']);case 3:return rep(['sum']);case 4:return rep(['teen','take']);case 5:return rep(['make10','take10','compare']);
  case 6:return ['tens','take2','tens','take2'];case 7:return mix('add2',['sub2','more2','add2']);case 8:return rep(['groups']);case 9:return rep(['pay9']);case 10:return rep(['change10']);
  case 11:return mix('bagsx',['howmany','unitfrac','bagsx']);case 12:return ['bundle','time','bundle','time'];case 13:return mix('unit13',['share','fracsum','unit13','share']);

// prices for one round (LEVELS.md §6.2). K: none. E1: bake-sale prices. E2/E3: one near-real table.
function makePrices(d){const P={},r=(a,b,s)=>ri(Math.ceil(a/s),Math.floor(b/s))*s,nz=(a,b,s)=>{let v;do v=r(a,b,s);while(v%100===0);return v;};
 if(d===9||d===10)FR5.forEach(id=>P[id]=nz(120,480,10));
 else if(d===12){P.pear=nz(1500,3000,10);P.tangerine=nz(3000,3900,10);P.banana=nz(3000,3900,10);P.apple=nz(1250,1500,10);}
 else if(d===14){P.tangerine=nz(200,500,10);P.apple=r(800,1500,100);P.pear=r(1500,3000,100);}
 else if(d===17){P.grape=r(6000,9000,1000);P.tangerine=r(4000,6000,1000);P.apple=r(5000,8000,1000);}
 return P;}

// four answer buttons: the answer + common-mistake distractors, then neighbours; shuffled when drawn
function opts4(ans,cands,o){o=o||{};const step=o.step||1,max=o.max||Infinity,s=[ans];
 for(const c of cands)if(Number.isFinite(c)&&c>0&&c<=max&&c===Math.round(c)&&!s.includes(c)&&s.length<4)s.push(c);
 for(let k=1;s.length<4&&k<50;k++)for(const c of [ans+k*step,ans-k*step])if(c>0&&c<=max&&!s.includes(c)&&s.length<4)s.push(c);
 return shuffle(s);}
const wantOf=items=>{const w={};items.forEach(o=>w[o.id]=(w[o.id]||0)+o.n);return w;};
const tensOf=(id,n,g)=>Array.from({length:Math.floor(n/10)},()=>({id,g,ten:true})).concat(Array.from({length:n%10},()=>({id,g,ten:false})));
const addTime=(h,m,H,M)=>{const tm=((h%12)*60+m+H*60+M)%720,hh=Math.floor(tm/60);return{h:hh===0?12:hh,m:tm%60};};
// best deal (LEVELS.md §6.4): how many options are true for these unit prices
const dealTrue=(opts,a,ua,b,ub)=>opts.filter(o=>o.same?ua===ub:(ua!==ub&&o.pack===(ua<ub?a:b)&&o.diff===Math.abs(ua-ub))).length;
const QTY14={2:[2,4,6,8],5:[5,10,15,20]};
const itemSig=items=>items.map(o=>o.id+':'+o.n).sort().join(',');
function orders14(P,sc,sold){const ids=STAND[14].pool,S14=STAND[14],qs=QTY14[sc],out=[];
 for(let mask=1;mask<1<<ids.length;mask++){const sel=ids.filter((_,i)=>(mask>>i)&1);if(sel.length<2)continue;
  const rec=(i,acc)=>{if(i===sel.length){const tot=acc.reduce((a,o)=>a+P[o.id]*o.n,0);if(tot>=S14.total[0]&&tot<=S14.total[1]&&(!sold||acc.every(o=>(sold[o.id]||0)+o.n<=sc*10)))out.push(acc);return;}for(const q of qs)rec(i+1,acc.concat([{id:sel[i],n:q}]));};rec(0,[]);}
 return out;}
// d14 plans its five orders when the round starts: all different, and each fruit's total fits the graph (≤ 10 steps of the scale)
function plan14(P,sc){const all=orders14(P,sc),n=STAND[14].customers;
 let ok=null;for(let t=0;t<300;t++){const used=new Set(),sold={},out=[];for(const o of shuffle(all.slice())){const sg=itemSig(o);if(used.has(sg)||!o.every(x=>(sold[x.id]||0)+x.n<=sc*10))continue;used.add(sg);o.forEach(x=>sold[x.id]=(sold[x.id]||0)+x.n);out.push(o);if(out.length===n)break;}
  if(out.length===n){if(STAND[14].pool.every(id=>sold[id]))return out;ok=ok||out;}} // prefer a plan in which every fruit sells
 return ok;}
function newCtx(d,P){const c={d,scale:0,sold:{},used:new Set(),n14:0,plan14:null};if(d!==14||!P)return c;
 for(const sc of shuffle(STAND[14].scales.slice()).concat([2])){const pl=plan14(P,sc);if(pl){c.scale=sc;c.plan14=pl;return c;}}
 c.scale=2;return c;}
