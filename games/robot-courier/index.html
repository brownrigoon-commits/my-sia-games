<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8FD8FF">
<title>로봇 배달부 · MY SIA</title>
<style id="sia-kit-css">
/* MY SIA game kit — overlay UI. 1rem = 16 design px on a 1024x768 stage (kit.js scales the root font size). */
:root {
  --sk-ink: #22305C;
  --sk-ink-2: #44507E;
  --sk-paper: #FFFFFF;
  --sk-cream: #FFF7E8;
  --sk-blue: #4A86FF;  --sk-blue-2: #2F64E8;
  --sk-green: #63D85A; --sk-green-2: #2EA94A;
  --sk-yellow: #FFD23F; --sk-yellow-2: #F5A91A;
  --sk-pink: #FF74AE;  --sk-pink-2: #E4488A;
  --sk-orange: #FF9442; --sk-orange-2: #E86D1E;
  --sk-purple: #9673FF; --sk-purple-2: #6C4BE6;
  --sk-sky: #6FD0FF;   --sk-sky-2: #2EA3EC;
  --sk-red: #FF5C57;
  --sk-gold: #FFC83A;
  --sk-line: 0.22rem;
  --sk-font: "Apple SD Gothic Neo", "AppleSDGothicNeo-Heavy", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE9FF; overscroll-behavior: none; }
body { font-family: var(--sk-font); color: var(--sk-ink); -webkit-text-size-adjust: 100%; position: fixed; inset: 0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#sk-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* boot screen (pure CSS, visible until kit.js adds .sk-ready) */
body:not(.sk-ready)::before { content: ""; position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle at 50% 46%, #4A86FF 0 3.4rem, transparent 3.5rem), linear-gradient(180deg, #8FD8FF, #DDF6FF); animation: sk-boot 0.9s ease-in-out infinite alternate; }
body:not(.sk-ready)::after { content: "MY SIA"; position: fixed; left: 0; right: 0; top: 62%; text-align: center; z-index: 100; font: 900 2rem var(--sk-font); color: #fff; letter-spacing: .1em; text-shadow: 0 .18rem 0 var(--sk-ink); }
@keyframes sk-boot { from { background-position: 0 0, 0 0; } to { background-position: 0 -1.2rem, 0 0; } }
.sk-error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 200; background: linear-gradient(180deg, #8FD8FF, #DDF6FF); font: 800 1.6rem/1.5 var(--sk-font); color: var(--sk-ink); padding: 2rem; }

/* ---------- layers ---------- */
#sk-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: var(--sk-font);
  /* Korean line breaking: break between words, never inside one (자업자 / 득); a word too long for its box still wraps */
  word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
#sk-ui > div { position: absolute; inset: 0; pointer-events: none; }
#sk-ui .sk-hit, #sk-ui button { pointer-events: auto; }
.sk-hide { display: none !important; }

/* ---------- outlined chunky text ---------- */
.sk-ol { position: relative; display: inline-block; z-index: 0; color: #fff; }
.sk-ol::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; -webkit-text-stroke: var(--sk-ol-w, .55rem) var(--sk-ol-c, var(--sk-ink)); color: var(--sk-ol-c, var(--sk-ink)); text-shadow: 0 var(--sk-ol-drop, .3rem) 0 var(--sk-ol-c, var(--sk-ink)); }

/* ---------- buttons ---------- */
.sk-btn { --c1: var(--sk-green); --c2: var(--sk-green-2); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  font: 800 1.55rem/1 var(--sk-font); color: #fff; padding: .78rem 1.7rem .86rem; min-height: 3.6rem; border-radius: 999px; cursor: pointer;
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: inset 0 -.32rem 0 rgba(0,0,0,.13), 0 .34rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.22);
  text-shadow: 0 .12rem 0 rgba(0,0,0,.22); transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; outline: none; }
.sk-btn::before { content: ""; position: absolute; left: 10%; right: 10%; top: .22rem; height: 40%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.08)); pointer-events: none; }
.sk-btn > * { position: relative; }
.sk-btn svg { width: 1.5em; height: 1.5em; flex: none; }
.sk-btn:active, .sk-btn.sk-press { transform: translateY(.26rem); box-shadow: inset 0 -.2rem 0 rgba(0,0,0,.13), 0 .08rem 0 var(--sk-ink), 0 .3rem .6rem rgba(20,40,90,.2); }
.sk-btn[disabled], .sk-btn.sk-off { --c1: #D6DCE6; --c2: #AEB7C6; opacity: .8; }
.sk-btn.sk-blue { --c1: var(--sk-blue); --c2: var(--sk-blue-2); }
.sk-btn.sk-yellow { --c1: var(--sk-yellow); --c2: var(--sk-yellow-2); color: var(--sk-ink); text-shadow: 0 .1rem 0 rgba(255,255,255,.5); }
.sk-btn.sk-pink { --c1: var(--sk-pink); --c2: var(--sk-pink-2); }
.sk-btn.sk-orange { --c1: var(--sk-orange); --c2: var(--sk-orange-2); }
.sk-btn.sk-purple { --c1: var(--sk-purple); --c2: var(--sk-purple-2); }
.sk-btn.sk-sky { --c1: var(--sk-sky); --c2: var(--sk-sky-2); }
.sk-btn.sk-white { --c1: #FFFFFF; --c2: #E6EEFA; color: var(--sk-ink); text-shadow: none; }
.sk-btn.sk-big { font-size: 2.1rem; padding: 1rem 2.6rem 1.1rem; min-height: 4.6rem; }

.sk-icon { position: relative; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sk-ink);
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, #FFFFFF, #E4ECFA); box-shadow: inset 0 -.25rem 0 rgba(30,60,120,.12), 0 .26rem 0 var(--sk-ink), 0 .5rem .8rem rgba(20,40,90,.2);
  font: 900 1.15rem/1 var(--sk-font); transition: transform .08s, box-shadow .08s; touch-action: manipulation; padding: 0; outline: none; }
.sk-icon::before { content: ""; position: absolute; left: 18%; right: 18%; top: .16rem; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); pointer-events: none; }
.sk-icon svg { width: 58%; height: 58%; position: relative; }
.sk-icon:active, .sk-icon.sk-press { transform: translateY(.2rem); box-shadow: inset 0 -.15rem 0 rgba(30,60,120,.12), 0 .06rem 0 var(--sk-ink); }
.sk-icon.sk-on { background: linear-gradient(180deg, #FFE36B, #FFC22E); }

/* ---------- HUD ---------- */
.sk-top { position: absolute; top: 1.1rem; left: 1.2rem; right: 1.2rem; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.sk-top .sk-group { display: flex; gap: .7rem; align-items: center; pointer-events: none; }
.sk-top .sk-icon, .sk-top .sk-chip, .sk-top .sk-starbar { pointer-events: auto; }
.sk-chip { position: absolute; left: 50%; top: 1.1rem; transform: translateX(-50%); display: flex; align-items: center; gap: .7rem; padding: .35rem 1.3rem .35rem .45rem; min-height: 3.5rem;
  background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.2); font: 900 1.6rem/1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }
.sk-chip .sk-chip-ico { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: radial-gradient(circle at 35% 30%, #fff, #DFF3FF 70%); border: .16rem solid var(--sk-ink); }
.sk-chip .sk-chip-bar { width: 7.5rem; height: 1.05rem; border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); overflow: hidden; }
.sk-chip .sk-chip-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(180deg, #8CF06B, #34B84A); box-shadow: inset 0 .2rem 0 rgba(255,255,255,.5); transition: width .45s cubic-bezier(.3,1.6,.5,1); }
.sk-chip .sk-chip-label { font-size: 1.05rem; color: var(--sk-ink-2); font-weight: 800; }
.sk-bump { animation: sk-bump .42s cubic-bezier(.3,1.7,.5,1); }
@keyframes sk-bump { 0% { scale: 1; } 35% { scale: 1.22; } 100% { scale: 1; } }

.sk-starbar { display: flex; gap: .1rem; align-items: center; padding: .3rem .7rem; height: 3.5rem; background: rgba(255,255,255,.92); border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink); }
.sk-starbar svg { width: 2.35rem; height: 2.35rem; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
.sk-starbar svg.sk-lit { transform: scale(1.12) rotate(-6deg); }

/* ---------- star svg ---------- */
.sk-star-e path.f { fill: #D9E0EE; } .sk-star-e path.h { opacity: 0; }
.sk-star path.f { fill: url(#skGold); } .sk-star path { stroke: var(--sk-ink); stroke-width: 7; stroke-linejoin: round; }
.sk-star path.h, .sk-star-e path.h { stroke: none; fill: #fff; opacity: .55; }

/* ---------- speech bubble ---------- */
.sk-bubble { position: absolute; max-width: 23rem; min-width: 8rem; padding: .95rem 1.25rem 1rem; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 1.5rem;
  box-shadow: 0 .3rem 0 var(--sk-ink), 0 .8rem 1.4rem rgba(20,40,90,.2); font: 800 1.4rem/1.38 var(--sk-font); color: var(--sk-ink); transform: translate(-50%, -100%); transform-origin: 50% 100%;
  pointer-events: auto; cursor: pointer; word-break: keep-all; overflow-wrap: break-word; animation: sk-bubble-in .32s cubic-bezier(.3,1.6,.5,1); }
.sk-bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -.95rem; width: 1.3rem; height: 1.3rem; background: #fff; border-right: var(--sk-line) solid var(--sk-ink); border-bottom: var(--sk-line) solid var(--sk-ink); transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: .3rem; box-shadow: .3rem .3rem 0 -0.05rem rgba(34,48,92,1); }
.sk-bubble .sk-who { display: inline-flex; align-items: center; gap: .3rem; font-size: .95rem; color: #fff; background: var(--sk-blue); border: .14rem solid var(--sk-ink); border-radius: 999px; padding: .12rem .6rem .14rem; margin: 0 0 .4rem -.2rem; }
.sk-bubble .sk-who svg { width: 1rem; height: 1rem; }
.sk-bubble.sk-out { animation: sk-bubble-out .2s ease-in forwards; }
@keyframes sk-bubble-in { from { transform: translate(-50%, -100%) scale(.4); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
@keyframes sk-bubble-out { to { transform: translate(-50%, -100%) scale(.6); opacity: 0; } }

/* ---------- 3D-anchored tag ---------- */
.sk-tag { position: absolute; transform: translate(-50%, -50%); padding: .3rem .85rem .36rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: .9rem; box-shadow: 0 .2rem 0 var(--sk-ink); font: 800 1.15rem/1.1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }

/* ---------- pop text ---------- */
.sk-pop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 900 var(--size, 3rem)/1 var(--sk-font); pointer-events: none; animation: sk-pop var(--dur, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.sk-pop .sk-ol { color: var(--fill, #FF5C57); --sk-ol-c: #fff; --sk-ol-w: .7rem; --sk-ol-drop: 0rem; }
.sk-pop .sk-ol::after { content: attr(data-t); position: absolute; left: 0; top: .3rem; z-index: -2; -webkit-text-stroke: .7rem var(--sk-ink); color: var(--sk-ink); opacity: .9; }
@keyframes sk-pop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; } 26% { transform: translate(-50%, -50%) scale(.95) rotate(-1deg); } 34% { transform: translate(-50%, -50%) scale(1) rotate(0); } 78% { transform: translate(-50%, calc(-50% - var(--rise, 3rem))) scale(1); opacity: 1; } 100% { transform: translate(-50%, calc(-50% - var(--rise, 3rem) * 1.3)) scale(.9); opacity: 0; } }

.sk-fly { position: absolute; transform: translate(-50%, -50%); font-size: 2.6rem; line-height: 1; text-shadow: 0 .2rem 0 rgba(34,48,92,.35); pointer-events: none; }

/* ---------- toast ---------- */
.sk-toast { position: absolute; left: 50%; top: 5.6rem; transform: translateX(-50%); padding: .7rem 1.4rem .75rem; background: var(--sk-ink); color: #fff; border-radius: 999px; font: 800 1.3rem/1.2 var(--sk-font); box-shadow: 0 .5rem 1rem rgba(20,40,90,.3); animation: sk-toast 2.2s ease forwards; white-space: nowrap; display: flex; gap: .5rem; align-items: center; }
@keyframes sk-toast { 0% { transform: translate(-50%, -1.5rem); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -.6rem); opacity: 0; } }

/* ---------- panels ---------- */
.sk-card { position: absolute; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 2rem; box-shadow: 0 .42rem 0 var(--sk-ink), 0 1.2rem 2.4rem rgba(20,40,90,.28); pointer-events: auto; }
.sk-dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(20,40,90,.18), rgba(20,40,90,.48)); pointer-events: auto; animation: sk-fade .3s ease; }
@keyframes sk-fade { from { opacity: 0; } }
.sk-in { animation: sk-card-in .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-card-in { from { transform: translateY(2.5rem) scale(.8); opacity: 0; } }
.sk-in-r { animation: sk-card-in-r .55s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes sk-card-in-r { from { transform: translateX(6rem) scale(.9); opacity: 0; } }
.sk-out { animation: sk-card-out .25s ease-in forwards; pointer-events: none !important; }
@keyframes sk-card-out { to { transform: translateY(1.5rem) scale(.9); opacity: 0; } }

/* ---------- title screen ---------- */
.sk-title-head { position: absolute; left: 2.4rem; top: 5.6rem; max-width: 34rem; pointer-events: none; animation: sk-card-in .7s cubic-bezier(.3,1.5,.5,1) both; }
.sk-brand { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .9rem .32rem .35rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1rem/1 var(--sk-font); letter-spacing: .06em; color: var(--sk-ink); }
.sk-brand i { width: 1.45rem; height: 1.45rem; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; background: radial-gradient(circle at 35% 30%, #8DB4FF, #3E7BFF 60%); border: .14rem solid var(--sk-ink); display: inline-block; }
.sk-title-text { margin-top: .7rem; font: 900 4.4rem/1.04 var(--sk-font); letter-spacing: -.01em; --sk-ol-w: .75rem; --sk-ol-drop: .42rem; }
.sk-title-text .sk-ol { color: #fff; }
.sk-title-text .sk-ol.sk-c2 { color: #FFE14D; }
.sk-title-sub { margin-top: .9rem; display: inline-block; padding: .5rem 1.1rem .55rem; border-radius: 1rem; background: rgba(255,255,255,.9); border: .18rem solid var(--sk-ink); box-shadow: 0 .22rem 0 var(--sk-ink); font: 800 1.35rem/1.3 var(--sk-font); }
.sk-titlescreen, .sk-resultscreen { position: absolute; inset: 0; pointer-events: none; }
.sk-title-right { position: absolute; right: 2.2rem; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; }
.sk-title-card { position: relative; width: 25.5rem; padding: 1.5rem 1.6rem 1.6rem; display: flex; flex-direction: column; gap: 1rem; }
.sk-title-card .sk-hello { font: 900 1.65rem/1.2 var(--sk-font); }
.sk-title-card .sk-hello b { color: var(--sk-blue-2); }
.sk-lbl { font: 800 1rem/1 var(--sk-font); color: var(--sk-ink-2); margin-bottom: .5rem; display: flex; justify-content: space-between; align-items: baseline; }
.sk-lbl em { font-style: normal; color: var(--sk-blue-2); font-weight: 900; }
.sk-bands { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.sk-band { position: relative; padding: .6rem .4rem .62rem; border-radius: 1.1rem; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #fff, #EEF3FC); box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; touch-action: manipulation; transition: transform .08s; }
.sk-band small { display: block; margin-top: .25rem; font: 800 .78rem/1 var(--sk-font); color: var(--sk-ink-2); }
.sk-band.sk-sel { background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; }
.sk-band.sk-sel small { color: #E3EDFF; }
.sk-band:active { transform: translateY(.15rem); box-shadow: 0 .05rem 0 var(--sk-ink); }
.sk-bandchip { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: 999px; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; font: 900 1.2rem/1 var(--sk-font); box-shadow: 0 .2rem 0 var(--sk-ink); align-self: flex-start; }
.sk-bandchip small { font: 800 .85rem/1 var(--sk-font); opacity: .9; }
.sk-dial { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0; height: 3.6rem; }
.sk-dial::before { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); }
.sk-dial .sk-fill { position: absolute; left: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(180deg, #FFE36B, #FFB21E); border: .16rem solid var(--sk-ink); transition: width .35s cubic-bezier(.3,1.4,.5,1); }
.sk-dial button { position: relative; width: 2.8rem; height: 2.8rem; border-radius: 50%; border: .18rem solid var(--sk-ink); background: #fff; font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; box-shadow: 0 .18rem 0 var(--sk-ink); transition: transform .25s cubic-bezier(.3,1.8,.5,1), background .2s; padding: 0; touch-action: manipulation; }
.sk-dial button.sk-past { background: linear-gradient(180deg, #FFE36B, #FFB21E); }
.sk-dial button.sk-sel { transform: scale(1.32); background: linear-gradient(180deg, #FFE36B, #FFAE14); z-index: 1; }
.sk-dial button.sk-sel::after { content: ""; position: absolute; inset: -.5rem; border-radius: 50%; border: .16rem dashed rgba(34,48,92,.45); animation: sk-spin 6s linear infinite; }
@keyframes sk-spin { to { transform: rotate(360deg); } }
.sk-hint { word-break: keep-all; display: flex; gap: .65rem; align-items: center; padding: .7rem .85rem; border-radius: 1.1rem; background: #FFF6D9; border: .16rem solid #F0D48A; font: 800 1.05rem/1.35 var(--sk-font); color: #6B4A12; min-height: 3.6rem; }
.sk-hint svg { width: 1.9rem; height: 1.9rem; flex: none; }
.sk-title-card .sk-btn { width: 100%; }
.sk-need { font: 800 .95rem/1.2 var(--sk-font); color: var(--sk-pink-2); text-align: center; margin-top: -.4rem; }

/* ---------- results ---------- */
.sk-resultscreen { display: flex; align-items: center; justify-content: center; }
.sk-resultscreen.sk-res-right { justify-content: flex-end; padding-right: 6%; }
.sk-resultscreen.sk-res-right .sk-dim { background: linear-gradient(90deg, rgba(20,40,90,0) 0%, rgba(20,40,90,.12) 35%, rgba(20,40,90,.45) 100%); }
.sk-res { position: relative; width: 32rem; padding: 3.1rem 1.8rem 1.6rem; text-align: center; }
.sk-res.sk-in { animation: sk-res-in .55s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-res-in { from { transform: translateY(3rem) scale(.75); opacity: 0; } }
.sk-ribbon { position: absolute; z-index: 3; left: 50%; top: -1.9rem; transform: translateX(-50%); padding: .7rem 2.6rem .8rem; background: linear-gradient(180deg, #FF8EC0, #F0558F); border: var(--sk-line) solid var(--sk-ink); border-radius: 1.2rem; box-shadow: 0 .3rem 0 var(--sk-ink); white-space: nowrap; font: 900 2.1rem/1 var(--sk-font); }
.sk-ribbon .sk-ol { color: #fff; --sk-ol-w: .45rem; --sk-ol-drop: .2rem; }
.sk-res-stars { display: flex; justify-content: center; align-items: flex-end; gap: .2rem; height: 7.2rem; margin: .2rem 0 .3rem; }
.sk-res-stars svg { width: 5.6rem; height: 5.6rem; opacity: 0; }
.sk-res-stars svg:nth-child(2) { width: 7rem; height: 7rem; margin-bottom: .9rem; }
.sk-res-stars svg.sk-show { animation: sk-star-in .55s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes sk-star-in { 0% { opacity: 0; transform: scale(2.4) rotate(-40deg); } 60% { opacity: 1; transform: scale(.88) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.sk-res-sub { font: 800 1.2rem/1.35 var(--sk-font); color: var(--sk-ink-2); min-height: 1.6rem; word-break: keep-all; overflow-wrap: break-word; white-space: pre-line; text-wrap: pretty; }
/* the big moment: a cheering 2D Haru leans out of the card's top-left corner (beside the stars) */
.sk-res-haru { position: absolute; left: -3.8rem; top: -1.6rem; width: 10rem; height: 11.5rem; pointer-events: none; z-index: 2; transform-origin: 60% 90%; animation: sk-haru-in .7s cubic-bezier(.3,1.6,.5,1) .28s both; } /* no CSS filter here: filter + animation can stop drawing on iOS 26 and older */

<!--
  MY SIA · 로봇 배달부 / Robot Courier (coding: sequences, debugging, loops, conditions, functions, variables, coordinates, efficiency)
  A toy town on a grid. The child builds a program from command tiles, presses Go, and the delivery robot runs it step by step.
  URL: ?band=K|E1|E2|E3  &age=5..13  &level=1-5  &lang=ko|en  &locklang=1  &name=시아
  Test hooks: window.__game  (phase(), taskInfo(), solution(), mistake(), program(), robotCell(), delivered(), firstTry(), stars(), narrateLog(), narrateStats(), rect(sel), perf())
  Checks: C:/dev/gamecheck/rc-content-check.mjs (every task of both sets through the engine, in Node), C:/dev/gamecheck/robot-courier.mjs (full rounds, real taps)
-->
<script data-inline="engine.js">
/* Robot Courier — the town grid, the program model, the interpreter, the solver and the mistake finder.
 * No DOM and no THREE here, so the content checker can run every task in Node (C:/dev/gamecheck/rc-content-check.mjs).
 *
 * Map: one string, rows top to bottom joined by '/'. x = column from the left, y = row from the BOTTOM (as on a graph).
 *   .  road            #  house / shop        *  trees, park         ~  river        =  bridge (road)
 *   %  closed road (cones)                    ?  road that may be closed (if-tasks: each variant closes some of them)
 *   @  start (road)    +  parcel to pick up (road)                    1 2 3 4  doorsteps of the delivery houses (road)
 * Program: { main: [node…], fns: { f: [node…] } }. A node is
 *   'u' 'd' 'l' 'r'   K arrows: face up / down / left / right on the map and drive one cell
 *   'F' 'L' 'R'       forward one cell · turn left · turn right (on the spot)
 *   'P' 'D'           pick up the parcel here · drop off a parcel here
 *   { rep: n | 'var' | '?', body: […] }                 repeat
 *   { if: 'blocked', then: […], else: […] }              branch on the cell ahead
 *   { call: 'f' }                                        run function f
 *   { set: 'v', to: n } · { add: 'v', by: n }            variables
 *   '?'               a blank (fill-in tasks): runs as nothing, never valid
 */
(function (root) {
  'use strict';
  var RC = root.RC = root.RC || {};
  var D4 = [[0, 1], [1, 0], [0, -1], [-1, 0]];          // N E S W as (dx, dy)
  var DIR = { N: 0, E: 1, S: 2, W: 3 };
  var ABS = { u: 0, r: 1, d: 2, l: 3 };
  var DRIVE = '.@+=1234?';
  var NEAR = { u: 'near.u', d: 'near.d', l: 'near.l', r: 'near.r' };   // diagnose(): the K line keys for a house one square away
  var MAX_STEPS = 400;

  // ---------------------------------------------------------------- the map
  function parse(t) {
    if (t._w) return t._w;
    var rows = t.map.split('/'), h = rows.length, w = rows[0].length, cell = [], start = null, targets = {}, parcels = [], maybes = [];
    for (var r = 0; r < h; r++) {
      if (rows[r].length !== w) throw new Error(t.id + ': row ' + r + ' has ' + rows[r].length + ' cells, not ' + w);
      var y = h - 1 - r;
      for (var x = 0; x < w; x++) {
        var ch = rows[r][x]; (cell[y] = cell[y] || [])[x] = ch;
        if (ch === '@') start = { x: x, y: y };
        else if (ch === '+') parcels.push({ x: x, y: y });
        else if (ch === '?') maybes.push({ x: x, y: y });
        else if (ch >= '1' && ch <= '4') targets[ch] = { x: x, y: y, k: ch };
        else if ('.#*~=%'.indexOf(ch) < 0) throw new Error(t.id + ': unknown cell "' + ch + '"');
      }
    }
    if (!start) throw new Error(t.id + ': no start @');
    var W = t._w = { w: w, h: h, cell: cell, start: start, targets: targets, parcels: parcels, maybes: maybes };
    W.parcelAt = {}; parcels.forEach(function (p) { W.parcelAt[p.x + ',' + p.y] = true; });
    W.targetAt = {}; Object.keys(targets).forEach(function (k) { W.targetAt[targets[k].x + ',' + targets[k].y] = k; });
    return W;
  }
  /** parcels on board at the start: t.carry, else one per doorstep to serve when nothing waits on the road (K: one) */
  function carry0(t, W) { return t.carry != null ? t.carry : t.mode === 'abs' ? 1 : W.parcels.length ? 0 : (t.need || []).length; }
  function at(W, x, y) { return x < 0 || y < 0 || x >= W.w || y >= W.h ? null : W.cell[y][x]; }
  /** closed maybe-cells of a variant: t.variants = [[i…], [i…]] (indices into the '?' cells in reading order) */
  function closedSet(t, W, variant) {
    var s = {}; if (!t.variants || variant == null) return s;
    (t.variants[variant] || []).forEach(function (i) { var m = W.maybes[i]; if (m) s[m.x + ',' + m.y] = true; });
    return s;
  }
  function free(W, closed, x, y) { var c = at(W, x, y); return c != null && DRIVE.indexOf(c) >= 0 && !(c === '?' && closed[x + ',' + y]); }
  function whatBlocks(W, closed, x, y) {
    var c = at(W, x, y); if (c == null) return 'edge';
    return c === '#' ? 'house' : c === '*' ? 'tree' : c === '~' ? 'water' : c === '%' || c === '?' ? 'cone' : 'edge';
  }
  RC.DIR = DIR; RC.D4 = D4; RC.ABS = ABS;

  // ---------------------------------------------------------------- programs
  function prog(p) { if (Array.isArray(p)) return { main: p, fns: {} }; return { main: p && p.main || [], fns: p && p.fns || {} }; }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  /** number of blocks the child placed: every node counts 1 (a repeat or an if is one block plus its body); function bodies count too */
  function blocks(p) {
    p = prog(p);
    function n(list) { var k = 0; (list || []).forEach(function (x) { k += 1; if (x && typeof x === 'object') k += n(x.body) + n(x.then) + n(x['else']); }); return k; }
    var k = n(p.main); Object.keys(p.fns).forEach(function (f) { k += n(p.fns[f]); }); return k;
  }
  /** does the program still hold a blank ('?' or a repeat count '?')? */
  function hasBlank(p) {
    p = prog(p); var b = false;
    function walk(list) { (list || []).forEach(function (x) { if (x === '?') b = true; else if (x && typeof x === 'object') { if (x.rep === '?' || x.to === '?' || x.by === '?') b = true; walk(x.body); walk(x.then); walk(x['else']); } }); }
    walk(p.main); Object.keys(p.fns).forEach(function (f) { walk(p.fns[f]); }); return b;
  }
  /** node at a path (['main', 2, 'body', 0] or ['fn', 'f', 1]) */
  function nodeAt(p, path) {
    p = prog(p); var cur = path[0] === 'fn' ? p.fns[path[1]] : p.main, i = path[0] === 'fn' ? 2 : 1, n = null;
    for (; i < path.length; i++) { var k = path[i]; if (typeof k === 'number') { n = cur && cur[k]; } else { cur = n && n[k]; } }
    return n;
  }
  /** flatten a program the way it runs (for "how many moves" and hints): list of {op, path} */
  function flat(t, p, o) {
    var r = run(t, p, o); return r.trace.filter(function (e) { return e.op === 'move' || e.op === 'turn' || e.op === 'pick' || e.op === 'drop' || e.op === 'bump'; });
  }

  // ---------------------------------------------------------------- the interpreter
  /**
   * run(task, program, {variant}) → { ok, trace:[{op, path, x, y, d, carry, …}], crash, bad, stop, moves, turns, delivered, end }
   * ops in the trace: move bump turn pick pickNone drop dropNone wrongHouse dropRoad rep iter check call ret var
   */
  function run(t, p0, o) {
    o = o || {}; var W = parse(t), p = prog(p0), closed = closedSet(t, W, o.variant), auto = t.mode === 'abs';
    var st = { x: W.start.x, y: W.start.y, d: DIR[t.dir || 'N'], carry: carry0(t, W), picked: {}, delivered: {}, vars: clone(t.vars || {}), steps: 0, moves: 0, turns: 0 };
    var trace = [], R = { trace: trace, crash: null, bad: null, stop: null, passed: {} };
    function ev(e) { e.x = st.x; e.y = st.y; e.d = st.d; e.carry = st.carry; e.vars = clone(st.vars); trace.push(e); return e; }

<script data-inline="town.js">
/* Robot Courier — the 3D town: the meadow around it (once), one toy-town board per task (built from the task's map), the robot.
 * Board: a grass island on a wooden base; roads are tiles with lane dashes towards every connected neighbour; doorsteps carry a
 * coloured mat, a mailbox and a floating pin; the house next to a doorstep wears the doorstep's colour (other houses are neutral, so
 * "the red house" is never ambiguous); rivers are blue tiles with sandy banks, bridges are wooden decks with rails.
 */
(function () {
  'use strict';
  var K = window.SiaKit, T = window.THREE, RC = window.RC; if (!T || !RC) return;
  var V = K.v3, W = K.world, E = RC.engine;
  var S = 2;   // one square of the grid in world units
  var COL = { red: '#FF4F5E', blue: '#3D86FF', yellow: '#FFC531', green: '#33C26B', purple: '#9A63FF', orange: '#FF8A26', pink: '#FF74B3' };
  var DEF = { 1: 'red', 2: 'blue', 3: 'yellow', 4: 'green' };
  var TOWN = RC.town = { S: S, COL: COL };
  var hash = function (x, y, k) { var h = Math.sin(x * 127.1 + y * 311.7 + (k || 0) * 74.7) * 43758.5453; return h - Math.floor(h); };
  var tint = function (hex, k) { var c = new T.Color(hex); c.lerp(new T.Color('#FFFFFF'), k); return '#' + c.getHexString(); };
  TOWN.colorOf = function (t, k) { return (t.color && t.color[k]) || DEF[k] || 'red'; };

  // ---------------------------------------------------------------- the meadow, hills and far village (built once)
  TOWN.surroundings = function (st) {
    W.sky(st, { fogNear: 60, fogFar: 190, sun: [-0.45, 0.75, 0.5] });
    W.lights(st, { box: 13, target: [0, 0, 0], intensity: 1.7, mapSize: 2048, dir: [-0.42, 0.85, 0.32] });
    var ground = W.terrain(st, { flat: [{ x: 0, z: 0, r: 26 }], size: 220, seg: 120, seed: 9 });
    var props = [], r = K.rng(31);
    // a ring of trees and a few far houses around the board area (never in front of the camera)
    for (var i = 0; i < 70; i++) {
      var a = r() * Math.PI * 2, d = 19 + r() * 30, x = Math.cos(a) * d, z = Math.sin(a) * d - 4;
      if (z > 8 && Math.abs(x) < 26) continue;
      props.push(W.place(st, W.tree({ style: ['round', 'pine', 'round', 'poplar'][i % 4], h: 1.1 + r() * 0.7, seed: 400 + i }), x, z, { rot: r() * 6 }));
    }
    for (var j = 0; j < 9; j++) {
      var hx = -30 + j * 7.5 + (r() - 0.5) * 2, hz = -30 - r() * 6, parts = [];
      houseParts(parts, 0, 0, 0, { wall: ['#FFF4E2', '#EAF3FF', '#FFE9DA'][j % 3], roof: ['#A0785A', '#7D879C', '#C46A5A', '#5E7FA8'][j % 4], door: '#7A5236', seed: j, big: true });
      var hm = K.partsMesh(parts, { seed: 70 + j }); hm.position.set(hx, ground.heightAt(hx, hz), hz); hm.rotation.y = (r() - 0.5) * 0.5; hm.scale.setScalar(1.6); st.add(hm); props.push(hm);
    }
    for (var b = 0; b < 26; b++) { var ba = r() * Math.PI * 2, bd = 16 + r() * 8, bx = Math.cos(ba) * bd, bz = Math.sin(ba) * bd - 3; if (bz > 9 && Math.abs(bx) < 20) continue; props.push(W.place(st, W.bush({ s: 0.8 + r() * 0.5, seed: 600 + b, flowers: ['#FF8FC0', '#FFFFFF', '#FFD23F', null][b % 4] }), bx, bz, { rot: r() * 6 })); }
    W.merge(st, props);
    W.flowerField(st, { count: 160, x: 0, z: 0, w: 46, d: 40, avoid: function (x, z) { return Math.abs(x) < 10.5 && Math.abs(z) < 9; }, seed: 12 });
    W.grass(st, { count: 260, x: 0, z: 0, w: 50, d: 44, avoid: function (x, z) { return Math.abs(x) < 10 && Math.abs(z) < 8.5; }, seed: 14 });
    [[-40, 26, -95, 3.0], [10, 30, -110, 3.6], [55, 24, -90, 2.8], [-85, 22, -80, 2.6], [90, 27, -100, 3.2]].forEach(function (c, i) {
      var cl = W.cloud({ s: c[3], seed: 210 + i, puffs: 4 + (i % 3), drift: 0.7 + (i % 3) * 0.3, x0: -140, x1: 140 }); cl.position.set(c[0], c[1], c[2]); st.add(cl);
    });
    W.butterfly(st, { x: -12, z: 6, color: '#FF8FC0', r: 2.4, y: 1.4 });
    W.butterfly(st, { x: 13, z: -5, color: '#FFD23F', r: 2.0, y: 1.2, speed: 0.75 });
    return ground;
  };

  // ---------------------------------------------------------------- toy houses (parts in local space; front = +z)
  function houseParts(parts, x, z, rot, o) {
    var m = new T.Matrix4().makeRotationY(rot).setPosition(x, 0, z), add = function (pt) { pt.m = m; parts.push(pt); };
    var w = o.big ? 1.25 : 1.05 + hash(o.seed, 2) * 0.2, h = o.big ? 1.15 : 0.82 + hash(o.seed, 3) * 0.3, d = 1.05;
    add({ g: K.roundedBox(w, h, d, 0.08, 2), c: o.wall, p: [0, h / 2, 0], vary: 0.03, ao: 0.25 });
    var shop = !o.big && hash(o.seed, 5) > 0.72 && !o.target;
    if (shop) {   // a little shop: flat roof, striped awning, big window
      add({ g: K.roundedBox(w + 0.12, 0.14, d + 0.12, 0.05, 1), c: o.roof, p: [0, h + 0.06, 0], vary: 0.03 });
      for (var s = 0; s < 4; s++) add({ g: new T.BoxGeometry(w / 4, 0.05, 0.38), c: s % 2 ? '#FFFFFF' : o.awning || '#FF8A8A', p: [-w / 2 + w / 8 + s * w / 4, h * 0.72, d / 2 + 0.17], r: [0.42, 0, 0], vary: 0 });
      add({ g: new T.BoxGeometry(w * 0.62, h * 0.32, 0.04), c: '#BFE6FF', p: [-w * 0.1, h * 0.38, d / 2 + 0.01], vary: 0, ao: 0 });
      add({ g: new T.BoxGeometry(0.26, 0.42, 0.05), c: o.door, p: [w * 0.32, 0.21, d / 2 + 0.01], vary: 0 });
      return;
    }
    var R = (w + 0.24) / 1.732;
    add({ g: new T.CylinderGeometry(R, R, d + 0.26, 3), c: o.roof, p: [0, h + R * 0.5 * 0.62, 0], r: [-Math.PI / 2, 0, 0], s: [1, 1, 0.62], vary: 0.04, ao: 0.2 });
    // chimney, door with a step, two windows
    add({ g: new T.BoxGeometry(0.16, 0.34, 0.16), c: '#C9746A', p: [w * 0.26, h + 0.32, -0.12], vary: 0.02 });
    add({ g: K.roundedBox(0.3, 0.46, 0.06, 0.04, 1), c: o.door, p: [0, 0.23, d / 2 + 0.01], vary: 0 });
    add({ g: new T.SphereGeometry(0.025, 6, 4), c: '#FFD23F', p: [0.09, 0.24, d / 2 + 0.05], vary: 0, ao: 0 });
    add({ g: new T.BoxGeometry(0.42, 0.05, 0.16), c: '#D9CBB3', p: [0, 0.025, d / 2 + 0.1], vary: 0 });
    [-1, 1].forEach(function (sx) {
      add({ g: new T.BoxGeometry(0.24, 0.24, 0.04), c: '#FFFFFF', p: [sx * w * 0.3, h * 0.62, d / 2 + 0.005], vary: 0, ao: 0 });
      add({ g: new T.BoxGeometry(0.18, 0.18, 0.04), c: '#9ED8FF', p: [sx * w * 0.3, h * 0.62, d / 2 + 0.02], vary: 0, ao: 0 });
    });
    if (o.target) add({ g: new T.BoxGeometry(w + 0.04, 0.12, d + 0.04), c: o.band, p: [0, h * 0.18, 0], vary: 0, ao: 0.1 });
  }
  function treeParts(parts, x, z, s, seed, style) {
    var r = function (k) { return hash(seed, k); }, leaf = ['#5CC95A', '#4DB85A', '#7BD14E', '#3FAE66'][Math.floor(r(1) * 4)];
    if (style === 'pine') {
      parts.push({ g: new T.CylinderGeometry(0.07, 0.1, 0.4, 6), c: '#8A5A3A', p: [x, 0.2 * s, z], s: s });
      [[0.55, 0.7, 0.62], [0.42, 0.6, 0.98], [0.28, 0.5, 1.3]].forEach(function (c, i) { parts.push({ g: K.jitter(new T.ConeGeometry(c[0], c[1], 7, 1), 0.04, seed * 10 + i), c: '#3E9C5E', p: [x, c[2] * s, z], s: s, grad: [0.7, 1.15], vary: 0.06, ao: 0.3 }); });
      return;
    }

        fx.fillStyle = '#FFFFFF'; fx.beginPath(); fx.arc(x + 6, 66, 6, 0, Math.PI * 2); fx.fill(); fx.fillStyle = '#7CF2FF';

    var wheels = [[-0.47, 0.17, 0.27], [0.47, 0.17, 0.27], [-0.47, 0.17, -0.27], [0.47, 0.17, -0.27]].map(function (q) { var w = new T.Mesh(wheelGeo, K.MAT.glossy); w.position.set(q[0], q[1], q[2]); w.castShadow = true; body.add(w); return w; });

    var triGeo = new T.ShapeGeometry(tri).rotateZ(Math.PI);

    };

      return K.anim(dur * (q === 2 ? 1.4 : 1), function (e) { g.rotation.y = y0 + (y1 - y0) * e; }, { ease: 'sineInOut' });
    };

      return K.anim(0.42, function (e, k) { var s = k < 0.4 ? k / 0.4 : 1 - (k - 0.4) / 0.6; g.position.copy(from).addScaledVector(dir, 0.42 * Math.sin(s * Math.PI / 2)); body.rotation.z = Math.sin(k * Math.PI * 4) * 0.12 * (1 - k); }).then(function () { g.position.copy(from); body.rotation.z = 0; });
    };
    R.hop = function (h) { return K.anim(0.45, function (e, k) { body.position.y = 4 * (h || 0.35) * k * (1 - k); }).then(function () { body.position.y = 0; }); };
    R.shrug = function () { R.face('think', 1.4); return K.anim(0.6, function (e, k) { body.rotation.z = Math.sin(k * Math.PI * 3) * 0.1; }).then(function () { body.rotation.z = 0; }); };
    K.onUpdate(function (dt, time) {
      wheels.forEach(function (w) { w.rotation.x += dt * (spin ? 14 : 0); });
      if (!FACE.expr || FACE.expr === 'idle') { FACE.blink -= dt; if (FACE.blink <= 0) { drawFace('idle', true); FACE.blink = 2.5 + Math.random() * 2.5; K.wait(0.12).then(function () { if (!FACE.expr || FACE.expr === 'idle') drawFace('idle'); }); } }
      if (!spin) body.position.y = body.position.y * 0.9 + Math.sin(time * 3) * 0.006;

  };

<script data-inline="game.js">
/* Robot Courier — game flow. A round = the five tasks of one level (band × level), each a delivery:
 *   build  the child puts command tiles into the program and presses Go; the robot runs it step by step on the board
 *   fix    one block of the given program has a bug: tap it, tap the right tile
 *   fill   blanks in a given program (blocks or numbers)
 *   pick / cmp / order / num   read the program(s) and answer with the kit's choices or number pad
 * Every child action goes through SiaKit.narrate: correct (the task's own praise lines), wrong (a line that names the mistake the
 * engine found, then the kit's ladder: a stronger line + the task's clue, then the answer with the reason), hints (💡 one step per
 * press: the goal → the clue → the answer), idle nudges, round end (what was learned), and the 어땠어 reply.
 * Stars are honest: a task counts only when solved on the first try without the answer being shown.
 * Kit overrides that live here (the kit is not edited from a game): LEVELS §3.2 / §4 embedded rules for the 어땠어 step (as in
 * train-time), fixed spoken lines for the 어땠어 reply (so a studio can record them).

    else toTitle();
  }
  function exitRound() {
    // the kit's exit: one short goodbye line during a round, then the parent page is told
    if (EMBED) { UI.exit(); return; }
    N.goodbye(); K.wait(0.1).then(function () { toTitle(); });
  }
  function resetScene() {
    S.token++; N.cancel(); clearHands(); clearMarks(); UI.closePanel(true); UI.hideSay(true);
    card.classList.add('rc-hide'); code.classList.add('rc-hide'); pal.classList.add('rc-hide'); badge.classList.add('rc-hide'); testBar.classList.add('rc-hide');
    if (S.chip) { S.chip.remove(); S.chip = null; }
  }

  // ---------------------------------------------------------------- title
  var TITLE_TASK = { id: 'title', map: '#.*##1/@....*/*#..#./..##..', dir: 'E', need: ['1'], color: { 1: 'red' }, icon: { 1: '🎁' }, band: 'K', mode: 'abs' };
  var CAM = { mode: 'title', t: 0 };
  function titleCam(dur) {
    return moveCam(fitCam(viewPoints(), freeRect('title'), T.MathUtils.degToRad(40)), dur);
  }
  var titleLoop = null;
  function toTitle() {
    resetScene(); S.phase = 'title'; S.task = null; K.sound.music(false); document.documentElement.classList.remove('rc-play', 'rc-noprog', 'rc-col');
    S.mini = false; code.classList.remove('rc-mini');
    try { buildBoard(TITLE_TASK); } catch (e) { console.error(e); }
    S.task = null; robot.arrow(false);
    // Haru stands big in front of the town on the title (not behind the start card)
    if (board) { haru.group.scale.setScalar(1.7); haru.place(board.size.w / 2 - 2.2, board.size.d / 2 + 1.6); haru.lookAt('camera'); }
    UI.topBar({ close: true, sound: true, lang: true });
    var ti = UI.title({ title: { ko: LN.ui.ko.title, en: LN.ui.en.title }, subtitle: function () { return lang() === 'ko' ? (L.band === 'E2' || L.band === 'E3' ? LN.ui.ko.subOld : LN.ui.ko.sub) : (L.band === 'E2' || L.band === 'E3' ? LN.ui.en.subOld : LN.ui.en.sub); },
      hint: function (b, l) { return LN.intro[b][lang()].goals[l - 1]; }, onStart: function () { UI.wipe(function () { play(); return null; }); } });
    if (EMBED && ti && ti.el) ti.el.classList.add('rc-locked');
    titleCam(0);
    if (titleLoop) titleLoop();
    var hop = 0;
    titleLoop = K.onUpdate(function (dt, t) {
      if (S.phase !== 'title') { titleLoop(); titleLoop = null; return; }
      hop += dt; if (hop > 6) { hop = 0; haru.play(Math.random() > 0.5 ? 'hello' : 'jump'); robot.hop(0.3); robot.face('happy', 1.2); }
    });
  }

  // ---------------------------------------------------------------- test hooks
  /** a tap script that builds a program with the real UI: [{tap: selector}] */
  function tapScript(prog, wrongAt) {
    var t = S.task, out = [], p = E.prog(prog);
    function list(nodes, lp) {
      nodes.forEach(function (n, i) {
        if (typeof n === 'string') { out.push({ tap: '#rc-t-' + n }); return; }
        if (n.rep != null) { out.push({ tap: '#rc-t-rep' }); out.push({ tap: '#rc-t-n' + n.rep }); list(n.body, lp.concat(i, 'body')); out.push({ tap: '#rc-a-' + lp.join('-') }); }
      });
    }
    if (S.mode === 'build') list(p.main, ['main']);
    else {
      // fix / fill: tap each place that differs from what is shown, then the tile
      var cur = S.prog;
      E.eachNode(p, function (n, path) {
        var have = E.nodeAt(cur, path);
        if (typeof n === 'string' && have !== n) { out.push({ tap: '#rc-r-' + path.join('-') + ' .rc-blk' }); out.push({ tap: '#rc-t-' + n }); }
        if (n && typeof n === 'object') ['rep', 'to', 'by'].forEach(function (f) { if (n[f] != null && have && have[f] === '?') { out.push({ tap: '#rc-n-' + path.join('-') + '-' + f }); out.push({ tap: '#rc-t-n' + Math.abs(n[f]) }); } });
      });
    }
    void wrongAt; void t;
    return out;
  }
  /** a wrong program for the deliberate mistake of a test run */
  function wrongProg() {
    var t = S.task, sol = E.prog(E.clone(t.sol));
    if (S.mode === 'build') {
      var m = sol.main; var j = m.findIndex(function (x) { return x === 'L' || x === 'R'; });
      if (j >= 0) { m[j] = m[j] === 'L' ? 'R' : 'L'; if (!E.solves(t, sol)) return sol; m[j] = m[j] === 'L' ? 'R' : 'L'; }
      var k = m.findIndex(function (x) { return typeof x === 'string' && x in RC.ABS; });
      if (k >= 0) { var orig = m[k]; m[k] = { u: 'd', d: 'u', l: 'r', r: 'l' }[orig]; if (!E.solves(t, sol)) return sol; m[k] = orig; }
      sol.main.pop(); if (!sol.main.length) sol.main.push(t.band === 'K' ? 'd' : 'L'); return sol;
    }
    if (S.mode === 'fix') return E.prog(E.clone(t.prog));
    if (S.mode === 'fill') {
      var done = false; E.eachNode(sol, function (n, path) {
        if (done) return; var b = E.nodeAt(E.prog(t.prog), path);
        if (b === '?' && typeof n === 'string') { var w = n === 'L' ? 'R' : n === 'R' ? 'L' : n === 'D' ? 'F' : 'D'; var lp = path.slice(0, -1); (path[0] === 'fn' ? sol.fns[path[1]] : listAtIn(sol, lp))[path[path.length - 1]] = w; done = !E.solves(t, sol); if (!done) (path[0] === 'fn' ? sol.fns[path[1]] : listAtIn(sol, lp))[path[path.length - 1]] = n; }
        else if (b && typeof b === 'object') ['rep', 'to', 'by'].forEach(function (f) { if (!done && b[f] === '?') { var o2 = n[f]; n[f] = f === 'by' ? o2 - 1 : o2 + 1; done = !E.solves(t, sol); if (!done) n[f] = o2; } });
      });
      return sol;
    }
    return null;
  }
  function listAtIn(prog, lp) { return listAt(prog, lp); }
  K.expose({
    embedded: EMBED,
    phase: function () { return S.phase; },
    taskInfo: taskInfo,
    /** taps that solve the current task ({tap: css selector}); for reading tasks {choice: i} or {number: n} */
    solution: function () { var t = S.task; if (!t) return null; if (S.mode === 'read') return t.type === 'num' ? { number: t.num } : { choice: t.ans }; return tapScript(t.sol); },
    /** taps that make one wrong attempt */
    mistake: function () { var t = S.task; if (!t) return null; if (S.mode === 'read') return t.type === 'num' ? { number: t.num + 1 } : { choice: (t.ans + 1) % t.opts.length }; var w = wrongProg(); return { taps: tapScript(w), prog: w, diag: E.diagnose(t, w) }; },
    /** remove everything the child placed (build) — for tests that want a clean start after a mistake */
    program: function () { return E.clone(S.prog); },
    robotCell: function () { var p = robot.group.position, b = board; if (!b) return null; var best = null, bd = 1e9; for (var y = 0; y < b.H; y++) for (var x = 0; x < b.W; x++) { var c = b.cell(x, y), d = Math.hypot(c.x - p.x, c.z - p.z); if (d < bd) { bd = d; best = { x: x, y: y }; } } return best; },
    delivered: function () { return board ? Object.keys(board.targets).filter(function (k) { return board.targets[k].delivered; }) : []; },
    firstTry: function () { return S.first.slice(); },
    stars: function () { return starsNow(); },
    narrateLog: function () { return N.log.slice(); },
    narrateStats: function () { return N.stats(); },
    locked: function () { return !!S.locked; },
    lastMiss: function () { return S.lastMiss || null; },
    clue: function () { return S.task ? { clue: S.task.clue, show: S.task.show, say: S.task.say, good: S.task.good } : null; },
    rect: function (sel) { var e = document.querySelector(sel); if (!e) return null; var r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; },
    perf: function () { return st.stats(); },
    allTasks: function () { return RC.content.all().concat(RC.content.allAlt()).map(function (t) { return { id: t.id, band: t.band, lang: t.lang, level: t.level, type: t.type, alt: !!t.alt }; }); },
    set: function () { return S.alt ? 2 : 1; },
    /** the game's own idle and hint-3 lines for the band and language now (tests: no kit line for another game is said) */
    ownLines: function () { var g = group(), l = lang(), out = []; [LN.idle, LN.hint3].forEach(function (T) { Object.keys(T[g][l]).forEach(function (m) { out = out.concat(T[g][l][m]); }); }); return out; },
    camTo: function (kind) { return frame(kind, 0); },
    /** tests: put the task with this id (any band / language) in the current slot of the round and start it */
    jump: function (id) { var t = RC.content.all().concat(RC.content.allAlt()).filter(function (x) { return x.id === id; })[0]; if (!t || !S.tasks.length) return false; S.token++; N.cancel(); S.tasks[S.ti] = t; startTask(S.ti); return true; },
  });

  toTitle();
  K.ready();
})();

</script>
