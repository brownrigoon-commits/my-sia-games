    ko: [
      // lv1: inference with evidence, mixed feelings
      { id: 'e301', lv: 1, set: 'classroom', type: 'think', think: true, cast: [{ r: 'kid', feel: 'happy', prop: 'medal' }, { r: 'friend', feel: 'sad' }], sp: 1, intro: '반 대표 달리기에서 민이가 1등, 보라가 2등을 했어. 보라가 눈을 내리깔고 말해.', cue: { w: 1, t: '1등 축하해, 민아. 넌 역시 잘해.' }, q: '보라의 속마음을 가장 잘 보여 주는 것은?', opts: [o('축하하지만, 나도 1등 하고 싶었는데 아쉽다.'), o('민이가 1등 해서 나도 진심으로 기쁘기만 하다.', '축하는 했지만 눈을 내리깔았어. 기쁘기"만" 하다면 얼굴이 밝았겠지.'), o('2등도 충분히 잘한 거니까 나는 아무렇지 않아.', '아무렇지 않다면 눈을 피하지 않았을 거야. 표정이 단서야.'), o('민이가 뭔가 반칙을 해서 1등을 한 것 같아.', '반칙이라는 단서는 어디에도 없어. 근거 없이 넘겨짚은 거야.')], react: 'nod', after: 'neutral', note: '축하하는 말과 내리깐 눈. 두 마음이 함께 있을 수 있어. 모든 단서와 맞는 해석을 고르면 돼.' },
      { id: 'e302', lv: 1, set: 'bus', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'jun', feel: 'worried' }], sp: 1, intro: '친구들이 놀이공원에 가기로 했어. 준은 지난번에 롤러코스터 줄에서 빠져나갔었지.', cue: { w: 1, t: '그래, 나도 갈게. 재밌겠다.' }, q: '준의 속마음을 가장 잘 보여 주는 것은?', opts: [o('친구들이랑 가고 싶지만, 무서운 기구는 걱정된다.'), o('놀이공원이라니, 빨리 롤러코스터부터 타고 싶다.', '지난번에 롤러코스터 줄에서 빠져나갔어. 그 단서와 안 맞아.'), o('친구들이 나만 빼고 정해서 화가 많이 난다.', '친구들은 준과 함께 가기로 했어. 따돌렸다는 근거가 없어.'), o('놀이공원은 너무 비싸서 사실 가기 어렵다.', '돈 이야기는 어디에도 없어. 근거 없이 넘겨짚은 거야.')], react: 'nod', after: 'neutral', note: '"재밌겠다"는 말과 지난번 일을 함께 보면, 가고 싶은 마음과 걱정이 같이 보여.' },
      { id: 'e303', lv: 1, set: 'classroom', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'friend', feel: 'sad', prop: 'paper' }], sp: 1, intro: '보라가 수학 시험지를 받자마자 반으로 접어 가방에 넣었어. 민이가 시험 어땠냐고 물었어.', cue: { w: 1, t: '음… 그냥 그랬어. 다음엔 더 잘 볼 거야.' }, q: '보라의 속마음을 가장 잘 보여 주는 것은?', opts: [o('점수가 낮아서 속상하지만, 다음엔 잘하고 싶다.'), o('점수가 아주 잘 나와서 몰래 기뻐하고 싶다.', '잘 나왔다면 "다음엔 더 잘 볼 거야"라고 하지 않았겠지. 단서와 안 맞아.'), o('점수가 낮아서 이제 수학은 아예 다 포기할 거다.', '"다음엔 더 잘 볼 거야"라고 했어. 포기한다는 해석은 말과 반대야.'), o('민이가 내 점수를 물어봐서 정말 화가 난다.', '조용히 대답했을 뿐 화난 단서는 없어. 너무 넘겨짚었어.')], react: 'nod', after: 'neutral', note: '시험지를 얼른 접은 행동과 "다음엔"이라는 말을 함께 보면 두 마음이 다 보여.' },
      { id: 'e304', lv: 1, set: 'park', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'friend', feel: 'sad' }], sp: 1, intro: '다음 달에 보라가 멀리 이사를 가. 보라가 그네를 천천히 밀며 말했어.', cue: { w: 1, t: '새 학교도 재밌을 거야, 아마.' }, q: '보라의 속마음을 가장 잘 보여 주는 것은?', opts: [o('새 학교도 궁금하지만, 친구들과 헤어지기 아쉽다.'), o('새 학교가 너무 기대돼서 빨리 이사 가고 싶다.', '"아마"를 붙이고 그네를 천천히 밀었어. 신나기만 한 마음이 아니야.'), o('이사 때문에 엄마한테 화가 아주 많이 났다.', '엄마 이야기나 화난 모습은 없어. 근거 없는 해석이야.'), o('새 학교에서 친구를 하나도 못 사귈까 봐 무섭기만 하다.', '"재밌을 거야"라고 기대도 했어. 무섭기"만" 하다는 건 단서의 반만 본 거야.')], react: 'nod', after: 'neutral', note: '"재밌을 거야"와 "아마"가 함께 있으면, 기대와 아쉬움이 섞인 마음이야.' },
      { id: 'e305', lv: 1, set: 'shop', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'shop', feel: 'shy' }], sp: 1, intro: '30년 된 가게가 다음 주에 문을 닫아. 아저씨가 진열대를 꼼꼼히 닦으며 웃으셨어.', cue: { w: 1, t: '이제 좀 쉬어야지, 허허.' }, q: '아저씨의 속마음을 가장 잘 보여 주는 것은?', opts: [o('쉴 수 있어 홀가분하지만, 정든 가게라 섭섭하다.'), o('드디어 가게 문을 닫게 돼서 그저 기쁘기만 하다.', '마지막까지 진열대를 꼼꼼히 닦으셨어. 기쁘기"만" 하다면 그러지 않으셨겠지.'), o('손님들이 안 와서 가게를 닫으니 화가 난다.', '손님 이야기는 없어. 근거 없이 넘겨짚은 거야.'), o('가게를 더 크게 다시 열 생각에 신이 난다.', '다시 연다는 단서는 어디에도 없어.')], react: 'nod', after: 'neutral', note: '웃음과 꼼꼼히 닦는 손길. 홀가분함과 섭섭함이 함께 있는 거야.' },
      { id: 'e306', lv: 1, set: 'classroom', type: 'evidence', think: true, cast: [{ r: 'kid', feel: 'think' }, { r: 'jun', feel: 'sad' }], sp: 0, intro: '체육 시간에 넘어진 준이 괜찮다고 했어. 그런데 계단을 내려갈 때마다 다리를 절뚝거려.', cue: { w: 1, t: '괜찮아, 별로 안 아파.' }, q: '준이 사실은 아프다는 걸 보여 주는 단서는?', opts: [o('계단에서 한쪽 다리를 절뚝거린다.'), o('"별로 안 아파"라고 웃으며 말했다.', '그건 준이 한 말이야. 말과 반대로 보여 주는 행동이 단서야.'), o('친구들과 나란히 계단을 내려간다.', '누구나 하는 행동이라 아프다는 단서가 되지 않아.'), o('체육 시간에 축구를 하다 넘어졌다.', '아플 만한 이유일 뿐, 지금 아프다는 걸 보여 주진 않아. 지금 보이는 행동을 찾아봐.')], react: 'nod', after: 'neutral', note: '말보다 행동이 더 정확한 단서일 때가 많아. 근거를 찾으면 추론이 단단해져.' },
      // lv2: what the words really mean — sarcasm vs sincerity, figures of speech
      { id: 'e307', lv: 2, set: 'home', type: 'irony', think: true, beat: 'shatter', cast: [{ r: 'dad', feel: 'angry' }, { r: 'kid', feel: 'think' }, { r: 'little', feel: 'sorry', prop: 'ball' }], sp: 1, intro: '동생이 공놀이를 하다 꽃병을 깨뜨렸어. 아빠가 한숨을 쉬며 말씀하셨어.', cue: { w: 0, t: '아주 잘했다, 아주 잘했어.' }, q: '아빠 말씀은 무슨 뜻일까?', opts: [o('조심하지 않아서 속상하다는 걸 반대로 말했다.'), o('다친 데가 없어서 다행이라고 안심하는 뜻이다.', '다행이라면 "괜찮니?"라고 물으셨겠지. 한숨과 같은 말의 반복은 비꼬는 말투야.'), o('동생이 솔직하게 말해서 기특하다는 칭찬이다.', '동생은 아직 아무 말도 안 했어. 칭찬할 일이 없어.'), o('꽃병이 낡아서 깨져도 괜찮다는 위로의 말이다.', '위로라면 부드럽게 말씀하셨겠지. 한숨이 단서야.')], react: 'nod', after: 'neutral', note: '상황과 반대로 말하는 걸 반어라고 해. 한숨, 표정, 상황이 단서야.' },
      { id: 'e308', lv: 2, set: 'park', type: 'figure', think: true, cast: [{ r: 'friend', feel: 'proud' }, { r: 'kid', feel: 'sorry' }], intro: '민이가 약속에 늦었는데 보라가 씩 웃으며 말했어.', cue: { w: 0, t: '괜찮아. 내 마음이 바다처럼 넓거든?' }, q: '보라 말은 무슨 뜻일까?', opts: [o('늦은 걸 너그럽게 용서해 주겠다는 뜻이다.'), o('늦어서 생긴 속상함이 아주 크다는 뜻이다.', '"넓다"는 크기가 아니라 너그러움을 빗댄 말이야. 보라는 웃고 있어.'), o('바다처럼 시원한 곳에 놀러 가자는 뜻이다.', '바다는 마음을 빗대는 데 쓴 말이야. 놀러 가자는 말이 아니야.'), o('마음이 넓으니 다음에도 늦어도 된다는 뜻이다.', '이번엔 봐주겠다는 말이지, 계속 늦어도 된다는 허락은 아니야. 너무 넓게 해석했어.')], react: 'laugh', after: 'happy', note: '"바다처럼 넓다"는 비유야. 무엇을 무엇에 빗댔는지 찾으면 뜻이 보여.' },
      { id: 'e309', lv: 2, set: 'street', type: 'figure', cast: [{ r: 'grandma', feel: 'happy', prop: 'cane' }, { r: 'kid', feel: 'shy' }], intro: '오랜만에 만난 할머니가 민이를 보며 말씀하셨어.', cue: { w: 0, t: '네가 벌써 이렇게 컸네. 세월이 참 화살 같구나.' }, q: '할머니 말씀에 어울리는 대답은?', opts: [o('맞아요, 시간이 정말 빨리 지나가요.'), o('맞아요, 화살처럼 위험한 일이 정말 많아요.', '화살에 빗댄 건 위험이 아니라 빠르기야.'), o('맞아요, 시간이 정말 천천히 가요.', '화살은 빠르게 날아가. 뜻이 반대가 됐어.'), o('맞아요, 제가 화살처럼 곧게 컸어요.', '할머니는 키가 아니라 시간 이야기를 하셨어. 빗댄 점을 잘못 골랐어.')], react: 'laugh', after: 'happy', note: '"세월이 화살 같다"는 시간이 아주 빨리 간다는 비유야.' },
      { id: 'e310', lv: 2, set: 'shop', type: 'irony', think: true, cast: [{ r: 'mom', feel: 'tired' }, { r: 'kid', feel: 'shy' }], intro: '장난감 가게야. 민이가 벌써 세 번째 장난감을 사 달라고 졸랐어.', cue: { w: 0, t: '그래, 집에 장난감이 하나도 없으니까 사야지.' }, q: '엄마 말씀은 무슨 뜻일까?', opts: [o('집에 장난감이 많으니 더 사지 말자는 뜻이다.'), o('집에 장난감이 없으니 하나 사 주겠다는 뜻이다.', '집엔 장난감이 많아. 엄마는 반대로 말씀하신 거야.'), o('집에 있는 장난감을 버리고 새로 사자는 뜻이다.', '버리자는 말은 하지 않으셨어. 너무 멀리 해석했어.'), o('장난감 말고 다른 선물을 사 주겠다는 뜻이다.', '다른 선물 이야기는 없어. 엄마는 "이제 그만"이라는 뜻으로 말씀하셨어.')], react: 'nod', note: '"하나도 없으니까 사야지"는 너무 많다는 뜻을 반대로 말한 거야.' },
      { id: 'e311', lv: 2, set: 'park', type: 'irony', think: true, cast: [{ r: 'jun', feel: 'excited' }, { r: 'kid', feel: 'think' }], intro: '소풍 날 아침이야. 하늘이 맑고 바람이 시원해.', cue: { w: 0, t: '와, 날씨 한번 끝내준다.' }, q: '준의 말은 무슨 뜻일까?', opts: [o('날씨가 정말 좋아서 신난다는 진심이다.'), o('날씨가 나빠서 소풍이 망했다는 비꼬는 말이다.', '하늘이 맑아. 상황과 말이 같으니 비꼬는 게 아니라 진심이야.'), o('날씨가 좋아서 소풍이 곧 끝난다는 뜻이다.', '"끝내준다"는 "아주 좋다"는 뜻이야. 끝난다는 뜻이 아니야.'), o('날씨가 너무 더워서 힘들다는 투정이다.', '바람이 시원하다고 했어. 덥다는 단서는 없어.')], react: 'cheer', after: 'happy', note: '같은 말도 상황에 따라 진심일 수도, 비꼬는 말일 수도 있어. 상황이 말과 맞으면 진심이야.' },
      { id: 'e312', lv: 2, set: 'classroom', type: 'irony', think: true, beat: 'rain', cast: [{ r: 'jun', feel: 'angry', prop: 'umbrella' }, { r: 'kid', feel: 'think' }], intro: '소풍 날 아침이야. 창밖에 비가 쏟아지고 있어.', cue: { w: 0, t: '와, 날씨 한번 끝내준다.' }, q: '준의 말은 무슨 뜻일까?', opts: [o('비가 와서 소풍을 못 가 속상하다는 뜻이다.'), o('비 오는 날씨가 정말 멋지다는 진심이다.', '소풍 날 쏟아지는 비가 멋질 리 없어. 상황과 반대로 말한 거야.'), o('비가 금방 그쳐서 소풍을 간다는 뜻이다.', '비가 그친다는 단서는 없어. 너무 앞서 나갔어.'), o('소풍 날을 바꾸자고 선생님께 부탁하는 말이다.', '선생님께 하는 말이 아니야. 준은 속상한 마음을 비꼬아 말했어.')], react: 'nod', after: 'neutral', note: '맑은 날의 "끝내준다"는 진심, 비 오는 소풍 날의 "끝내준다"는 비꼬는 말이야.' },
      // lv3: 높임법
      { id: 'e313', lv: 3, set: 'classroom', type: 'formal', cast: [{ r: 'principal', feel: 'happy' }, { r: 'kid', feel: 'neutral', prop: 'paper' }, { r: 'friend', feel: 'neutral' }], intro: '교장 선생님이 교실에 오셨어. 반장 민이가 발표 시작을 알려야 해.', cue: { w: 0, t: '그래, 준비한 걸 보여 주렴.' }, q: '교장 선생님께 하는 말로 맞는 것은?', opts: [o('교장 선생님, 저희 반이 준비한 발표를 시작하겠습니다.'), o('교장 선생님, 우리 반이 준비한 발표를 시작하겠습니다.', '윗사람 앞에서 우리 쪽을 말할 땐 낮춰서 "저희"라고 해.'), o('교장 선생님, 저희 반이 준비하신 발표를 시작하겠습니다.', '"준비하신"은 우리 반을 높인 말이야. 자기 쪽은 높이지 않아.'), o('교장 선생님께서 저희 반 발표를 시작하시겠습니다.', '발표를 시작하는 건 우리 반이야. 교장 선생님이 하시는 게 아니야.')], react: 'clap', note: '높이는 사람(교장 선생님)과 낮추는 쪽(저희 반)을 가려 쓰는 게 높임법이야.' },
      { id: 'e314', lv: 3, set: 'shop', type: 'formal', cast: [{ r: 'neighbor', feel: 'happy' }, { r: 'kid', feel: 'neutral', prop: 'cup' }], intro: '학교 바자회야. 음료 판매를 맡은 민이가 손님께 주스를 건네.', cue: { w: 0, t: '주스 하나 주문했는데요.' }, q: '손님께 하는 말로 맞는 것은?', opts: [o('주문하신 주스 나왔습니다. 맛있게 드세요.'), o('주문하신 주스 나오셨습니다. 맛있게 드세요.', '"나오셨습니다"는 주스를 높인 말이야. 물건은 높이지 않아.'), o('주문한 주스 나왔습니다. 맛있게 먹어요.', '"주문한", "먹어요"는 손님을 높이지 않은 말이야. "주문하신", "드세요"로 높여야 해.'), o('주문하신 주스 나왔습니다. 맛있게 드릴게요.', '"드릴게요"는 내가 드린다는 뜻이야. 손님이 드시는 거니까 "드세요"가 맞아.')], react: 'nod', note: '높이는 건 사람(손님)이지 물건(주스)이 아니야.' },
      { id: 'e315', lv: 3, set: 'home', type: 'formal', cast: [{ r: 'mom', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }, { r: 'grandma', feel: 'happy' }], intro: '엄마가 할머니께 저녁에 뭘 드시고 싶은지 여쭤보라고 하셨어.', cue: { w: 0, t: '민아, 할머니께 여쭤봐.' }, q: '할머니께 여쭙는 말로 맞는 것은?', opts: [o('할머니, 저녁에 무엇을 드시고 싶으세요?'), o('할머니, 저녁에 무엇을 먹고 싶으세요?', '어른께는 "먹다" 대신 "드시다"를 써야 해.'), o('할머니, 저녁에 무엇을 드리고 싶으세요?', '"드리다"는 내가 어른께 드릴 때 쓰는 말이야. 할머니가 드시는 거니까 "드시다"!'), o('할머니께서 저녁에 무엇을 드시고 싶대요?', '할머니께 직접 여쭙는 말이 아니라 다른 사람에게 전하는 말투야.')], react: 'nod', after: 'happy', note: '"드시다"는 어른이 드실 때, "드리다"는 내가 어른께 드릴 때 써.' },
      { id: 'e316', lv: 3, set: 'classroom', type: 'formal', cast: [{ r: 'principal', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }], intro: '담임 선생님이 민이에게 교장 선생님을 모셔 오라고 하셨어.', cue: { w: 0, t: '그래, 무슨 일이니?' }, q: '교장 선생님께 전하는 말로 맞는 것은?', opts: [o('담임 선생님께서 잠깐 와 주시라고 하셨습니다.'), o('담임 선생님이 잠깐 오라고 했습니다.', '담임 선생님도, 교장 선생님도 높여야 해. "께서", "와 주시라고", "하셨습니다"로!'), o('담임 선생님께서 잠깐 와 주시라고 했어요.', '말씀하신 분은 담임 선생님이야. "했어요"가 아니라 "하셨어요"로 높여야 해.'), o('담임 선생님께서 잠깐 가 주시라고 하셨습니다.', '담임 선생님 쪽으로 오시라는 뜻이야. "가 주시라고"는 반대 방향이 돼.')], react: 'nod', note: '말씀하신 분(담임 선생님)과 듣는 분(교장 선생님)을 모두 높여야 해.' },
      { id: 'e317', lv: 3, set: 'bus', type: 'formal', cast: [{ r: 'man', feel: 'neutral' }, { r: 'kid', feel: 'sorry' }, { r: 'grandma', feel: 'neutral', prop: 'cane' }], intro: '민이네 반 친구들이 버스에서 시끄럽게 떠들었어. 반장 민이가 승객들께 사과해.', cue: { w: 0, t: '좀 조용히 해 주겠니?' }, q: '승객들께 하는 사과로 맞는 것은?', opts: [o('저희 반이 시끄럽게 해서 불편을 드려 죄송합니다.'), o('우리 반이 시끄럽게 해서 불편을 드려 죄송합니다.', '어른들 앞에서 우리 쪽은 낮춰서 "저희"라고 해.'), o('저희 반이 시끄럽게 하셔서 불편을 드려 죄송합니다.', '"하셔서"는 우리 반을 높인 말이야. 자기 쪽은 높이지 않아.'), o('저희 반이 시끄럽게 해서 불편을 줘서 죄송합니다.', '어른께는 "주다" 대신 "드리다"를 써. "불편을 드려"가 맞아.')], react: 'bow', note: '자기 쪽은 낮추고(저희), 상대에게 하는 일은 높여(드리다).' },
      { id: 'e318', lv: 3, set: 'park', type: 'formal', cast: [{ r: 'jun', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }, { r: 'grandma', feel: 'worried', prop: 'cane' }], intro: '길을 잃은 할머니를 민이가 안내소까지 모셔다 드리려고 해.', cue: { w: 0, t: '민아, 어디 가?' }, q: '준에게 하는 말로 맞는 것은?', opts: [o('준아, 내가 할머니를 안내소까지 모셔다 드릴게.'), o('준아, 내가 할머니를 안내소까지 데려다줄게.', '어른을 안내할 땐 "데려다주다" 대신 "모셔다 드리다"를 써.'), o('준아, 내가 할머니를 안내소까지 모셔다 드릴게요.', '듣는 사람은 친구 준이야. 준에게는 "드릴게"로 충분해.'), o('준아, 할머니께서 나를 안내소까지 모셔다 드릴게.', '안내하는 건 민이야. 누가 누구를 모시는지 바뀌었어.')], react: 'nod', note: '이야기 속 어른(할머니)은 높이고, 듣는 친구(준)에게는 반말. 높임은 두 방향을 따로 살펴.' },
      // lv4: persuasion — the strongest of four polite arguments answers the listener's worry
      { id: 'e319', lv: 4, set: 'classroom', type: 'persuade', cast: [{ r: 'friend', feel: 'think' }, { r: 'kid', feel: 'neutral' }, { r: 'jun', feel: 'neutral' }], intro: '소풍 장소를 정하는 중이야. 민이는 과학관에 가고 싶어.', cue: { w: 0, t: '과학관은 지루하지 않을까?' }, q: '보라를 설득하는 말로 가장 좋은 것은?', opts: [o('과학관은 직접 만지고 해 보는 체험이 많아서 지루할 틈이 없어.'), o('과학관은 내가 예전부터 꼭 가 보고 싶었던 곳이라서 이번엔 거기로 하자.', '내가 가고 싶은 마음만 말했어. 보라가 걱정하는 "지루함"에는 답하지 않았어.'), o('다른 반도 거의 다 과학관에 간대. 그러니까 우리도 가자.', '남들이 간다는 건 이유가 약해. 보라의 걱정을 풀어 주지 못해.'), o('과학관은 우리 학교에서 지하철로 세 정거장 거리에 있어.', '사실이지만 보라가 물은 건 거리가 아니라 재미야. 상관없는 사실이야.')], react: 'nod', after: 'happy', note: '가장 힘센 설득은 상대의 걱정에 바로 답하는 거야.' },
      { id: 'e320', lv: 4, set: 'home', type: 'persuade', cast: [{ r: 'mom', feel: 'think' }, { r: 'kid', feel: 'neutral', prop: 'bag' }], intro: '민이는 보라네 집에서 자고 오고 싶어.', cue: { w: 0, t: '글쎄, 보라네 어른은 계시니? 숙제는?' }, q: '엄마를 설득하는 말로 가장 좋은 것은?', opts: [o('보라 어머니가 저녁 내내 집에 계시고, 숙제는 오늘 다 해 놓을게요.'), o('보라랑 정말 친하고, 같이 하고 싶은 보드게임이 아주 많아요.', '내가 하고 싶은 것만 말했어. 엄마가 물은 어른과 숙제에는 답하지 않았어.'), o('우리 반 친구들은 거의 다 한 번씩 보라네서 자고 왔대요.', '남들이 했다는 건 엄마의 걱정을 풀어 주지 못해.'), o('이번에 보내 주시면 다음 주 내내 제 방 청소를 매일 아침 꼭 할게요.', '좋은 약속이지만 엄마가 물은 어른과 숙제에는 답하지 않았어. 걱정을 비켜 간 흥정이야.')], react: 'nod', after: 'happy', note: '엄마가 물은 두 가지(어른, 숙제)에 하나씩 답하면 설득이 돼.' },
      { id: 'e321', lv: 4, set: 'park', type: 'persuade', cast: [{ r: 'jun', feel: 'tired', prop: 'ball' }, { r: 'kid', feel: 'neutral' }], intro: '놀고 난 자리에 쓰레기가 많아. 민이는 친구들과 치우고 싶어.', cue: { w: 0, t: '에이, 귀찮아. 우리가 버린 것도 아니잖아.' }, q: '준을 설득하는 말로 가장 좋은 것은?', opts: [o('10분이면 끝나고, 다음에 우리가 놀 자리도 깨끗해지잖아.'), o('쓰레기를 줍는 건 누구나 해야 하는 착한 일이니까 우리도 꼭 하자.', '옳은 말이지만 "귀찮다"는 준의 마음에는 답하지 않았어. 짧은 시간과 우리에게 좋은 점이 더 힘이 세.'), o('저기 있는 다른 아이들도 다 줍고 있으니까 우리도 줍자.', '남들이 한다는 건 이유가 약해. 준의 귀찮은 마음은 그대로야.'), o('쓰레기가 이렇게 많으면 나는 정말 속상하고 슬플 것 같아.', '내 감정에만 기대면 준의 귀찮은 마음은 그대로야.')], react: 'nod', after: 'happy', note: '"귀찮아"에는 짧은 시간, "우리가 안 버렸어"에는 우리에게 좋은 점으로 답했어.' },
      { id: 'e322', lv: 4, set: 'bus', type: 'persuade', cast: [{ r: 'jun', feel: 'worried' }, { r: 'kid', feel: 'neutral' }], intro: '버스 정류장이야. 준은 택시를 타자고 하지만 민이는 버스가 낫다고 생각해.', cue: { w: 0, t: '택시가 더 빠르지 않아?' }, q: '준을 설득하는 말로 가장 좋은 것은?', opts: [o('지금 길이 꽉 막혀서, 버스 전용 차로로 가는 버스가 더 빨라.'), o('버스는 택시보다 훨씬 싸니까 남은 돈으로 간식을 사 먹자.', '싸다는 것도 좋은 점이지만, 준은 "빠르냐"를 물었어. 준의 질문에 답하지 않았어.'), o('나는 버스가 더 좋아. 창밖 구경을 하면서 가고 싶거든.', '내가 좋아하는 이유만 말했어. 준의 질문에는 답하지 않았어.'), o('우리 반 애들은 다 버스 타고 다녀. 택시는 아무도 안 타.', '남들이 한다는 건 빠르다는 근거가 아니야.')], react: 'nod', note: '상대가 물은 것(빠르기)에 확인할 수 있는 사실로 답하면 가장 힘이 세.' },
      { id: 'e323', lv: 4, set: 'shop', type: 'persuade', cast: [{ r: 'shop', feel: 'think' }, { r: 'kid', feel: 'neutral', prop: 'paper' }], intro: '민이는 학교 축제에 쓸 귤을 조금 후원받고 싶어.', cue: { w: 0, t: '후원이라… 나한테는 뭐가 좋은데?' }, q: '아저씨를 설득하는 말로 가장 좋은 것은?', opts: [o('축제 안내문에 가게 이름을 넣어 드려서, 손님이 늘 수 있어요.'), o('저희가 축제를 정말 열심히 준비해서 꼭 멋지게 성공하고 싶어요.', '우리가 바라는 것만 말했어. 아저씨가 물은 "나한테 좋은 점"에 답하지 않았어.'), o('다른 가게 사장님들도 거의 다 조금씩 후원해 주셨어요.', '남들이 했다는 건 아저씨에게 좋은 점이 아니야.'), o('귤은 비타민 C가 많아서 몸에 아주 좋은 과일이에요.', '맞는 사실이지만 후원과는 상관없어. 아저씨의 질문에 답하지 않았어.')], react: 'nod', after: 'happy', note: '부탁할 땐 상대가 물은 "나한테 좋은 점"을 분명히 말해 줘.' },
      // lv5: 사자성어·속담 with close distractors
      { id: 'e324', lv: 5, set: 'classroom', type: 'proverb', beat: 'rain', cast: [{ r: 'friend', feel: 'proud', prop: 'umbrella' }, { r: 'kid', feel: 'happy' }], intro: '비 소식에 보라는 우산과 비옷을 챙겨 왔어. 오후에 정말 비가 쏟아졌어.', cue: { w: 0, t: '일기 예보 보고 챙겨 왔지!' }, line: '"{}". 보라한테 딱 맞는 말이야.', q: '빈칸에 어울리는 말은?', opts: [o('유비무환'), o('설상가상', '나쁜 일이 겹칠 때 쓰는 말이야. 보라는 미리 준비해서 걱정이 없어.'), o('일석이조', '한 가지 일로 두 가지 이득을 볼 때 쓰는 말이야.'), o('소 잃고 외양간 고친다', '일이 벌어진 뒤에야 대비할 때 쓰는 말이야. 보라는 미리 준비했어.')], react: 'nod', after: 'happy', note: '"유비무환": 미리 준비해 두면 걱정할 일이 없어.' },
      { id: 'e325', lv: 5, set: 'park', type: 'proverb', beat: 'rain', cast: [{ r: 'kid', feel: 'worried' }, { r: 'jun', feel: 'sad' }], intro: '소풍 날 준이 도시락을 잃어버렸는데, 비까지 내리기 시작했어.', cue: { w: 0, t: '준아, 괜찮아?' }, line: '"{}". 딱 오늘 같은 날을 두고 하는 말이야.', q: '빈칸에 어울리는 말은?', opts: [o('설상가상'), o('금상첨화', '좋은 일에 좋은 일이 더해질 때 쓰는 말이야. 지금은 나쁜 일이 겹쳤어.'), o('전화위복', '나쁜 일이 오히려 좋은 일로 바뀔 때 쓰는 말이야. 아직 좋은 일은 없어.'), o('자업자득', '자기가 한 일의 결과를 받는다는 뜻이야. 비가 온 건 준 탓이 아니야.')], react: 'nod', after: 'neutral', note: '"설상가상": 눈 위에 서리가 덮이듯 나쁜 일이 겹치는 거야.' },
      { id: 'e326', lv: 5, set: 'classroom', type: 'proverb', cast: [{ r: 'jun', feel: 'angry' }, { r: 'kid', feel: 'think' }], intro: '준이 동생 때문에 화가 났어. 그런데 준도 형 물건을 몰래 쓴 적이 있어.', cue: { w: 0, t: '동생이 맨날 내 물건을 몰래 써!' }, line: '"{}". 동생 입장이 되어 생각해 봐.', q: '빈칸에 어울리는 말은?', opts: [o('역지사지'), o('동문서답', '묻는 말에 엉뚱하게 대답할 때 쓰는 말이야.'), o('이심전심', '말하지 않아도 마음이 통할 때 쓰는 말이야.'), o('자업자득', '자기가 한 일의 결과를 받는다는 뜻이야. 지금은 입장을 바꿔 생각해 보자는 말이 필요해.')], react: 'nod', after: 'neutral', note: '"역지사지": 처지를 바꿔 상대 입장에서 생각해 보는 거야.' },
      { id: 'e327', lv: 5, set: 'home', type: 'proverb', cast: [{ r: 'mom', feel: 'worried' }, { r: 'kid', feel: 'sorry', prop: 'flower' }], sp: 0, intro: '민이가 화분에 매일 물을 잔뜩 줬더니 잎이 누렇게 시들었어.', cue: { w: 1, t: '매일 물을 듬뿍 줬는데 왜 시들었지?' }, line: '"{}". 물도 너무 많으면 탈이 나는구나.', q: '빈칸에 어울리는 말은?', opts: [o('과유불급'), o('다다익선', '많을수록 좋다는 뜻이야. 지금은 많아서 오히려 탈이 났어.'), o('일석이조', '한 가지 일로 두 가지 이득을 볼 때 쓰는 말이야.'), o('금상첨화', '좋은 일에 좋은 일이 더해질 때 쓰는 말이야.')], react: 'nod', after: 'neutral', note: '"과유불급": 지나친 것은 모자란 것과 같아.' },
      { id: 'e328', lv: 5, set: 'street', type: 'proverb', cast: [{ r: 'kid', feel: 'surprised' }, { r: 'jun', feel: 'happy' }], intro: '준은 다리를 다쳐 수학여행을 못 갔어. 그런데 그날 여행지에 큰 태풍이 왔대.', cue: { w: 0, t: '준아, 수학여행 간 날 거기 태풍 왔대!' }, line: '"{}". 다친 게 오히려 다행이었네.', q: '빈칸에 어울리는 말은?', opts: [o('새옹지마'), o('설상가상', '나쁜 일이 겹칠 때 쓰는 말이야. 여기선 나쁜 일이 다행으로 바뀌었어.'), o('금상첨화', '좋은 일에 좋은 일이 더해질 때 쓰는 말이야. 다친 건 좋은 일이 아니었어.'), o('일석이조', '한 가지 일로 두 가지 이득을 볼 때 쓰는 말이야.')], react: 'nod', after: 'happy', note: '"새옹지마": 좋은 일과 나쁜 일은 미리 알 수 없어.' },
      { id: 'e329', lv: 5, set: 'classroom', type: 'proverb', cast: [{ r: 'friend', feel: 'tired', prop: 'paper' }, { r: 'kid', feel: 'think' }, { r: 'jun', feel: 'angry' }], sp: 0, intro: '모둠 포스터를 만드는데 다섯 명이 저마다 다르게 하자고 해서 하나도 못 정했어.', cue: { w: 2, t: '아니야, 내 그림대로 하자니까!' }, line: '"{}". 다들 자기 말만 하니 하나도 못 정했네.', q: '빈칸에 어울리는 속담은?', opts: [o('사공이 많으면 배가 산으로 간다'), o('백지장도 맞들면 낫다', '함께하면 더 쉬워진다는 뜻이야. 지금은 함께해서 오히려 엉망이 됐어.'), o('낮말은 새가 듣고 밤말은 쥐가 듣는다', '어디서든 말조심하라는 뜻이야.'), o('가는 말이 고와야 오는 말이 곱다', '내가 곱게 말해야 남도 곱게 말한다는 뜻이야.')], react: 'nod', after: 'neutral', note: '"사공이 많으면 배가 산으로 간다": 저마다 이끌려 하면 일이 엉뚱하게 흘러가.' },
    ],
    en: [
      { id: 'e301', lv: 1, set: 'classroom', type: 'think', think: true, cast: [{ r: 'kid', feel: 'happy', prop: 'medal' }, { r: 'friend', feel: 'sad' }], sp: 1, intro: 'Min came first in the class race and Bora came second. Bora speaks with her eyes down.', cue: { w: 1, t: 'Congrats on first place, Min. You really earned it.' }, q: 'Which thought fits Bora best?', opts: [o("I'm happy for Min, but I really wanted to win too."), o("I'm just completely happy for Min. Nothing else.", 'She said congratulations, but her eyes are down. "Just happy" misses that clue.'), o("Second place is fine, so I don't feel anything.", 'If she felt nothing, she would not look away. Her face is the clue.'), o('I think Min must have cheated to win.', 'Nothing points to cheating. That is a guess with no evidence.')], react: 'nod', after: 'neutral', note: 'Kind words and lowered eyes: two feelings can be there at once. Pick the reading every clue supports.' },
      { id: 'e302', lv: 1, set: 'bus', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'jun', feel: 'worried' }], sp: 1, intro: 'The friends plan a trip to an amusement park. Last time, Jun left the roller-coaster line.', cue: { w: 1, t: "Sure, I'll come. Sounds fun." }, q: 'Which thought fits Jun best?', opts: [o('I want to go with everyone, but the rides worry me.'), o("I can't wait to ride the biggest roller coaster there!", 'Last time he left the roller-coaster line. That clue does not fit.'), o("I'm angry they planned the whole trip without me.", 'They are inviting Jun. Nothing shows he was left out.'), o('The amusement park costs too much for me this time.', 'Nobody mentioned money. That is a guess with no evidence.')], react: 'nod', after: 'neutral', note: '"Sounds fun" plus what happened last time shows two feelings: wanting to go, and worry.' },
      { id: 'e303', lv: 1, set: 'classroom', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'friend', feel: 'sad', prop: 'paper' }], sp: 1, intro: 'Bora folded her math test in half and put it away. Min asked how it went.', cue: { w: 1, t: "Um… it was okay. I'll do better next time." }, q: 'Which thought fits Bora best?', opts: [o('My score was low and it hurts, but I want to try again.'), o('My score was great, but I want to keep it a secret.', 'If it were great, she would not say "I\'ll do better next time."'), o("My score was low, so I'm giving up on math for good now.", 'She said she will do better next time. Giving up is the opposite.'), o("I'm really angry that Min asked about my score.", 'She answered quietly. There is no sign of anger.')], react: 'nod', after: 'neutral', note: 'Folding the test away and "next time" together show both feelings.' },
      { id: 'e304', lv: 1, set: 'park', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'friend', feel: 'sad' }], sp: 1, intro: 'Bora is moving far away next month. She pushes the swing slowly and speaks.', cue: { w: 1, t: 'My new school will be fun, I guess.' }, q: 'Which thought fits Bora best?', opts: [o("I'm curious about the new school, but I'll miss my friends."), o("I'm so excited about the new school that I want to move right now.", '"I guess" and the slow swing show she is not only excited.'), o("I'm really angry at Mom because we have to move away.", 'Nothing shows anger at Mom. That is a guess with no evidence.'), o("I'm only scared that I'll never make a single new friend.", 'She also said it will be fun. "Only scared" uses half the clues.')], react: 'nod', after: 'neutral', note: '"It will be fun, I guess" mixes hope and sadness.' },
      { id: 'e305', lv: 1, set: 'shop', type: 'think', think: true, cast: [{ r: 'kid', feel: 'neutral' }, { r: 'shop', feel: 'shy' }], sp: 1, intro: 'After thirty years, the shop closes next week. Mr. Lee polishes the shelves carefully and smiles.', cue: { w: 1, t: 'Time for me to rest, ha ha.' }, q: 'Which thought fits Mr. Lee best?', opts: [o("It's a relief to rest, but I'll miss this little old shop."), o("I'm just glad to finally close this shop for good.", 'He polishes the shelves carefully to the very end. "Just glad" misses that.'), o("I'm angry because hardly any customers come here anymore.", 'Nobody mentioned customers. That is a guess with no evidence.'), o("I'm excited to open a much bigger shop next year.", 'There is no clue about a new shop.')], react: 'nod', after: 'neutral', note: 'A smile and careful polishing: relief and sadness together.' },
      { id: 'e306', lv: 1, set: 'classroom', type: 'evidence', think: true, cast: [{ r: 'kid', feel: 'think' }, { r: 'jun', feel: 'sad' }], sp: 0, intro: 'Jun fell in P.E. and says he is fine. But he limps every time he goes down the stairs.', cue: { w: 1, t: "I'm fine. It doesn't hurt much." }, q: 'Which clue shows Jun is really hurt?', opts: [o('He limps on one leg going down the stairs.'), o('He smiled and said, "It doesn\'t hurt much."', 'That is what Jun says. The clue is what he does, not what he says.'), o('He walks down the stairs with his friends.', 'Everyone does that. It is not a sign of pain.'), o('He fell while playing soccer in P.E.', 'That is why he might be hurt, but it does not show he is hurt now. Look for what you can see.')], react: 'nod', after: 'neutral', note: 'Actions are often better clues than words. Evidence makes an inference strong.' },
      { id: 'e307', lv: 2, set: 'home', type: 'irony', think: true, beat: 'shatter', cast: [{ r: 'dad', feel: 'angry' }, { r: 'kid', feel: 'think' }, { r: 'little', feel: 'sorry', prop: 'ball' }], sp: 1, intro: 'Dan was playing ball and broke a vase. Dad sighs and speaks.', cue: { w: 0, t: 'Great job. Really great.' }, q: 'What does Dad really mean?', opts: [o("He is upset that Dan wasn't careful."), o('He is relieved that nobody got hurt.', 'If he were relieved, he would ask "Are you okay?" A sigh plus "great job" is sarcasm.'), o('He is proud that Dan told the truth.', 'Dan has not said anything yet. There is nothing to praise.'), o("He is saying the old vase doesn't matter.", 'Comfort would sound gentle. The sigh is the clue.')], react: 'nod', after: 'neutral', note: 'Saying the opposite of what you mean is sarcasm. The sigh, the face and the situation are the clues.' },
      { id: 'e308', lv: 2, set: 'park', type: 'figure', think: true, cast: [{ r: 'friend', feel: 'proud' }, { r: 'kid', feel: 'sorry' }], intro: 'Min was late, and Bora grins.', cue: { w: 0, t: "It's fine. My heart is as big as the ocean, you know." }, q: 'What does Bora mean?', opts: [o('She forgives Min for being late.'), o('She is very, very upset about it.', '"Big" is about how generous her heart is, not how upset she is. She is grinning.'), o('She wants to go to the beach today.', 'The ocean is only a comparison. She is not making plans.'), o('Min can be late every time from now on.', 'She forgives this time. That is not permission to be late again.')], react: 'laugh', after: 'happy', note: '"As big as the ocean" is a comparison. Find what is compared to what, and the meaning shows.' },
      { id: 'e309', lv: 2, set: 'street', type: 'figure', cast: [{ r: 'grandma', feel: 'happy', prop: 'cane' }, { r: 'kid', feel: 'shy' }], intro: 'Grandma has not seen Min for a long time.', cue: { w: 0, t: "You've grown so much. Time really flies!" }, q: 'Which answer fits what Grandma means?', opts: [o("It really does go fast, doesn't it?"), o('Yes, flying things can be dangerous.', 'Grandma compares time to something that flies fast, not to something dangerous.'), o("It really does go slowly, doesn't it?", 'Flying is fast. Slow is the opposite.'), o('Does time have wings, Grandma?', 'That takes it literally. "Time flies" means time passes quickly.')], react: 'laugh', after: 'happy', note: '"Time flies" means time passes very quickly.' },
      { id: 'e310', lv: 2, set: 'shop', type: 'irony', think: true, cast: [{ r: 'mom', feel: 'tired' }, { r: 'kid', feel: 'shy' }], intro: 'At the toy shop. Min has asked for a third toy already.', cue: { w: 0, t: 'Sure, we have zero toys at home, so we must buy it.' }, q: 'What does Mom really mean?', opts: [o('We have plenty of toys, so no more.'), o("We have no toys, so she'll buy one.", 'There are lots of toys at home. Mom means the opposite.'), o('We should throw old toys out and buy new.', 'Mom said nothing about throwing toys out. That reads too much into it.'), o('She will buy a different present instead.', 'No other present was mentioned. Mom means "that is enough".')], react: 'nod', note: '"Zero toys, so we must buy it" is sarcasm for "you have too many".' },
      { id: 'e311', lv: 2, set: 'park', type: 'irony', think: true, cast: [{ r: 'jun', feel: 'excited' }, { r: 'kid', feel: 'think' }], intro: 'Picnic morning. The sky is clear and the breeze is cool.', cue: { w: 0, t: 'Wow, what lovely weather!' }, q: 'What does Jun mean?', opts: [o('He really means it. The weather is great.'), o('He means the opposite. The weather is awful.', 'The sky is clear. When the words match the situation, it is not sarcasm.'), o('He means the picnic will be over soon.', 'Nothing suggests the picnic is ending.'), o('He means it is too hot to have fun.', 'The breeze is cool. There is no clue about heat.')], react: 'cheer', after: 'happy', note: 'The same words can be sincere or sarcastic. If they match the situation, they are sincere.' },
      { id: 'e312', lv: 2, set: 'classroom', type: 'irony', think: true, beat: 'rain', cast: [{ r: 'jun', feel: 'angry', prop: 'umbrella' }, { r: 'kid', feel: 'think' }], intro: 'Picnic morning. Rain is pouring outside the window.', cue: { w: 0, t: 'Wow, what lovely weather!' }, q: 'What does Jun mean?', opts: [o('He is upset the rain spoiled the picnic.'), o('He truly thinks the rain is beautiful.', 'Rain on picnic day is not lovely to him. He says the opposite of what he feels.'), o('He thinks the rain is going to stop very soon.', 'Nothing suggests the rain will stop. That goes too far.'), o('He is asking Ms. Kim to change the date.', 'He is not talking to Ms. Kim. He is being sarcastic.')], react: 'nod', after: 'neutral', note: '"Lovely weather" on a sunny day is sincere; on a rainy picnic day it is sarcasm.' },
      { id: 'e313', lv: 3, set: 'classroom', type: 'formal', cast: [{ r: 'principal', feel: 'happy' }, { r: 'kid', feel: 'neutral', prop: 'paper' }, { r: 'friend', feel: 'neutral' }], intro: 'The principal visits the class. Min, the class president, starts the presentation.', cue: { w: 0, t: "Go ahead. Show me what you've prepared." }, q: 'Which line fits speaking to the principal?', opts: [o('Good morning, Principal Park. Our class is ready to begin.'), o('Yo, Principal Park! Our class is gonna start the show now, okay?', '"Yo", "gonna" and "okay?" are far too casual for a principal.'), o('Good morning, Principal Park. Please begin our presentation.', 'The class is giving the presentation, not the principal.'), o('Good morning, Park. Our class is ready to begin, sir.', 'Calling him just "Park" is rude. Use his title: "Principal Park".')], react: 'clap', note: 'Formal speech uses titles, full sentences and no slang.' },
      { id: 'e314', lv: 3, set: 'shop', type: 'formal', cast: [{ r: 'neighbor', feel: 'happy' }, { r: 'kid', feel: 'neutral', prop: 'cup' }], intro: 'At the school fair. Min is serving juice to a customer.', cue: { w: 0, t: 'I ordered one juice.' }, q: 'Which line fits serving a customer?', opts: [o('Here is the juice you ordered. Please enjoy!'), o("Here's your juice. Drink it, okay?", '"Drink it, okay?" sounds like an order. Serving a customer needs polite words.'), o('Here is the juice I ordered. Please enjoy!', 'The customer ordered it, not Min.'), o("Here is the juice you ordered. You're welcome!", '"You\'re welcome" answers a thank-you. Nobody has thanked Min yet.')], react: 'nod', note: 'Service language is polite and focused on the customer: "you ordered", "please enjoy".' },
      { id: 'e315', lv: 3, set: 'home', type: 'formal', cast: [{ r: 'mom', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }, { r: 'grandma', feel: 'happy' }], intro: 'Mom asks Min to find out what Grandma would like for dinner.', cue: { w: 0, t: 'Min, go and ask Grandma.' }, q: 'Which line asks Grandma most politely?', opts: [o('Grandma, what would you like to have for dinner?'), o('Grandma, what do you want to eat for dinner?', 'That is fine with a friend, but "What would you like…?" is the polite way to ask a grown-up.'), o('Grandma, what would you like me to have for dinner?', 'That asks what Min should eat. Min is asking about Grandma.'), o('Grandma, Mom says what would you like for dinner?', 'That mixes two sentences. Ask Grandma directly.')], react: 'nod', after: 'happy', note: '"Would you like…?" is a polite way to ask what someone wants.' },
      { id: 'e316', lv: 3, set: 'classroom', type: 'formal', cast: [{ r: 'principal', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }], intro: "Ms. Kim sends Min to the principal's office with a message.", cue: { w: 0, t: 'Yes? What is it?' }, q: 'Which line passes on the message politely?', opts: [o('Excuse me, Principal Park. Ms. Kim asked if you could come to our class.'), o('Excuse me, Principal Park. Ms. Kim says come to our class now.', 'That sounds like an order to the principal. Pass it on politely: "asked if you could…"'), o('Excuse me, Principal Park. Ms. Kim asked if she could come to your class.', 'It is the other way around. Ms. Kim wants the principal to come.'), o('Hey, Principal Park. Ms. Kim asked if you could come to our class.', '"Hey" is too casual for a principal. Start with "Excuse me".')], react: 'nod', note: 'When you pass on a request, keep it polite: "She asked if you could…"' },
      { id: 'e317', lv: 3, set: 'bus', type: 'formal', cast: [{ r: 'man', feel: 'neutral' }, { r: 'kid', feel: 'sorry' }, { r: 'grandma', feel: 'neutral', prop: 'cane', name: { ko: '할머니', en: 'An older lady' } }], intro: "Min's class was noisy on the bus. Min, the class president, apologizes to the passengers.", cue: { w: 0, t: 'Could you keep it down, please?' }, q: 'Which apology fits speaking to the passengers?', opts: [o("We're very sorry for the noise our class made. We'll keep it down."), o("Sorry 'bout the noise, guys. We'll keep it down.", '"Sorry \'bout" and "guys" are too casual for an apology to strangers.'), o("We're very sorry for the noise you made. We'll keep it down.", 'The class made the noise, not the passengers.'), o("We're very sorry for the noise our class made. Please keep it down.", 'Telling the passengers to be quiet turns the apology around.')], react: 'bow', note: 'A formal apology says who did what, says sorry, and says what will change.' },
      { id: 'e318', lv: 3, set: 'park', type: 'formal', cast: [{ r: 'jun', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }, { r: 'grandma', feel: 'worried', prop: 'cane', name: { ko: '할머니', en: 'An older lady' } }], intro: 'An older lady is lost. Min is going to walk her to the help desk.', cue: { w: 0, t: 'Min, where are you going?' }, q: 'Which line fits what Min tells Jun?', opts: [o("Jun, I'll walk this lady to the help desk. I'll be right back!"), o("Jun, I'll walk this old granny to the help desk. Back soon!", '"Old granny" is not respectful for a lady you do not know. Say "this lady".'), o('Jun, this lady will walk me to the help desk. Back soon!', 'Min is helping her, not the other way around.'), o("Jun, I'll walk this lady to the help desk, sir. Back soon!", '"Sir" is for grown-ups. Jun is a friend.')], react: 'nod', note: 'Respectful words about the lady, easy words for your friend: watch both directions.' },
      { id: 'e319', lv: 4, set: 'classroom', type: 'persuade', cast: [{ r: 'friend', feel: 'think' }, { r: 'kid', feel: 'neutral' }, { r: 'jun', feel: 'neutral' }], intro: 'The class is choosing a trip. Min wants the science center.', cue: { w: 0, t: "The science center? Won't it be boring?" }, q: 'Which line persuades Bora best?', opts: [o("It has tons of hands-on exhibits, so there's no time to get bored."), o("I've wanted to go there for ages, so let's pick it this time.", 'That is only what Min wants. It does not answer Bora\'s worry about boredom.'), o('Almost every other class is going there, so we should too.', 'Others going is a weak reason. It does not answer her worry.'), o('The science center is only three subway stops from our school.', 'True, but Bora asked about fun, not distance.')], react: 'nod', after: 'happy', note: 'The strongest argument answers the other person\'s worry directly.' },
      { id: 'e320', lv: 4, set: 'home', type: 'persuade', cast: [{ r: 'mom', feel: 'think' }, { r: 'kid', feel: 'neutral', prop: 'bag' }], intro: "Min wants to sleep over at Bora's house.", cue: { w: 0, t: "Hmm, will Bora's parents be home? And your homework?" }, q: 'Which line persuades Mom best?', opts: [o("Bora's mom will be home all evening, and I'll do my homework first."), o('Bora and I are best friends, and we have so many games to play.', 'That is what Min wants. It does not answer Mom\'s two questions.'), o("Almost everyone in my class has had a sleepover at Bora's.", 'What others did does not answer Mom\'s worries.'), o("If you let me go, I'll clean my room every single day for the whole next week.", 'A nice deal, but it dodges both of Mom\'s questions.')], react: 'nod', after: 'happy', note: 'Mom asked two things. Answer each one, and you persuade.' },
      { id: 'e321', lv: 4, set: 'park', type: 'persuade', cast: [{ r: 'jun', feel: 'tired', prop: 'ball' }, { r: 'kid', feel: 'neutral' }], intro: 'There is litter where they played. Min wants to clean up together.', cue: { w: 0, t: "Ugh, too much work. We didn't even drop it." }, q: 'Which line persuades Jun best?', opts: [o('It takes ten minutes, and our spot will be clean for next time.'), o('Picking up litter is a good thing, so we really have to do it.', 'True, but it does not answer "too much work". Short time and a benefit to us are stronger.'), o("Those other kids over there are all picking up trash, so let's too.", 'Others doing it is a weak reason.'), o('All this trash makes me feel really sad and upset inside.', 'Leaning on feelings leaves Jun\'s worry about the work unanswered.')], react: 'nod', after: 'happy', note: '"Too much work" gets "ten minutes"; "not ours" gets "our spot next time".' },
      { id: 'e322', lv: 4, set: 'bus', type: 'persuade', cast: [{ r: 'jun', feel: 'worried' }, { r: 'kid', feel: 'neutral' }], intro: 'At the bus stop. Jun wants a taxi, but Min thinks the bus is better.', cue: { w: 0, t: "Isn't a taxi faster?" }, q: 'Which line persuades Jun best?', opts: [o("The roads are jammed now, but the bus has its own lane, so it's faster."), o('The bus is way cheaper, so we can buy snacks with the money we save.', 'Cheaper is nice, but Jun asked about speed. It does not answer him.'), o('I just like the bus better. I love looking out the window.', 'That is only what Min likes. It does not answer Jun.'), o('Everyone in our class takes the bus. Nobody takes taxis.', 'What others do is not evidence about speed.')], react: 'nod', note: 'Answer the question that was asked, with a fact you can check.' },

      say(sc.q, { bubble: false, hold: 0.1 }).then(function () { if (S.token !== token || S.phase !== 'choose') return; S.hintT = 0; if (readsOptions()) readOptions(sc, token); });
    });
    if (S.token !== token) return;
    await right(picked, token);
  }
  async function wrong(idx, btn, token) {
    var sc = S.scene, op = sc.opts[idx], sid = S.si, my = ++S.fbId;
    btn.disabled = true; btn.classList.add('bt-wrong');
    if (!S.wrongHere) { S.wrongHere = true; S.mistakes++; }
    ph('feedback'); K.sound.play('wrong');
    var li = S.listener; li.set('puzzled'); li.question(true); li.play('tilt', { face: 'puzzled' });
    K.fx.pop({ ko: '응?', en: 'Hmm?' }, li.top(0.6), { color: '#FFB21E', size: 2.6, baby: false });
    haru.play('think'); camPlay(0.7);
    await say({ ko: '음, ' + (op.why || '그 말은 지금 상황에 안 어울려.') + ' 다시 골라 볼까?', en: 'Hmm. ' + (op.why || 'That line does not fit here.') + ' Try again!' }, { hold: 0.3 });
    // only this explanation may hand the scene back: not after a right tap, a newer wrong tap, or the next scene (review M1)
    if (S.token !== token || S.si !== sid || S.fbId !== my || S.phase !== 'feedback') return;
    li.question(false); li.set(sc.cast[li.idx].feel || 'neutral');
    ph('choose'); S.hintT = 0; camSpeaker(0.8);
  }
  async function right(idx, token) {
    var sc = S.scene, op = sc.opts[idx], sp = S.speaker, spi = sc.sp == null ? 1 : sc.sp;
    K.sound.play('correct'); UI.hideSay(true);
    if (S.listener) { S.listener.question(false); S.listener.set(sc.cast[S.listener.idx].feel || 'neutral'); }   // after a quick right tap the puzzled face must not stay
    var full = (sc.line || '{}').replace('{}', op.t);
    sp.bub.txt.innerHTML = lineHtml(sc.line || '{}', op.t, true); sp.bub.text = full; sp.bub.kind = 'said'; sp.bub.el.classList.remove('bt-pulse'); sp.bub.el.classList.add('bt-filled'); UI.bump(sp.bub.el);
    K.fx.burst(sp.top(0.2), 'stars', { count: 8 }); K.fx.burst(sp.top(0.2), 'sparkle', { count: 14 });
    K.fx.pop(pickLine(UI.mature ? [{ ko: '딱 맞는 말', en: 'That fits' }, { ko: '좋아', en: 'Nice' }] : [{ ko: '딱 맞는 말이야!', en: 'Perfect line!' }, { ko: '멋진 대사!', en: 'Great line!' }, { ko: '어울려!', en: 'That fits!' }]), { x: st.w / 2, y: st.h * 0.2 }, { color: '#3CC84A', size: 3.4, rise: 1.4 });
    updateStars();
    if (qEl) qEl.classList.add('bt-done');
    sp.set(sc.after || (sc.type === 'feel' ? sc.cast[spi].feel : 'happy'));
    await K.wait(0.35); if (S.token !== token) return;
    // the line is spoken by the character in its own voice (a thought is spoken softly as well), the others react
    await sp.say(full, { hold: 0.2 }); if (S.token !== token) return;
    camPlay(0.9); hideCard();
    S.actors.forEach(function (a) {
      if (a === sp) return;
      var r = sc.react || 'nod';
      if (r === 'hug' || r === 'pat') { a.hopTo(a.group.position.x * 0.45 + sp.group.position.x * 0.55 - (a.group.position.x < sp.group.position.x ? 0.75 : -0.75), a.group.position.z + 0.3).then(function () { a.play('nod'); }); }
      else if (r === 'droop') a.play('droop');
      else if (r === 'laugh') { a.set('laugh'); a.play('jump', { face: 'laugh' }); }
      else a.play(r, { face: { nod: 'happy', bow: 'happy', clap: 'laugh', cheer: 'laugh', wave: 'happy' }[r] });
    });
    applause(1.1);
    sp.play(sc.type === 'feel' ? 'nod' : 'jump', { face: sc.after || (sc.type === 'feel' ? sc.cast[spi].feel : 'happy') });
    if (sc.note) { haru.play('cheer'); await say(sc.note, { hold: 0.25 }); if (S.token !== token) return; }
    else await K.wait(0.8);
    closeAsk();
    S.chip.set(S.si + 1, 5); UI.bump(S.chip.el); K.sound.play('collect');
    await K.wait(0.45);
  }

  // ---------------------------------------------------------------- round
  async function play() {
    var token = ++S.token;
    ph('intro'); S.mistakes = 0; S.starsShown = 0; S.plog = [];
    K.setState('play'); K.sound.music(true);
    TH.variant = { band: L.band || 'K', lang: K.lang };
    TH.lights.mood('play', 1.0);
    (S.titleCast || []).forEach(function (a) { K.fx.burst(a.group.position.clone().add(V(0, 0.5, 0)), 'puff', { count: 6 }); a.stop(); a.show(false); }); S.titleCast = null;
    S.scenes = S.forced && S.forced.length ? BT.content.byIds(L.band, L.level, K.lang, S.forced) : BT.content.round(L.band, L.level, K.lang);
    if (S.scenes.length < 5) S.scenes = S.scenes.concat(BT.content.round(L.band, L.level, K.lang).filter(function (x) { return !S.scenes.some(function (y) { return y.id === x.id; }); })).slice(0, 5);
    S.bar = UI.topBar({ close: true, sound: true, lang: false, stars: 3, onClose: function () { K.sound.stopSpeech(); toTitle(); } }); S.bar.stars.set(0);
    S.chip = UI.progress({ icon: '🎭', total: 5, value: 0 });
    TH.dust = true;
    TH.camTo(st, 'play', 1.4);
    var hp = haruPost(); S.haruPost = hp;
    haru.hopTo(hp.x, hp.z).then(function () { haru.lookAt('camera'); });
    await K.wait(1.0); if (S.token !== token) return;
    for (var i = 0; i < S.scenes.length; i++) { await runScene(i, token); if (S.token !== token) return; }
    await curtainCall(token); if (S.token !== token) return;
    finish(token);
  }
  /** the roles that played most this round (the curtain call shows at most five, review M8) */
  function topRoles(n) {
    var count = {}, first = {};
    S.scenes.forEach(function (sc, k) { sc.cast.forEach(function (c) { count[c.r] = (count[c.r] || 0) + 1; if (first[c.r] == null) first[c.r] = k; }); });
    return Object.keys(count).sort(function (a, b) { return count[b] - count[a] || first[a] - first[b]; }).slice(0, n);
  }
  async function curtainCall(token) {
    ph('curtain'); closeAsk(true); UI.hideSay(true); label.classList.add('bt-hide'); hideCard();
    K.expose({ task: { step: 'curtain' } });
    TH.lights.set(0.35, 0.6); await TH.curtain.set(false, 0.9); if (S.token !== token) return;
    clearBubbles(); cast.hideAll(); BT.beats.clear();
    TH.setScene('stage');   // an empty velvet stage: no props from the last scene in the bow line
    var roles = topRoles(5), n = roles.length, left = Math.ceil(n / 2), step = TH.portrait(st) ? 1.05 : 1.4;
    S.callRoles = roles;
    roles.forEach(function (r, k) {
      var a = cast.get(r), x = k < left ? -step - k * step : step + (k - left) * step;
      a.setProp(null); a.set('happy'); a.place(x, -0.5 + Math.abs(x) * 0.08); a.lookAt('camera'); a.show(true);
    });
    haru.hopTo(0, 0.9);
    TH.lights.aim(0, -2.4, 0, 0); TH.lights.aim(1, 2.4, 0, 0);
    TH.camTo(st, 'call', 1.2);
    await K.wait(0.4); if (S.token !== token) return;
    TH.lights.set(1, 1.0); await TH.curtain.set(true, 1.4); if (S.token !== token) return;
    applause(3.0); K.sound.play('fanfare');
    K.fx.pop({ ko: '커튼콜!', en: 'Curtain call!' }, { x: st.w / 2, y: st.h * 0.21 }, { color: '#FF5C6E', size: 4.2, dur: 2.2, rise: 1 });
    K.fx.burst(V(0, TH.STAGE_Y + 2.2, 0.5), 'confetti', { count: 90, power: 8 });
    roles.forEach(function (r, k) { var a = cast.get(r); K.wait(0.1 + k * 0.12).then(function () { return a.play('bow'); }).then(function () { return a.play('cheer'); }); });
    haru.play('cheer');
    await say(UI.mature ? { ko: '커튼콜이야. 다섯 장면 모두 잘 골랐어.', en: 'Curtain call. All five scenes done.' } : { ko: '커튼콜! 모두 박수! 다섯 장면 다 해냈어!', en: 'Curtain call! Everyone clap! You did all five scenes!' }, { hold: 0.2 });
    if (S.token !== token) return;
    await K.wait(0.6);
  }
  /** the results card covers the right half: one row of up to four actors on the left, spaced, everyone landed before the card (M8) */
  async function regroupForCard() {
    var roles = (S.callRoles || []).slice(), keepR = roles.slice(0, 4);
    roles.slice(4).forEach(function (r) { var a = cast.get(r); K.fx.burst(a.group.position.clone().add(V(0, 0.6, 0)), 'puff', { count: 9 }); a.stop(); a.show(false); });
    var xs = [-5.0, -3.75, -2.5, -1.25], off = 4 - keepR.length;
    st.camTo(V(-0.15, 3.2, 11.4), V(-0.15, 1.65, 0), 1.0, 'sineInOut');
    var hops = keepR.map(function (r, k) { var a = cast.get(r); a.stop(); return K.wait(k * 0.08).then(function () { return a.hopTo(xs[k + off], -0.55, { step: 1.4 }); }).then(function () { a.lookAt('camera'); a.set('happy'); }); });
    // Haru bows out to the wing: the card shows him (kids' theme), and he never hides an actor in the row
    hops.push(haru.hopTo(-7.2, 1.3, { step: 1.6 }));
    await Promise.all(hops);
  }
  async function finish(token) {
    ph('result');
    await regroupForCard(); if (S.token !== token) return;
    var stars = starsFor(S.mistakes), hint = BT.content.hint(L.band, L.level);
    // three stars after a mistake is not "perfect" (review M8)
    var title = stars === 3 && S.mistakes > 0 ? (UI.mature ? { ko: '아주 잘했어', en: 'Great work' } : { ko: '아주 잘했어!', en: 'Great job!' }) : undefined;
    haru.play('cheer');
    document.documentElement.classList.add('bt-res');   // confetti behind the card text
    var res = await K.learn.finish({ stars: stars, align: 'right', haru: UI.mature ? false : undefined, title: title, sub: { ko: '장면 5개 완성! ' + hint.ko, en: '5 scenes done! ' + hint.en } });
    document.documentElement.classList.remove('bt-res');
    if (S.token !== token) return;
    if (res.action === 'again') { await UI.wipe(function () { resetStage(); }); play(); }
    else toTitle();
  }
  function resetStage() {
    clearBubbles(); cast.hideAll(); closeAsk(true); UI.hideSay(true); label.classList.add('bt-hide'); hideCard(); BT.beats.clear();
    document.documentElement.classList.remove('bt-res');
    TH.curtain.set(false, 0); TH.lights.set(0.7, 0); TH.lights.aim(0, -1.4, 0.15, 0); TH.lights.aim(1, 1.4, 0.15, 0); TH.lights.mood('title', 0); TH.dust = false;
    haru.stop(); haru.set('idle');
  }
  function toTitle() {
    S.token++; ph('title');
    resetStage();
    if (S.chip) { S.chip.remove(); S.chip = null; }
    K.sound.music(false);
    TH.camTo(st, 'title', 0); haru.place(HARU_TITLE.x, HARU_TITLE.z); haru.lookAt('camera');
    // two friends wait on the apron in front of the closed curtain
    S.titleCast = [['friend', -3.3, 1.95, 'excited'], ['kid', -1.95, 2.0, 'happy']].map(function (c) { var a = cast.get(c[0]); a.setProp(null); a.set(c[3]); a.place(c[1], c[2]); a.show(true); a.lookAt('camera'); return a; });
    UI.topBar({ close: true, sound: true, lang: true });
    UI.title({ title: { ko: '말풍선\n극장', en: 'Speech Bubble\nTheater' }, subtitle: { ko: '무대 위 친구는 뭐라고 말할까?', en: 'What will they say on stage?' }, hint: function (b, l) { return tr(BT.content.hint(b, l)); }, onStart: function () { play(); } });
    ph('title');
  }
  // title idling: Haru and the two friends on the apron wave and hop now and then
  var peekT = 0;
  K.onUpdate(function (dt) {
    if (S.phase !== 'title') return;
    peekT += dt;
    if (peekT > 6) { peekT = 0; haru.play(Math.random() > 0.5 ? 'hello' : 'jump'); (S.titleCast || []).forEach(function (a, k) { K.wait(0.5 + k * 0.35).then(function () { if (S.phase === 'title') a.play(k ? 'wave' : 'jump'); }); }); }
  });

  // ---------------------------------------------------------------- test hooks
  function rectOf(el) { var r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }; }
  K.expose({
    phase: function () { return S.phase; },
    phaseLog: function () { return S.plog.slice(); },
    options: function () { return optEls.map(function (b, i) { var r = b.getBoundingClientRect(), s = b.querySelector('.bt-spk'), sr = s && s.getBoundingClientRect(); return { i: i, text: (b.querySelector('span') || b).textContent.trim(), x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2), w: Math.round(r.width), h: Math.round(r.height), disabled: !!b.disabled, right: b.classList.contains('bt-right'), glow: b.classList.contains('bt-glow'), reading: b.classList.contains('bt-reading'), pic: !!b.querySelector('b'), spk: sr ? { x: Math.round(sr.left + sr.width / 2), y: Math.round(sr.top + sr.height / 2), w: Math.round(sr.width), h: Math.round(sr.height) } : null }; }); },
    optionReads: function () { return S.readLog.slice(); },
    actors: function () { return S.actors.map(function (a) { var p = st.screenOf(a.head()); return { role: a.role, x: Math.round(p.x), y: Math.round(p.y), face: a.face(), visible: a.group.visible, bubble: a.bub && a.bub.el.isConnected ? a.bub.txt.textContent.trim() : null }; }); },
    /** the speaker's body on screen, in px (feeling scenes are framed so it is big enough to read the face) */
    speakerSize: function () { var sp = S.speaker; if (!sp) return null; var a = st.screenOf(sp.top(0)), b = st.screenOf(sp.group.position.clone()); return { h: Math.round(Math.abs(b.y - a.y)), x: Math.round(a.x), y: Math.round(a.y) }; },
    cam: function () { return TH.camName || null; },
    card: function () { return card && card.isConnected && !card.classList.contains('bt-under') ? card.textContent.trim() : null; },
    label: function () { return label.classList.contains('bt-hide') ? null : rectOf(label); },
    skip: function () { return skipLine(); },
    bubbles: function () { return bubbles.map(function (b) { var r = b.el.getBoundingClientRect(); return { who: b.who.textContent, text: b.txt.textContent.trim(), x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height), filled: b.el.classList.contains('bt-filled'), shown: b.el.style.display !== 'none' }; }); },
    haruBubble: function () { var b = UI.bubbleEl(); if (!b) return null; var r = b.getBoundingClientRect(); return { text: b.textContent.trim(), x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }; },
    haruBox: function () { var p = st.screenOf(haru.head()), q = st.screenOf(V(haru.group.position.x - 0.75, haru.group.position.y + 0.4, haru.group.position.z)); return { x: Math.round(p.x), y: Math.round(p.y), left: Math.round(q.x) }; },
    mistakes: function () { return S.mistakes; }, hintStage: function () { return S.hintStage; }, stars: function () { return S.starsShown; },
    curtain: function () { return TH.curtain.open; }, scene: function () { return S.scene ? S.scene.id : null; }, round: function () { return S.scenes.map(function (s) { return s.id; }); },
    callCast: function () { return cast.all().filter(function (a) { return a.group.visible; }).map(function (a) { var p = st.screenOf(a.head()); return { role: a.role, x: Math.round(p.x), y: Math.round(p.y), wx: +a.group.position.x.toFixed(2) }; }); },
    perf: function () { var i = st.renderer.info; return { calls: i.render.calls, tris: i.render.triangles, geos: i.memory.geometries, fps: st.fps }; },
    counts: function () { return BT.content.count(); },
    /** dev: every role on stage in two rows (with a face per role), for a cast close-up screenshot. Stops the round. */
    lineup: function (faces, only) {
      S.token++; ph('lineup'); closeAsk(true); UI.hideSay(true); clearBubbles(); cast.hideAll(); label.classList.add('bt-hide'); hideCard(); BT.beats.clear();
      TH.curtain.set(true, 0); TH.lights.set(1, 0); TH.setScene('park');
      var list = only || Object.keys(BT.ROLES), one = list.length <= 7;
      list.forEach(function (r, k) { var a = cast.get(r); a.setProp(BT.ROLES[r].prop || null); a.set((faces && faces[k % faces.length]) || 'happy'); a.place(-4.2 + (k % 7) * 1.4, one ? 0.2 : k < 7 ? -0.9 : 0.7); a.show(true); a.lookAt('camera'); });
      haru.place(-5.4, 1.6); TH.camTo(st, 'call', 0); return list;
    },
    /** tests: play these scene ids (in order) in the next round instead of a random one */
    forceScenes: function (ids) { S.forced = ids || null; return S.forced; },
    debugRound: function (band, level, lang) { return BT.content.round(band, level, lang).map(function (s) { return { id: s.id, lv: s.lv, set: s.set, n: s.opts.length, answer: s.answer, tag: s.showTag }; }); },
  });

  toTitle();
  K.ready();
})();

</script>
