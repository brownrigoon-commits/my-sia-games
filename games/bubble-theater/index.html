<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>말풍선 극장 · MY SIA</title>
<style id="sia-kit-css">
/* MY SIA game kit — overlay UI. 1rem = 16 design px on a 1024x768 stage (kit.js scales the root font size). */
:root {
  --sk-ink: #22305C;
  --sk-ink-2: #44507E;
  --sk-paper: #FFFFFF;
  --sk-cream: #FFF7E8;
  --sk-blue: #4A86FF;  --sk-blue-2: #2F64E8;
  --sk-green: #63D85A; --sk-green-2: #2EA94A;
  --sk-yellow: #FFD23F; --sk-yellow-2: #F5A91A;
  --sk-pink: #FF74AE;  --sk-pink-2: #E4488A;
  --sk-orange: #FF9442; --sk-orange-2: #E86D1E;
  --sk-purple: #9673FF; --sk-purple-2: #6C4BE6;
  --sk-sky: #6FD0FF;   --sk-sky-2: #2EA3EC;
  --sk-red: #FF5C57;
  --sk-gold: #FFC83A;
  --sk-line: 0.22rem;
  --sk-font: "Apple SD Gothic Neo", "AppleSDGothicNeo-Heavy", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE9FF; overscroll-behavior: none; }
body { font-family: var(--sk-font); color: var(--sk-ink); -webkit-text-size-adjust: 100%; position: fixed; inset: 0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#sk-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* boot screen (pure CSS, visible until kit.js adds .sk-ready) */
body:not(.sk-ready)::before { content: ""; position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle at 50% 46%, #4A86FF 0 3.4rem, transparent 3.5rem), linear-gradient(180deg, #8FD8FF, #DDF6FF); animation: sk-boot 0.9s ease-in-out infinite alternate; }
body:not(.sk-ready)::after { content: "MY SIA"; position: fixed; left: 0; right: 0; top: 62%; text-align: center; z-index: 100; font: 900 2rem var(--sk-font); color: #fff; letter-spacing: .1em; text-shadow: 0 .18rem 0 var(--sk-ink); }
@keyframes sk-boot { from { background-position: 0 0, 0 0; } to { background-position: 0 -1.2rem, 0 0; } }
.sk-error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 200; background: linear-gradient(180deg, #8FD8FF, #DDF6FF); font: 800 1.6rem/1.5 var(--sk-font); color: var(--sk-ink); padding: 2rem; }

/* ---------- layers ---------- */
#sk-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: var(--sk-font);
  /* Korean line breaking: break between words, never inside one (자업자 / 득); a word too long for its box still wraps */
  word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
#sk-ui > div { position: absolute; inset: 0; pointer-events: none; }
#sk-ui .sk-hit, #sk-ui button { pointer-events: auto; }
.sk-hide { display: none !important; }

/* ---------- outlined chunky text ---------- */
.sk-ol { position: relative; display: inline-block; z-index: 0; color: #fff; }
.sk-ol::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; -webkit-text-stroke: var(--sk-ol-w, .55rem) var(--sk-ol-c, var(--sk-ink)); color: var(--sk-ol-c, var(--sk-ink)); text-shadow: 0 var(--sk-ol-drop, .3rem) 0 var(--sk-ol-c, var(--sk-ink)); }

/* ---------- buttons ---------- */
.sk-btn { --c1: var(--sk-green); --c2: var(--sk-green-2); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  font: 800 1.55rem/1 var(--sk-font); color: #fff; padding: .78rem 1.7rem .86rem; min-height: 3.6rem; border-radius: 999px; cursor: pointer;
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: inset 0 -.32rem 0 rgba(0,0,0,.13), 0 .34rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.22);
  text-shadow: 0 .12rem 0 rgba(0,0,0,.22); transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; outline: none; }
.sk-btn::before { content: ""; position: absolute; left: 10%; right: 10%; top: .22rem; height: 40%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.08)); pointer-events: none; }
.sk-btn > * { position: relative; }
.sk-btn svg { width: 1.5em; height: 1.5em; flex: none; }
.sk-btn:active, .sk-btn.sk-press { transform: translateY(.26rem); box-shadow: inset 0 -.2rem 0 rgba(0,0,0,.13), 0 .08rem 0 var(--sk-ink), 0 .3rem .6rem rgba(20,40,90,.2); }
.sk-btn[disabled], .sk-btn.sk-off { --c1: #D6DCE6; --c2: #AEB7C6; opacity: .8; }
.sk-btn.sk-blue { --c1: var(--sk-blue); --c2: var(--sk-blue-2); }
.sk-btn.sk-yellow { --c1: var(--sk-yellow); --c2: var(--sk-yellow-2); color: var(--sk-ink); text-shadow: 0 .1rem 0 rgba(255,255,255,.5); }
.sk-btn.sk-pink { --c1: var(--sk-pink); --c2: var(--sk-pink-2); }
.sk-btn.sk-orange { --c1: var(--sk-orange); --c2: var(--sk-orange-2); }
.sk-btn.sk-purple { --c1: var(--sk-purple); --c2: var(--sk-purple-2); }
.sk-btn.sk-sky { --c1: var(--sk-sky); --c2: var(--sk-sky-2); }
.sk-btn.sk-white { --c1: #FFFFFF; --c2: #E6EEFA; color: var(--sk-ink); text-shadow: none; }
.sk-btn.sk-big { font-size: 2.1rem; padding: 1rem 2.6rem 1.1rem; min-height: 4.6rem; }

.sk-icon { position: relative; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sk-ink);
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, #FFFFFF, #E4ECFA); box-shadow: inset 0 -.25rem 0 rgba(30,60,120,.12), 0 .26rem 0 var(--sk-ink), 0 .5rem .8rem rgba(20,40,90,.2);
  font: 900 1.15rem/1 var(--sk-font); transition: transform .08s, box-shadow .08s; touch-action: manipulation; padding: 0; outline: none; }
.sk-icon::before { content: ""; position: absolute; left: 18%; right: 18%; top: .16rem; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); pointer-events: none; }
.sk-icon svg { width: 58%; height: 58%; position: relative; }
.sk-icon:active, .sk-icon.sk-press { transform: translateY(.2rem); box-shadow: inset 0 -.15rem 0 rgba(30,60,120,.12), 0 .06rem 0 var(--sk-ink); }
.sk-icon.sk-on { background: linear-gradient(180deg, #FFE36B, #FFC22E); }

/* ---------- HUD ---------- */
.sk-top { position: absolute; top: 1.1rem; left: 1.2rem; right: 1.2rem; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.sk-top .sk-group { display: flex; gap: .7rem; align-items: center; pointer-events: none; }
.sk-top .sk-icon, .sk-top .sk-chip, .sk-top .sk-starbar { pointer-events: auto; }
.sk-chip { position: absolute; left: 50%; top: 1.1rem; transform: translateX(-50%); display: flex; align-items: center; gap: .7rem; padding: .35rem 1.3rem .35rem .45rem; min-height: 3.5rem;
  background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.2); font: 900 1.6rem/1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }
.sk-chip .sk-chip-ico { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: radial-gradient(circle at 35% 30%, #fff, #DFF3FF 70%); border: .16rem solid var(--sk-ink); }
.sk-chip .sk-chip-bar { width: 7.5rem; height: 1.05rem; border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); overflow: hidden; }
.sk-chip .sk-chip-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(180deg, #8CF06B, #34B84A); box-shadow: inset 0 .2rem 0 rgba(255,255,255,.5); transition: width .45s cubic-bezier(.3,1.6,.5,1); }
.sk-chip .sk-chip-label { font-size: 1.05rem; color: var(--sk-ink-2); font-weight: 800; }
.sk-bump { animation: sk-bump .42s cubic-bezier(.3,1.7,.5,1); }
@keyframes sk-bump { 0% { scale: 1; } 35% { scale: 1.22; } 100% { scale: 1; } }

.sk-starbar { display: flex; gap: .1rem; align-items: center; padding: .3rem .7rem; height: 3.5rem; background: rgba(255,255,255,.92); border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink); }
.sk-starbar svg { width: 2.35rem; height: 2.35rem; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
.sk-starbar svg.sk-lit { transform: scale(1.12) rotate(-6deg); }

/* ---------- star svg ---------- */
.sk-star-e path.f { fill: #D9E0EE; } .sk-star-e path.h { opacity: 0; }
.sk-star path.f { fill: url(#skGold); } .sk-star path { stroke: var(--sk-ink); stroke-width: 7; stroke-linejoin: round; }
.sk-star path.h, .sk-star-e path.h { stroke: none; fill: #fff; opacity: .55; }

/* ---------- speech bubble ---------- */
.sk-bubble { position: absolute; max-width: 23rem; min-width: 8rem; padding: .95rem 1.25rem 1rem; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 1.5rem;
  box-shadow: 0 .3rem 0 var(--sk-ink), 0 .8rem 1.4rem rgba(20,40,90,.2); font: 800 1.4rem/1.38 var(--sk-font); color: var(--sk-ink); transform: translate(-50%, -100%); transform-origin: 50% 100%;
  pointer-events: auto; cursor: pointer; word-break: keep-all; overflow-wrap: break-word; animation: sk-bubble-in .32s cubic-bezier(.3,1.6,.5,1); }
.sk-bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -.95rem; width: 1.3rem; height: 1.3rem; background: #fff; border-right: var(--sk-line) solid var(--sk-ink); border-bottom: var(--sk-line) solid var(--sk-ink); transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: .3rem; box-shadow: .3rem .3rem 0 -0.05rem rgba(34,48,92,1); }
.sk-bubble .sk-who { display: inline-flex; align-items: center; gap: .3rem; font-size: .95rem; color: #fff; background: var(--sk-blue); border: .14rem solid var(--sk-ink); border-radius: 999px; padding: .12rem .6rem .14rem; margin: 0 0 .4rem -.2rem; }
.sk-bubble .sk-who svg { width: 1rem; height: 1rem; }
.sk-bubble.sk-out { animation: sk-bubble-out .2s ease-in forwards; }
@keyframes sk-bubble-in { from { transform: translate(-50%, -100%) scale(.4); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
@keyframes sk-bubble-out { to { transform: translate(-50%, -100%) scale(.6); opacity: 0; } }

/* ---------- 3D-anchored tag ---------- */
.sk-tag { position: absolute; transform: translate(-50%, -50%); padding: .3rem .85rem .36rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: .9rem; box-shadow: 0 .2rem 0 var(--sk-ink); font: 800 1.15rem/1.1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }

/* ---------- pop text ---------- */
.sk-pop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 900 var(--size, 3rem)/1 var(--sk-font); pointer-events: none; animation: sk-pop var(--dur, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.sk-pop .sk-ol { color: var(--fill, #FF5C57); --sk-ol-c: #fff; --sk-ol-w: .7rem; --sk-ol-drop: 0rem; }
.sk-pop .sk-ol::after { content: attr(data-t); position: absolute; left: 0; top: .3rem; z-index: -2; -webkit-text-stroke: .7rem var(--sk-ink); color: var(--sk-ink); opacity: .9; }
@keyframes sk-pop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; } 26% { transform: translate(-50%, -50%) scale(.95) rotate(-1deg); } 34% { transform: translate(-50%, -50%) scale(1) rotate(0); } 78% { transform: translate(-50%, calc(-50% - var(--rise, 3rem))) scale(1); opacity: 1; } 100% { transform: translate(-50%, calc(-50% - var(--rise, 3rem) * 1.3)) scale(.9); opacity: 0; } }

.sk-fly { position: absolute; transform: translate(-50%, -50%); font-size: 2.6rem; line-height: 1; text-shadow: 0 .2rem 0 rgba(34,48,92,.35); pointer-events: none; }

/* ---------- toast ---------- */
.sk-toast { position: absolute; left: 50%; top: 5.6rem; transform: translateX(-50%); padding: .7rem 1.4rem .75rem; background: var(--sk-ink); color: #fff; border-radius: 999px; font: 800 1.3rem/1.2 var(--sk-font); box-shadow: 0 .5rem 1rem rgba(20,40,90,.3); animation: sk-toast 2.2s ease forwards; white-space: nowrap; display: flex; gap: .5rem; align-items: center; }
@keyframes sk-toast { 0% { transform: translate(-50%, -1.5rem); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -.6rem); opacity: 0; } }

/* ---------- panels ---------- */
.sk-card { position: absolute; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 2rem; box-shadow: 0 .42rem 0 var(--sk-ink), 0 1.2rem 2.4rem rgba(20,40,90,.28); pointer-events: auto; }
.sk-dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(20,40,90,.18), rgba(20,40,90,.48)); pointer-events: auto; animation: sk-fade .3s ease; }
@keyframes sk-fade { from { opacity: 0; } }
.sk-in { animation: sk-card-in .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-card-in { from { transform: translateY(2.5rem) scale(.8); opacity: 0; } }
.sk-in-r { animation: sk-card-in-r .55s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes sk-card-in-r { from { transform: translateX(6rem) scale(.9); opacity: 0; } }
.sk-out { animation: sk-card-out .25s ease-in forwards; pointer-events: none !important; }
@keyframes sk-card-out { to { transform: translateY(1.5rem) scale(.9); opacity: 0; } }

/* ---------- title screen ---------- */
.sk-title-head { position: absolute; left: 2.4rem; top: 5.6rem; max-width: 34rem; pointer-events: none; animation: sk-card-in .7s cubic-bezier(.3,1.5,.5,1) both; }
.sk-brand { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .9rem .32rem .35rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1rem/1 var(--sk-font); letter-spacing: .06em; color: var(--sk-ink); }
.sk-brand i { width: 1.45rem; height: 1.45rem; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; background: radial-gradient(circle at 35% 30%, #8DB4FF, #3E7BFF 60%); border: .14rem solid var(--sk-ink); display: inline-block; }
.sk-title-text { margin-top: .7rem; font: 900 4.4rem/1.04 var(--sk-font); letter-spacing: -.01em; --sk-ol-w: .75rem; --sk-ol-drop: .42rem; }
.sk-title-text .sk-ol { color: #fff; }
.sk-title-text .sk-ol.sk-c2 { color: #FFE14D; }
.sk-title-sub { margin-top: .9rem; display: inline-block; padding: .5rem 1.1rem .55rem; border-radius: 1rem; background: rgba(255,255,255,.9); border: .18rem solid var(--sk-ink); box-shadow: 0 .22rem 0 var(--sk-ink); font: 800 1.35rem/1.3 var(--sk-font); }
.sk-titlescreen, .sk-resultscreen { position: absolute; inset: 0; pointer-events: none; }
.sk-title-right { position: absolute; right: 2.2rem; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; }
.sk-title-card { position: relative; width: 25.5rem; padding: 1.5rem 1.6rem 1.6rem; display: flex; flex-direction: column; gap: 1rem; }
.sk-title-card .sk-hello { font: 900 1.65rem/1.2 var(--sk-font); }
.sk-title-card .sk-hello b { color: var(--sk-blue-2); }
.sk-lbl { font: 800 1rem/1 var(--sk-font); color: var(--sk-ink-2); margin-bottom: .5rem; display: flex; justify-content: space-between; align-items: baseline; }
.sk-lbl em { font-style: normal; color: var(--sk-blue-2); font-weight: 900; }
.sk-bands { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.sk-band { position: relative; padding: .6rem .4rem .62rem; border-radius: 1.1rem; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #fff, #EEF3FC); box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; touch-action: manipulation; transition: transform .08s; }
.sk-band small { display: block; margin-top: .25rem; font: 800 .78rem/1 var(--sk-font); color: var(--sk-ink-2); }
.sk-band.sk-sel { background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; }
.sk-band.sk-sel small { color: #E3EDFF; }
.sk-band:active { transform: translateY(.15rem); box-shadow: 0 .05rem 0 var(--sk-ink); }
.sk-bandchip { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: 999px; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; font: 900 1.2rem/1 var(--sk-font); box-shadow: 0 .2rem 0 var(--sk-ink); align-self: flex-start; }
.sk-bandchip small { font: 800 .85rem/1 var(--sk-font); opacity: .9; }
.sk-dial { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0; height: 3.6rem; }
.sk-dial::before { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); }
.sk-dial .sk-fill { position: absolute; left: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(180deg, #FFE36B, #FFB21E); border: .16rem solid var(--sk-ink); transition: width .35s cubic-bezier(.3,1.4,.5,1); }
.sk-dial button { position: relative; width: 2.8rem; height: 2.8rem; border-radius: 50%; border: .18rem solid var(--sk-ink); background: #fff; font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; box-shadow: 0 .18rem 0 var(--sk-ink); transition: transform .25s cubic-bezier(.3,1.8,.5,1), background .2s; padding: 0; touch-action: manipulation; }
.sk-dial button.sk-past { background: linear-gradient(180deg, #FFE36B, #FFB21E); }
.sk-dial button.sk-sel { transform: scale(1.32); background: linear-gradient(180deg, #FFE36B, #FFAE14); z-index: 1; }
.sk-dial button.sk-sel::after { content: ""; position: absolute; inset: -.5rem; border-radius: 50%; border: .16rem dashed rgba(34,48,92,.45); animation: sk-spin 6s linear infinite; }
@keyframes sk-spin { to { transform: rotate(360deg); } }
.sk-hint { word-break: keep-all; display: flex; gap: .65rem; align-items: center; padding: .7rem .85rem; border-radius: 1.1rem; background: #FFF6D9; border: .16rem solid #F0D48A; font: 800 1.05rem/1.35 var(--sk-font); color: #6B4A12; min-height: 3.6rem; }
.sk-hint svg { width: 1.9rem; height: 1.9rem; flex: none; }
.sk-title-card .sk-btn { width: 100%; }
.sk-need { font: 800 .95rem/1.2 var(--sk-font); color: var(--sk-pink-2); text-align: center; margin-top: -.4rem; }

/* ---------- results ---------- */
.sk-resultscreen { display: flex; align-items: center; justify-content: center; }
.sk-resultscreen.sk-res-right { justify-content: flex-end; padding-right: 6%; }
.sk-resultscreen.sk-res-right .sk-dim { background: linear-gradient(90deg, rgba(20,40,90,0) 0%, rgba(20,40,90,.12) 35%, rgba(20,40,90,.45) 100%); }
.sk-res { position: relative; width: 32rem; padding: 3.1rem 1.8rem 1.6rem; text-align: center; }
.sk-res.sk-in { animation: sk-res-in .55s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-res-in { from { transform: translateY(3rem) scale(.75); opacity: 0; } }
.sk-ribbon { position: absolute; z-index: 3; left: 50%; top: -1.9rem; transform: translateX(-50%); padding: .7rem 2.6rem .8rem; background: linear-gradient(180deg, #FF8EC0, #F0558F); border: var(--sk-line) solid var(--sk-ink); border-radius: 1.2rem; box-shadow: 0 .3rem 0 var(--sk-ink); white-space: nowrap; font: 900 2.1rem/1 var(--sk-font); }
.sk-ribbon .sk-ol { color: #fff; --sk-ol-w: .45rem; --sk-ol-drop: .2rem; }
.sk-res-stars { display: flex; justify-content: center; align-items: flex-end; gap: .2rem; height: 7.2rem; margin: .2rem 0 .3rem; }
.sk-res-stars svg { width: 5.6rem; height: 5.6rem; opacity: 0; }
.sk-res-stars svg:nth-child(2) { width: 7rem; height: 7rem; margin-bottom: .9rem; }
.sk-res-stars svg.sk-show { animation: sk-star-in .55s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes sk-star-in { 0% { opacity: 0; transform: scale(2.4) rotate(-40deg); } 60% { opacity: 1; transform: scale(.88) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.sk-res-sub { font: 800 1.2rem/1.35 var(--sk-font); color: var(--sk-ink-2); min-height: 1.6rem; word-break: keep-all; overflow-wrap: break-word; white-space: pre-line; text-wrap: pretty; }
/* the big moment: a cheering 2D Haru leans out of the card's top-left corner (beside the stars) */

<script data-inline="theater.js">
/* 말풍선 극장 / Speech Bubble Theater — the theater itself: house, stage, proscenium, curtains, spotlights,

      { id: 'e104', lv: 1, set: 'bus', type: 'feelwhy', cast: [{ r: 'mom', feel: 'worried' }, { r: 'kid', feel: 'worried' }], intro: '버스야. 민이가 주머니를 다 뒤졌는데 버스 카드가 없어!', cue: { w: 0, t: '민아, 왜 그래?' }, tag: '😟 걱정돼', q: '민이는 마음과 이유를 어떻게 말할까?', opts: [o('버스 카드를 잃어버려서 걱정돼요.'), o('버스 카드를 찾아서 걱정돼요.', '카드를 찾았으면 걱정할 일이 없지. 이유가 안 맞아.'), o('버스 카드를 잃어버려서 신나요.', '카드를 잃어버렸는데 신난다니? 마음 낱말이 안 맞아.'), o('버스 카드를 잃어버려서 고마워요.', '고마울 일이 아니야. 마음 낱말이 상황과 달라.')], react: 'nod', after: 'neutral', note: '걱정될 땐 숨기지 말고 "~해서 걱정돼요"라고 말해. 그래야 어른이 도와주실 수 있어.' },
      { id: 'e105', lv: 1, set: 'shop', type: 'feelwhy', cast: [{ r: 'shop', feel: 'sorry' }, { r: 'kid', feel: 'sad' }], intro: '빵 가게야. 민이가 좋아하는 빵이 다 팔렸어.', cue: { w: 0, t: '그 빵은 다 팔렸네. 미안하구나.' }, tag: '😞 아쉬워', q: '민이는 마음과 이유를 어떻게 말할까?', opts: [o('먹고 싶던 빵이 다 팔려서 아쉬워요.'), o('먹고 싶던 빵이 많이 남아서 아쉬워요.', '빵이 많이 남았으면 아쉬울 게 없지. 이유가 안 맞아.'), o('먹고 싶던 빵이 다 팔려서 신나요.', '빵이 없는데 신난다니? 마음 낱말이 안 맞아.'), o('먹고 싶던 빵이 다 팔려서 미안해요.', '민이가 잘못한 게 아니야. 미안해가 아니라 아쉬운 마음이야.')], react: 'nod', after: 'neutral', note: '바라던 일이 안 됐을 땐 "~해서 아쉬워요"라고 말하면 돼.' },
      // lv2: polite vs plain by listener, with honorific slips
      { id: 'e106', lv: 2, set: 'classroom', type: 'register', cast: [{ r: 'teacher', feel: 'neutral' }, { r: 'kid', feel: 'neutral', prop: 'crayon' }], intro: '교실이야. 민이 필통에는 지우개가 두 개 있어.', cue: { w: 0, t: '민아, 지우개 있니?' }, q: '선생님께 민이는 어떻게 말할까?', opts: [o('네, 선생님. 여기 있어요.'), o('응, 선생님. 여기 있어.', '선생님께 "응", "있어"는 반말이야. "네, 있어요"로 높여야 해.'), o('네, 선생님. 여기 없어요.', '민이 필통엔 지우개가 있어. 말투는 맞지만 사실과 달라.'), o('네, 선생님. 여기 있다.', '"있다"는 혼잣말이나 친구에게 쓰는 끝말이야. 선생님께는 "있어요"!')], react: 'nod', note: '선생님께는 "네"로 시작해서 "~요"로 끝내면 돼.' },
      { id: 'e107', lv: 2, set: 'park', type: 'register', cast: [{ r: 'jun', feel: 'happy', prop: 'ball' }, { r: 'kid', feel: 'happy' }], intro: '공원이야. 친구 준이 공을 들고 왔어.', cue: { w: 0, t: '민아, 같이 축구 할래?' }, q: '친구 준에게 민이는 어떻게 말할까?', opts: [o('응, 좋아! 우리 같이 하자.'), o('네, 좋아요! 같이 해요.', '친구끼리 "네, ~요"는 너무 어색해. 친구에게는 편하게 반말로!'), o('응, 좋아! 같이 하십시오.', '"하십시오"는 아주 높은 어른께 쓰는 말이야. 친구에게는 "하자"!'), o('아니, 싫어! 같이 하자.', '"싫어"라고 해 놓고 "같이 하자"고 하면 앞뒤가 안 맞아.')], react: 'cheer', note: '친구에게는 반말, 어른께는 존댓말. 듣는 사람에 따라 끝말이 바뀌어.' },
      { id: 'e108', lv: 2, set: 'home', type: 'register', cast: [{ r: 'grandma', feel: 'happy' }, { r: 'kid', feel: 'happy' }], intro: '할머니 댁이야. 민이가 점심을 다 먹었어.', cue: { w: 0, t: '민아, 밥은 먹었니?' }, q: '할머니께 민이는 어떻게 말할까?', opts: [o('네, 할머니. 맛있게 먹었어요.'), o('응, 할머니. 맛있게 먹었어.', '할머니께는 "응", "먹었어" 대신 "네", "먹었어요"로 높여야 해.'), o('네, 할머니. 맛있게 먹었다.', '"먹었다"는 일기에 쓰는 말투야. 할머니께는 "먹었어요"!'), o('네, 할머니. 맛있게 드셨어요.', '"드셨어요"는 어른이 드셨을 때 쓰는 말이야. 내가 먹은 건 "먹었어요"라고 해.')], react: 'laugh', note: '나를 높이면 안 돼. 내가 한 일은 "먹었어요", 할머니가 하신 일은 "드셨어요"야.' },
      { id: 'e109', lv: 2, set: 'street', type: 'register', cast: [{ r: 'neighbor', feel: 'happy' }, { r: 'kid', feel: 'happy', prop: 'bag' }], intro: '아침 길이야. 집 앞에 서 계신 이웃 아주머니가 물어보셨어.', cue: { w: 0, t: '민아, 어디 가니?' }, q: '아주머니께 민이는 어떻게 말할까?', opts: [o('학교에 가요. 안녕히 계세요!'), o('학교에 가. 안녕히 계세요!', '"가"는 반말이야. 앞부분도 "가요"로 높여야 해.'), o('학교에 가요. 안녕히 가세요!', '"안녕히 가세요"는 떠나는 사람에게 하는 인사야. 떠나는 건 민이니까 "계세요"!'), o('학교에 가요. 잘 있어!', '"잘 있어"는 친구에게 하는 인사야. 어른께는 "안녕히 계세요"!')], react: 'wave', note: '떠나는 사람은 "안녕히 계세요", 남는 사람은 "안녕히 가세요"라고 인사해.' },
      { id: 'e110', lv: 2, set: 'bus', type: 'register', cast: [{ r: 'driver', feel: 'neutral' }, { r: 'kid', feel: 'neutral', prop: 'bag' }], intro: '버스야. 민이는 시장 앞에서 내려야 해.', cue: { w: 0, t: '어디서 내리니?' }, q: '기사님께 민이는 어떻게 말할까?', opts: [o('시장 앞에서 내려요.'), o('시장 앞에서 내려.', '기사님은 어른이야. "내려" 대신 "내려요"로 높여야 해.'), o('시장 앞에서 내리세요.', '"내리세요"는 기사님께 내리라는 말이 돼. 내리는 건 민이야.'), o('시장 앞에서 내렸어요.', '"내렸어요"는 벌써 내렸다는 뜻이야. 이제 내릴 곳을 말해야 해.')], react: 'nod', note: '내가 할 일은 "내려요", 어른께 부탁할 일은 "~해 주세요"라고 해.' },
      // lv3: asking nicely
      { id: 'e111', lv: 3, set: 'classroom', type: 'ask', cast: [{ r: 'friend', feel: 'neutral', prop: 'crayon' }, { r: 'kid', feel: 'worried' }], intro: '교실이야. 민이가 연필을 집에 두고 왔어.', cue: null, q: '민이는 보라에게 어떻게 부탁할까?', opts: [o('보라야, 연필 하나만 빌려줄래?'), o('보라야, 연필 하나만 빌려줘라.', '"빌려줘라"는 시키는 말이야. 부탁할 땐 "빌려줄래?" 하고 물어봐.'), o('보라야, 연필 하나만 빌려주십시오.', '친구에게 "주십시오"는 너무 딱딱해. 편하게 "빌려줄래?"'), o('보라야, 연필 하나만 빌려줄게.', '"빌려줄게"는 민이가 빌려준다는 뜻이야. 빌리는 사람은 민이야.')], react: 'nod', note: '친구에게 부탁할 땐 "~해 줄래?"라고 물어봐.' },
      { id: 'e112', lv: 3, set: 'home', type: 'ask', cast: [{ r: 'mom', feel: 'neutral' }, { r: 'kid', feel: 'happy', prop: 'book' }], intro: '집이야. 민이는 숙제를 끝내고 공원에 가고 싶어.', cue: null, q: '민이는 엄마께 어떻게 부탁할까?', opts: [o('엄마, 숙제 끝내고 공원에 가도 돼요?'), o('엄마, 숙제 끝내고 공원에 갈 거예요.', '물어보지 않고 정해서 말했어. 허락을 구할 땐 "~해도 돼요?"'), o('엄마, 숙제 안 하고 공원에 가도 돼요?', '숙제를 안 하겠다고 하면 허락받기 어려워. 민이는 숙제를 먼저 할 거야.'), o('엄마, 숙제 끝내고 공원에 가세요.', '"가세요"는 엄마에게 가라는 말이 돼. 가고 싶은 건 민이야.')], react: 'nod', note: '허락을 구할 땐 "~해도 돼요?"라고 물어보면 돼.' },
      { id: 'e113', lv: 3, set: 'shop', type: 'ask', cast: [{ r: 'shop', feel: 'happy' }, { r: 'kid', feel: 'neutral' }], intro: '과일 가게야. 민이는 사과 값이 궁금해.', cue: null, q: '민이는 아저씨께 어떻게 물어볼까?', opts: [o('아저씨, 이 사과는 얼마예요?'), o('아저씨, 이 사과는 얼마야?', '가게 아저씨는 어른이야. "얼마야" 대신 "얼마예요?"'), o('아저씨, 이 사과 다섯 개 주세요.', '값을 묻지 않고 바로 사는 말이야. 민이는 값이 궁금해.'), o('아저씨, 이 사과는 맛있어요?', '맛을 묻는 말이야. 민이가 궁금한 건 값이야.')], react: 'nod', note: '가게에서는 "~얼마예요?", "~주세요"처럼 공손하게 말해.' },
      { id: 'e114', lv: 3, set: 'park', type: 'ask', cast: [{ r: 'jun', feel: 'happy' }, { r: 'kid', feel: 'neutral' }], intro: '공원이야. 준이 그네를 타고 있어. 민이도 타고 싶어.', cue: null, q: '민이는 준에게 어떻게 부탁할까?', opts: [o('준아, 다 타면 나도 한 번 타도 돼?'), o('준아, 다 타면 나도 한 번 타야 해.', '"타야 해"는 정해 버리는 말이야. 부탁할 땐 "타도 돼?" 하고 물어봐.'), o('준아, 지금 바로 나도 한 번 타도 돼?', '준이 아직 타고 있어. "지금 바로"는 차례를 안 기다리는 말이야.'), o('준아, 다 타면 나도 한 번 타도 돼요?', '친구에게 "돼요?"는 어색해. 친구에게는 "돼?"면 충분해.')], react: 'nod', note: '차례를 기다리며 "다 타면 나도 타도 돼?"라고 물어봐.' },
      { id: 'e115', lv: 3, set: 'bus', type: 'ask', cast: [{ r: 'man', feel: 'neutral' }, { r: 'kid', feel: 'neutral', prop: 'bag' }], intro: '버스야. 내려야 하는데 아저씨가 통로에 서 계셔.', cue: null, q: '민이는 아저씨께 어떻게 말할까?', opts: [o('죄송하지만, 좀 지나가도 될까요?'), o('죄송하지만, 좀 지나가겠습니다.', '지나가겠다고 알리기만 했어. "~해도 될까요?"로 물어봐야 부탁이야.'), o('죄송하지만, 좀 지나가도 될까?', '처음 보는 어른께 "될까?"는 반말이야. "될까요?"로 높여야 해.'), o('고맙지만, 좀 지나가도 될까요?', '아직 도와주신 게 없어서 "고맙지만"은 어색해. 부탁은 "죄송하지만"으로 시작해.')], react: 'nod', note: '모르는 어른께 부탁할 땐 "죄송하지만, ~해도 될까요?"라고 말해.' },
      // lv4: a real apology
      { id: 'e116', lv: 4, set: 'classroom', type: 'sorry', cast: [{ r: 'friend', feel: 'sad', prop: 'book' }, { r: 'kid', feel: 'sorry', prop: 'cup' }], intro: '교실이야. 민이가 물을 쏟아서 보라의 공책이 젖었어.', cue: { w: 0, t: '앗, 내 공책…' }, q: '민이는 어떻게 사과할까?', opts: [o('미안해, 내가 물을 쏟았어. 같이 닦자.'), o('미안해, 네가 물을 쏟았어. 같이 닦자.', '물을 쏟은 건 민이야. 남이 했다고 하면 사과가 아니야.'), o('미안해, 내가 물을 쏟았어. 네가 닦아.', '쏟은 사람이 치우는 걸 도와야지. 보라에게 맡기면 사과가 반쪽이야.'), o('미안해, 내가 물을 쏟았어. 어쩔 수 없지.', '"어쩔 수 없지"는 고칠 생각이 없다는 말이야. 어떻게 할지도 말해야 해.')], react: 'nod', after: 'happy', note: '제대로 된 사과는 "미안해 + 내가 한 일 + 어떻게 할게"야.' },
      { id: 'e117', lv: 4, set: 'home', type: 'sorry', beat: 'shatter', cast: [{ r: 'mom', feel: 'surprised' }, { r: 'kid', feel: 'sorry', prop: 'cup' }], intro: '집이야. 민이가 엄마가 아끼는 컵을 깨뜨렸어.', cue: { w: 0, t: '어머, 무슨 소리야?' }, q: '민이는 엄마께 어떻게 사과할까?', opts: [o('죄송해요, 제가 컵을 깨뜨렸어요. 같이 치워요.'), o('죄송해요, 컵이 혼자 깨졌어요. 같이 치워요.', '컵은 혼자 깨지지 않았어. 솔직하게 말해야 사과가 돼.'), o('죄송해요, 제가 컵을 깨뜨렸어요. 엄마가 치워요.', '깨뜨린 건 민이야. 엄마께 치우라고 하면 사과가 반쪽이야.'), o('죄송해요, 동생이 컵을 깨뜨렸어요. 같이 치워요.', '깨뜨린 건 민이야. 동생 탓을 하면 사과가 아니야.')], react: 'nod', after: 'neutral', note: '어른께 사과할 땐 "죄송해요 + 제가 한 일 + 어떻게 할게요"로 말해.' },
      { id: 'e118', lv: 4, set: 'park', type: 'sorry', cast: [{ r: 'jun', feel: 'sad' }, { r: 'kid', feel: 'sorry' }], intro: '공원이야. 민이가 뛰다가 준의 발을 밟았어.', cue: { w: 0, t: '아야!' }, q: '민이는 뭐라고 말할까?', opts: [o('준아, 미안해! 내가 발을 밟았어. 괜찮아?'), o('준아, 미안해! 네가 발을 내밀었잖아.', '밟은 사람은 민이야. 준 탓을 하면 사과가 아니야.'), o('준아, 죄송합니다! 제가 발을 밟았습니다.', '친구에게 "죄송합니다"는 너무 딱딱해. "미안해"로 충분해.'), o('준아, 미안해! 내가 발을 밟았어. 그럼 안녕.', '사과만 하고 가 버리면 준이 괜찮은지 모르잖아. "괜찮아?" 하고 살펴야 해.')], react: 'nod', after: 'happy', note: '사과하고 "괜찮아?" 하고 물어보면 친구 마음이 풀려.' },
      { id: 'e119', lv: 4, set: 'street', type: 'sorry', cast: [{ r: 'grandma', feel: 'surprised' }, { r: 'kid', feel: 'sorry', prop: 'bag' }], intro: '길이야. 민이가 뛰어가다 모르는 할머니와 부딪쳤어.', cue: { w: 0, t: '어이쿠!' }, q: '민이는 할머니께 어떻게 사과할까?', opts: [o('죄송해요, 할머니. 다치지 않으셨어요?'), o('미안해, 할머니. 다치지 않았어?', '처음 뵙는 어른께는 "미안해"가 아니라 "죄송해요"라고 높여야 해.'), o('죄송해요, 할머니. 조심 좀 하세요.', '부딪친 건 민이야. 할머니께 조심하라고 하면 남 탓이 돼.'), o('죄송해요, 할머니. 저는 하나도 안 다쳤어요.', '내 걱정보다 부딪친 할머니가 괜찮으신지 먼저 여쭤야 해.')], react: 'nod', after: 'neutral', note: '어른과 부딪치면 "죄송해요, 다치지 않으셨어요?" 하고 살펴.' },
      { id: 'e120', lv: 4, set: 'shop', type: 'sorry', beat: 'roll', cast: [{ r: 'shop', feel: 'surprised' }, { r: 'kid', feel: 'sorry' }], intro: '가게야. 민이가 귤 상자를 건드려서 귤이 바닥으로 굴러갔어.', cue: { w: 0, t: '어어, 귤이!' }, q: '민이는 아저씨께 어떻게 사과할까?', opts: [o('죄송해요, 제가 귤을 떨어뜨렸어요. 주워 드릴게요.'), o('죄송해요, 귤이 저절로 굴러갔어요. 주워 드릴게요.', '귤은 민이가 건드려서 떨어졌어. 내가 한 일을 솔직하게 말해야 해.'), o('죄송해요, 제가 귤을 떨어뜨렸어요. 주워 주세요.', '떨어뜨린 건 민이야. 줍는 일을 아저씨께 맡기면 안 돼.'), o('미안해, 내가 귤을 떨어뜨렸어. 주워 줄게.', '가게 아저씨는 어른이야. "미안해" 대신 "죄송해요"로 높여야 해.')], react: 'nod', after: 'neutral', note: '실수했을 땐 바로 사과하고 "주워 드릴게요"처럼 도울 일을 말해.' },
      // lv5: two E1 skills in one line, close distractors
      { id: 'e121', lv: 5, set: 'classroom', type: 'register', cast: [{ r: 'teacher', feel: 'neutral', prop: 'stick' }, { r: 'kid', feel: 'think' }, { r: 'friend', feel: 'worried' }], intro: '교실이야. 가위가 하나뿐인데, 보라가 먼저 쓰고 싶다고 했어.', cue: { w: 0, t: '가위가 하나뿐이네. 어떻게 할까?' }, q: '선생님께 민이는 어떻게 말할까?', opts: [o('선생님, 보라가 먼저 쓰고 제가 다음에 써도 될까요?'), o('선생님, 보라가 먼저 쓰고 내가 다음에 써도 돼?', '선생님께 "내가", "돼?"는 반말이야. "제가", "될까요?"로 높여야 해.'), o('선생님, 보라가 먼저 쓰고 제가 다음에 써도 돼?', '"제가"는 잘 썼는데 끝이 "돼?"로 반말이 됐어. 끝까지 높여야 해.'), o('선생님, 보라가 먼저 쓰시고 제가 다음에 써도 될까요?', '"쓰시고"는 보라를 높인 말이야. 친구 보라는 높이지 않아.')], react: 'nod', after: 'happy', note: '한 문장 안에서도 선생님은 높이고, 친구는 높이지 않아. 그리고 먼저 말한 친구에게 차례를 양보했어!' },
      { id: 'e122', lv: 5, set: 'home', type: 'register', cast: [{ r: 'grandma', feel: 'happy', prop: 'paper' }, { r: 'kid', feel: 'shy' }, { r: 'little', feel: 'happy' }], intro: '할머니 댁이야. 민이와 동생이 같이 그린 그림을 할머니가 보셨어.', cue: { w: 0, t: '우리 민이, 그림 참 잘 그렸구나!' }, q: '민이는 할머니께 뭐라고 말할까?', opts: [o('고맙습니다, 할머니. 동생이랑 같이 그렸어요.'), o('고마워, 할머니. 동생이랑 같이 그렸어.', '칭찬을 받는 마음은 좋지만, 할머니께는 "고맙습니다", "그렸어요"로 높여야 해.'), o('아니에요, 할머니. 동생이랑 같이 그렸어요.', '칭찬을 "아니에요"로 밀어내면 할머니가 머쓱하셔. 먼저 고맙다고 받아.'), o('고맙습니다, 할머니. 동생은 하나도 안 그렸어요.', '동생도 같이 그렸어. 혼자 한 것처럼 말하면 동생이 서운해.')], react: 'cheer', after: 'happy', note: '칭찬은 "고맙습니다"로 받고, 함께한 사람도 챙기면 듣는 사람 모두 기분이 좋아져.' },
      { id: 'e123', lv: 5, set: 'park', type: 'feelwhy', cast: [{ r: 'friend', feel: 'sad' }, { r: 'kid', feel: 'worried' }], intro: '공원이야. 보라가 자전거에서 넘어져 무릎을 다쳤어.', cue: { w: 0, t: '흑… 무릎이…' }, q: '민이는 보라에게 뭐라고 말할까?', opts: [o('많이 아프지? 내가 어른 불러 올게.'), o('많이 아프지? 나는 혼자 집에 갈게.', '다친 친구를 두고 가 버리면 안 돼. 도움을 불러 와야 해.'), o('많이 아프세요? 제가 어른 불러 올게요.', '친구에게 "아프세요?", "올게요"는 어색해. 친구에게는 편하게 말해.'), o('별로 안 아프지? 내가 어른 불러 올게.', '보라는 울고 있어. "별로 안 아프지?"는 보라 마음을 몰라주는 말이야.')], react: 'nod', after: 'happy', note: '친구가 다치면 먼저 마음을 알아주고, 어른을 불러 와. 둘 다 할 줄 알면 최고야.' },
      { id: 'e124', lv: 5, set: 'bus', type: 'ask', cast: [{ r: 'driver', feel: 'neutral' }, { r: 'kid', feel: 'worried', prop: 'bag' }], intro: '버스야. 민이가 창밖을 보다가 내릴 정류장을 지나쳐 버렸어.', cue: null, q: '민이는 기사님께 어떻게 말할까?', opts: [o('기사님, 죄송해요. 다음 정류장에서 내려도 될까요?'), o('기사님, 죄송해. 다음 정류장에서 내려도 될까?', '기사님은 어른이야. "죄송해", "될까?" 대신 "죄송해요", "될까요?"로 높여야 해.'), o('기사님, 죄송해요. 지금 여기서 세워 주세요.', '버스는 정류장에서만 설 수 있어. 다음 정류장까지 기다려야 안전해.'), o('기사님, 고마워요. 다음 정류장에서 내려도 될까요?', '아직 도와주신 게 없어. 부탁하기 전에는 "죄송해요"로 시작해.')], react: 'nod', note: '실수했을 땐 "죄송해요"로 시작하고, 안전한 방법으로 부탁하면 돼.' },
      { id: 'e125', lv: 5, set: 'shop', type: 'ask', cast: [{ r: 'shop', feel: 'neutral' }, { r: 'kid', feel: 'worried', prop: 'ball' }], intro: '가게야. 어제 산 장난감이 하루 만에 고장 났어.', cue: null, q: '민이는 아저씨께 어떻게 말할까?', opts: [o('어제 산 장난감이 고장 났어요. 바꿔 주실 수 있어요?'), o('어제 산 장난감이 고장 났어. 바꿔 줄 수 있어?', '가게 아저씨는 어른이야. "났어", "있어?" 대신 "났어요", "있어요?"로 높여야 해.'), o('어제 산 장난감이 고장 났어요. 바꿔 드릴게요.', '"바꿔 드릴게요"는 민이가 바꿔 준다는 뜻이야. 아저씨께 부탁해야 해.'), o('어제 산 장난감이 너무 좋아요. 바꿔 주실 수 있어요?', '좋은데 바꿔 달라면 이유가 안 맞아. 고장 났다고 말해야 해.')], react: 'nod', note: '무엇이 문제인지 말하고 "~해 주실 수 있어요?"라고 부탁하면 돼.' },

    en: [
      { id: 'e101', lv: 1, set: 'home', type: 'feelwhy', cast: [{ r: 'mom', feel: 'worried' }, { r: 'kid', feel: 'sad', prop: 'paper' }], intro: "At home. Min's little brother tore her drawing.", cue: { w: 0, t: "Min, what's wrong?" }, tag: '😢 upset', q: 'How does Min say the feeling and the reason?', opts: [o("I'm upset because my brother tore my drawing."), o("I'm excited because my brother tore my drawing.", 'A torn drawing is not exciting. The feeling word does not fit.'), o("I'm upset because my brother liked my drawing.", 'Liking a drawing is not a reason to be upset. The reason does not fit.'), o("I'm upset because I tore my brother's drawing.", 'Her brother did it, not Min. Who did it got switched.')], react: 'nod', after: 'neutral', note: 'Say the feeling and the reason: "I\'m upset because…"' },
      { id: 'e102', lv: 1, set: 'park', type: 'feelwhy', cast: [{ r: 'kid', feel: 'sorry' }, { r: 'friend', feel: 'sad' }], sp: 1, intro: 'At the park. Bora waited for Min for thirty minutes.', cue: { w: 0, t: "Sorry I'm so late, Bora!" }, tag: '😔 a little sad', q: 'How does Bora say the feeling and the reason?', opts: [o('I felt a little sad because I waited so long.'), o('I felt really excited because I waited so long.', 'Waiting a long time is not exciting. The feeling word does not fit.'), o('I felt a little sad because you came early.', 'Min came late, not early. The reason is not true.'), o('I felt a little sorry because I waited so long.', 'Min is the one who should be sorry. Bora felt sad.')], react: 'bow', after: 'neutral', note: 'Telling the reason helps your friend understand your feeling.' },
      { id: 'e103', lv: 1, set: 'park', type: 'feelwhy', cast: [{ r: 'teacher', feel: 'happy' }, { r: 'kid', feel: 'excited', prop: 'medal' }], intro: 'It is sports day. Min won the race.', cue: { w: 0, t: 'Min, how do you feel?' }, tag: '😄 happy', q: 'How does Min say the feeling and the reason?', opts: [o("I'm really happy because I won the race!"), o("I'm a bit upset because I won the race.", 'Winning is not upsetting. The feeling word does not fit.'), o("I'm so happy because I lost the race!", 'Min won. The reason is not true.'), o("I'm so sorry because I finished the race.", 'Min did nothing wrong. "Sorry" is the wrong feeling here.')], react: 'clap', note: 'Add the reason to a happy feeling too: "I\'m happy because…"' },
      { id: 'e104', lv: 1, set: 'bus', type: 'feelwhy', cast: [{ r: 'mom', feel: 'worried' }, { r: 'kid', feel: 'worried' }], intro: 'On the bus. Min checked every pocket. The bus card is gone!', cue: { w: 0, t: "Min, what's the matter?" }, tag: '😟 worried', q: 'How does Min say the feeling and the reason?', opts: [o("I'm worried because I lost my bus card."), o("I'm worried because I found my bus card.", 'Finding the card would end the worry. The reason does not fit.'), o("I'm excited because I lost my bus card.", 'Losing a card is not exciting. The feeling word does not fit.'), o("I'm thankful because I lost my bus card.", 'Nothing here to be thankful for. The feeling word does not fit.')], react: 'nod', after: 'neutral', note: 'When you are worried, say it: "I\'m worried because…" Then a grown-up can help.' },
      { id: 'e105', lv: 1, set: 'shop', type: 'feelwhy', cast: [{ r: 'shop', feel: 'sorry' }, { r: 'kid', feel: 'sad' }], intro: "At the bakery. Min's favorite bread is sold out.", cue: { w: 0, t: "That bread is all sold out. I'm sorry!" }, tag: '😞 disappointed', q: 'How does Min say the feeling and the reason?', opts: [o("I'm disappointed because my favorite bread is gone."), o("I'm disappointed because my favorite bread is here.", 'If the bread were here, there would be nothing to be disappointed about.'), o("I'm excited because my favorite bread is gone.", 'Sold-out bread is not exciting. The feeling word does not fit.'), o("I'm proud because my favorite bread is gone.", 'Nothing to be proud of here. The feeling word does not fit.')], react: 'nod', after: 'neutral', note: '"I\'m disappointed because…" says exactly what went wrong.' },
      { id: 'e106', lv: 2, set: 'classroom', type: 'register', cast: [{ r: 'teacher', feel: 'neutral' }, { r: 'kid', feel: 'neutral', prop: 'crayon' }], intro: 'In the classroom. Min has two erasers in her pencil case.', cue: { w: 0, t: 'Min, do you have an eraser?' }, q: 'How does Min answer the teacher?', opts: [o('Yes, Ms. Kim. Here you are.'), o('Yeah, Kim. Here you go.', '"Yeah" and plain "Kim" are too casual for a teacher. Say "Yes, Ms. Kim."'), o("Yes, Ms. Kim. I don't have one.", 'The words are polite, but Min does have an eraser.'), o('Yep, Ms. Kim. Here, take it.', '"Yep" and "take it" sound too casual for a teacher.')], react: 'nod', note: 'With teachers, start with "Yes, Ms. Kim" and answer in a full, polite sentence.' },
      { id: 'e107', lv: 2, set: 'park', type: 'register', cast: [{ r: 'jun', feel: 'happy', prop: 'ball' }, { r: 'kid', feel: 'happy' }], intro: "At the park. Min's friend Jun brings a ball.", cue: { w: 0, t: 'Min, wanna play soccer?' }, q: 'How does Min answer a friend?', opts: [o("Sure, Jun! Let's play together!"), o('Yes, sir. I would be glad to play.', '"Sir" is far too formal for a friend. Keep it relaxed.'), o("No way! Let's play together!", '"No way" and "let\'s play" say opposite things.'), o('Certainly, Jun. Shall we begin?', 'That sounds like a butler. With a friend, just say "Sure!"')], react: 'cheer', note: 'With friends you can talk casually. Formal words are for grown-ups you do not know well.' },
      { id: 'e108', lv: 2, set: 'home', type: 'register', cast: [{ r: 'grandma', feel: 'happy' }, { r: 'kid', feel: 'happy' }], intro: "At Grandma's house. Min has just finished lunch.", cue: { w: 0, t: 'Did you eat your lunch, sweetie?' }, q: 'How does Min answer Grandma?', opts: [o('Yes, Grandma. It was delicious, thank you.'), o('Yup, Grandma. It was fine, I guess. Whatever.', '"Yup" and "whatever" sound grumpy. Answer Grandma kindly.'), o("Yes, Grandma. I'm not hungry, thank you.", 'Grandma asked if Min ate. The answer does not match the question.'), o("Yes, ma'am. It was delicious, thank you.", 'Grandma is family. "Ma\'am" sounds cold here; call her "Grandma".')], react: 'laugh', note: 'Answer family grown-ups warmly and politely: "Yes, Grandma… thank you."' },
      { id: 'e109', lv: 2, set: 'street', type: 'register', cast: [{ r: 'neighbor', feel: 'happy' }, { r: 'kid', feel: 'happy', prop: 'bag' }], intro: 'On the street in the morning. Mrs. Park is standing at her gate.', cue: { w: 0, t: 'Where are you off to, Min?' }, q: 'How does Min answer Mrs. Park?', opts: [o("I'm going to school, Mrs. Park. Have a nice day!"), o("I'm going to school, Park. Have a nice day!", 'Plain "Park" sounds rude to a grown-up. Say "Mrs. Park".'), o("I'm going to the park, Mrs. Park. Have a nice day!", 'Min has her school bag. She is going to school.'), o("I'm going to school, Mrs. Park. Good night!", '"Good night" is for bedtime. It is morning.')], react: 'wave', note: 'Use a grown-up\'s title, like "Mrs. Park", and a greeting that fits the time of day.' },
      { id: 'e110', lv: 2, set: 'bus', type: 'register', cast: [{ r: 'driver', feel: 'neutral' }, { r: 'kid', feel: 'neutral', prop: 'bag' }], intro: 'On the bus. Min needs to get off at the market.', cue: { w: 0, t: 'Where are you getting off?' }, q: 'How does Min answer the driver?', opts: [o('At the market stop, please.'), o('At the market stop, okay?', '"Okay?" sounds like Min is telling him. Say "please".'), o('At the last stop, please.', 'Min needs the market stop, not the last stop.'), o('Stop at the market, driver.', 'That sounds like an order. Answer politely with "please".')], react: 'nod', note: 'With a grown-up you do not know, answer briefly and add "please".' },
      { id: 'e111', lv: 3, set: 'classroom', type: 'ask', cast: [{ r: 'friend', feel: 'neutral', prop: 'crayon' }, { r: 'kid', feel: 'worried' }], intro: 'In the classroom. Min left her pencil at home.', cue: null, q: 'How does Min ask Bora?', opts: [o('Bora, may I borrow a pencil, please?'), o('Bora, give me a pencil right now.', 'That is an order. Ask with "May I… please?"'), o('Bora, may I lend you a pencil, please?', '"Lend you" means Min gives Bora a pencil. Min needs to borrow one.'), o("Bora, I don't have a pencil today.", 'That only says the problem. Ask for what you need.')], react: 'nod', note: 'Ask a friend with "May I…, please?"' },
      { id: 'e112', lv: 3, set: 'home', type: 'ask', cast: [{ r: 'mom', feel: 'neutral' }, { r: 'kid', feel: 'happy', prop: 'book' }], intro: 'At home. Min wants to go to the park after her homework.', cue: null, q: 'How does Min ask Mom?', opts: [o('Mom, may I go to the park after my homework?'), o("Mom, I'm going to the park after my homework.", 'That tells Mom. It does not ask her. Say "May I…?"'), o('Mom, may I go to the park instead of my homework?', 'Skipping homework makes a yes very unlikely. Min will do it first.'), o('Mom, park after homework. Okay?', 'That sounds like a deal Min already made. Ask with "May I…?"')], react: 'nod', note: 'To ask permission, say "May I…?"' },
      { id: 'e113', lv: 3, set: 'shop', type: 'ask', cast: [{ r: 'shop', feel: 'happy' }, { r: 'kid', feel: 'neutral' }], intro: 'At the fruit shop. Min wants to know the price of the apples.', cue: null, q: 'How does Min ask Mr. Lee?', opts: [o('Excuse me, how much are these apples?'), o('Excuse me, how many are these apples?', 'For a price, ask "how much". "How many" asks for a number of things.'), o('Excuse me, give me five apples.', 'That does not ask the price, and it sounds like an order.'), o('Excuse me, are these apples sweet?', 'That asks about the taste. Min wants the price.')], react: 'nod', note: 'In a shop, start with "Excuse me" and ask "How much is / are…?"' },
      { id: 'e114', lv: 3, set: 'park', type: 'ask', cast: [{ r: 'jun', feel: 'happy' }, { r: 'kid', feel: 'neutral' }], intro: 'At the park. Jun is on the swing. Min wants a turn.', cue: null, q: 'How does Min ask Jun?', opts: [o("Jun, may I have a turn when you're done?"), o('Jun, may I have a turn right now?', 'Jun is still swinging. "Right now" does not wait for a turn.'), o("Jun, I'm going to have a turn when you're done.", 'That tells Jun what will happen. It does not ask him.'), o("Jun, may you have a turn when I'm done?", 'That is backwards. Min is the one waiting for a turn.')], react: 'nod', note: 'Wait for your turn and ask: "May I have a turn when you\'re done?"' },
      { id: 'e115', lv: 3, set: 'bus', type: 'ask', cast: [{ r: 'man', feel: 'neutral' }, { r: 'kid', feel: 'neutral', prop: 'bag' }], intro: 'On the bus. Min needs to get off, but a man is standing in the aisle.', cue: null, q: 'How does Min ask?', opts: [o('Excuse me, may I get past, please?'), o("Excuse me, I'm getting past now.", 'That only tells him. Ask with "May I…?"'), o('Thank you, may I get past, please?', 'He has not helped yet, so "Thank you" comes too early. Start with "Excuse me".'), o('Hey you, may I get past, please?', '"Hey you" is rude to a grown-up. Start with "Excuse me".')], react: 'nod', note: 'With a stranger, say "Excuse me, may I…, please?"' },
      { id: 'e116', lv: 4, set: 'classroom', type: 'sorry', cast: [{ r: 'friend', feel: 'sad', prop: 'book' }, { r: 'kid', feel: 'sorry', prop: 'cup' }], intro: "In the classroom. Min spilled water on Bora's notebook.", cue: { w: 0, t: 'Oh no, my notebook…' }, q: 'How does Min say sorry?', opts: [o("I'm sorry, I spilled water on your notebook. Let's dry it together."), o("I'm sorry, you spilled water on your notebook. Let's dry it together.", 'Min spilled it. Blaming Bora is not an apology.'), o("I'm sorry, I spilled water on your notebook. You should dry it.", 'Min made the mess, so Min should help fix it.'), o("I'm sorry, I spilled water on your notebook. Oh well, never mind.", '"Never mind" means Min will not fix anything. Say how you will help.')], react: 'nod', after: 'happy', note: 'A real apology: sorry + what I did + what I will do.' },
      { id: 'e117', lv: 4, set: 'home', type: 'sorry', beat: 'shatter', cast: [{ r: 'mom', feel: 'surprised' }, { r: 'kid', feel: 'sorry', prop: 'cup' }], intro: "At home. Min broke Mom's favorite cup.", cue: { w: 0, t: 'Oh! What was that sound?' }, q: 'How does Min say sorry to Mom?', opts: [o("I'm sorry, Mom. I broke the cup. I'll help clean it up."), o("I'm sorry, Mom. The cup broke by itself. I'll help clean it up.", 'Cups do not break by themselves. An apology must be honest.'), o("I'm sorry, Mom. I broke the cup. You can clean it up.", 'Min broke it, so Min should help clean it up.'), o("I'm sorry, Mom. My brother broke the cup. I'll help clean it up.", 'Min broke it. Blaming her brother is not an apology.')], react: 'nod', after: 'neutral', note: 'Say sorry, say what you did, and say how you will fix it.' },
      { id: 'e118', lv: 4, set: 'park', type: 'sorry', cast: [{ r: 'jun', feel: 'sad' }, { r: 'kid', feel: 'sorry' }], intro: "At the park. Min was running and stepped on Jun's foot.", cue: { w: 0, t: 'Ouch!' }, q: 'What does Min say?', opts: [o('Sorry, Jun! I stepped on your foot. Are you okay?'), o('Sorry, Jun! You put your foot in my way.', 'Min stepped on it. Blaming Jun is not an apology.'), o('Sorry, Jun! I stepped on your foot. See you tomorrow!', 'Min leaves without checking on Jun. Ask "Are you okay?"'), o('I deeply apologize, Mr. Jun. Are you injured?', 'That is far too formal for a friend. "Sorry, Jun!" is enough.')], react: 'nod', after: 'happy', note: 'Say sorry and ask "Are you okay?" That helps your friend feel better.' },
      { id: 'e119', lv: 4, set: 'street', type: 'sorry', cast: [{ r: 'grandma', feel: 'surprised', name: { ko: '할머니', en: 'An older lady' } }, { r: 'kid', feel: 'sorry', prop: 'bag' }], intro: 'On the street. Min was running and bumped into an older lady.', cue: { w: 0, t: 'Oh my!' }, q: 'How does Min say sorry to the lady?', opts: [o("I'm so sorry, ma'am. Are you hurt?"), o('Oops, sorry, lady. Are you hurt?', '"Lady" sounds rude to an older stranger. Say "ma\'am".'), o("I'm so sorry, ma'am. Watch where you go!", 'Min bumped into her. Telling her to watch out is blaming her.'), o("I'm so sorry, ma'am. I'm not hurt at all.", 'First ask if she is hurt. Talking about yourself comes later.')], react: 'nod', after: 'neutral', note: 'When you bump into someone, say sorry and ask if they are hurt.' },

      { id: 'e122', lv: 5, set: 'home', type: 'register', cast: [{ r: 'grandma', feel: 'happy', prop: 'paper' }, { r: 'kid', feel: 'shy' }, { r: 'little', feel: 'happy' }], intro: "At Grandma's house. Grandma looks at the picture Min and Dan drew together.", cue: { w: 0, t: 'Min, what a lovely drawing!' }, q: 'What does Min say to Grandma?', opts: [o('Thank you, Grandma! Dan and I drew it together.'), o('Yeah, I know, Grandma. Dan and I drew it together.', '"Yeah, I know" sounds like bragging. Say "Thank you."'), o("No, it's not good, Grandma. Dan and I drew it together.", 'Pushing the praise away makes Grandma feel awkward. Say thank you first.'), o('Thank you, Grandma! I drew it all by myself.', 'Dan helped too. Leaving him out is not fair.')], react: 'cheer', after: 'happy', note: 'Take praise with "Thank you", and give credit to the people who helped.' },

      { id: 'e208', lv: 2, set: 'park', type: 'idiom', cast: [{ r: 'friend', feel: 'surprised' }, { r: 'kid', feel: 'happy' }, { r: 'jun', feel: 'laugh', prop: 'ball' }], intro: '공원이야. 준이 지나가는 사람마다 인사를 해. 모르는 사람이 없어!', cue: { w: 0, t: '준은 아는 사람이 정말 많다.' }, line: '맞아, 준은 {}.', q: '빈칸에 어울리는 관용어는?', opts: [o('발이 넓어'), o('손이 커', '"손이 크다"는 넉넉하게 준비한다는 뜻이야.'), o('눈이 높아', '"눈이 높다"는 좋은 것만 고른다는 뜻이야.'), o('입이 무거워', '"입이 무겁다"는 비밀을 잘 지킨다는 뜻이야.')], react: 'laugh', note: '"발이 넓다"는 아는 사람이 많다는 뜻이야.' },
      { id: 'e209', lv: 2, set: 'classroom', type: 'idiom', cast: [{ r: 'jun', feel: 'worried' }, { r: 'kid', feel: 'happy' }, { r: 'friend', feel: 'proud' }], intro: '교실이야. 준이 비밀을 누구에게 말할지 고민해.', cue: { w: 0, t: '이 비밀, 누구한테 말해도 괜찮을까?' }, line: '보라한테 말해. 보라는 {}.', q: '빈칸에 어울리는 관용어는?', opts: [o('입이 무거워'), o('발이 넓어', '"발이 넓다"는 아는 사람이 많다는 뜻이야. 비밀이 오히려 퍼질 수도 있어!'), o('손이 커', '"손이 크다"는 넉넉하게 준비한다는 뜻이야.'), o('배꼽을 잡아', '"배꼽을 잡다"는 아주 크게 웃는다는 뜻이야.')], react: 'nod', note: '"입이 무겁다"는 비밀을 잘 지킨다는 뜻이야.' },
      { id: 'e210', lv: 2, set: 'shop', type: 'idiom', cast: [{ r: 'mom', feel: 'laugh' }, { r: 'kid', feel: 'shy' }], intro: '가게야. 민이가 남들 말을 듣고 사고 싶은 걸 자꾸 바꿔.', cue: { w: 0, t: '아까는 파란 거라더니, 또 바뀌었네.' }, line: '제가 좀 {}.', q: '빈칸에 어울리는 관용어는?', opts: [o('귀가 얇아요'), o('손이 커요', '"손이 크다"는 넉넉하게 준비한다는 뜻이야.'), o('발이 넓어요', '"발이 넓다"는 아는 사람이 많다는 뜻이야.'), o('입이 무거워요', '"입이 무겁다"는 비밀을 잘 지킨다는 뜻이야.')], react: 'laugh', note: '"귀가 얇다"는 남의 말에 쉽게 마음이 바뀐다는 뜻이야.' },
      { id: 'e211', lv: 2, set: 'street', type: 'idiom', cast: [{ r: 'jun', feel: 'laugh' }, { r: 'kid', feel: 'laugh' }], intro: '길이야. 준의 웃긴 이야기에 모두 데굴데굴 웃었어.', cue: { w: 0, t: '내 이야기 어땠어?' }, line: '다들 {}!', q: '빈칸에 어울리는 관용어는?', opts: [o('배꼽을 잡았어'), o('귀가 얇았어', '"귀가 얇다"는 남의 말에 쉽게 흔들린다는 뜻이야.'), o('발이 넓었어', '"발이 넓다"는 아는 사람이 많다는 뜻이야.'), o('눈코 뜰 새 없었어', '"눈코 뜰 새 없다"는 아주 바쁘다는 뜻이야. 웃은 것과는 상관없어.')], react: 'laugh', note: '"배꼽을 잡다"는 배꼽이 빠질 만큼 크게 웃는다는 뜻이야.' },
      { id: 'e212', lv: 2, set: 'bus', type: 'idiom', cast: [{ r: 'friend', feel: 'worried', prop: 'book' }, { r: 'kid', feel: 'proud' }], intro: '버스야. 보라가 어제 숙제가 어려웠는지 물어봤어.', cue: { w: 0, t: '어제 숙제 어려웠어?' }, line: '아니, 그 숙제는 {}.', q: '빈칸에 어울리는 관용어는?', opts: [o('식은 죽 먹기였어'), o('눈코 뜰 새 없었어', '"눈코 뜰 새 없다"는 정신없이 바쁘다는 뜻이야.'), o('손이 컸어', '"손이 크다"는 넉넉하게 준비한다는 뜻이야.'), o('입이 무거웠어', '"입이 무겁다"는 비밀을 잘 지킨다는 뜻이야.')], react: 'nod', note: '"식은 죽 먹기"는 아주 쉬운 일이라는 뜻이야.' },
      // lv3: a gentle refusal or request — the best line has the real reason, a clear time or another way, and the right register
      { id: 'e213', lv: 3, set: 'park', type: 'refuse', cast: [{ r: 'jun', feel: 'happy', prop: 'ball' }, { r: 'kid', feel: 'worried', prop: 'bag' }], intro: '공원이야. 준이 놀자고 하는데, 민이는 오늘 피아노 수업이 있어.', cue: { w: 0, t: '민아, 오늘 우리 집에서 게임 하자!' }, q: '민이는 어떻게 부드럽게 거절할까?', opts: [o('미안, 오늘은 피아노 수업이 있어. 내일 같이 하자.'), o('미안, 오늘은 피아노 수업이 있어. 언젠가 같이 하자.', '"언젠가"는 언제인지 알 수 없어서 준이 거절당한 느낌만 받아. 다른 날을 딱 정해 주면 더 부드러워.'), o('미안, 오늘은 숙제가 너무 많아. 내일 같이 하자.', '진짜 이유는 피아노 수업이야. 핑계를 대면 나중에 곤란해질 수 있어.'), o('좋아, 오늘 피아노 수업은 빠질게. 같이 하자.', '수업을 빠지면 약속을 어기게 돼. 거절해야 할 땐 거절해도 괜찮아.')], react: 'nod', note: '거절할 땐 진짜 이유를 말하고, 다른 날을 정해 주면 부드러워져.' },
      { id: 'e214', lv: 3, set: 'classroom', type: 'refuse', cast: [{ r: 'friend', feel: 'worried', prop: 'book' }, { r: 'kid', feel: 'think' }], intro: '교실이야. 보라가 숙제를 베끼게 해 달래.', cue: { w: 0, t: '민아, 네 숙제 좀 보여 줘. 베끼기만 할게.' }, q: '민이는 어떻게 거절할까?', opts: [o('베끼는 건 안 될 것 같아. 대신 같이 풀어 볼래?'), o('베끼는 건 안 될 것 같아. 대신 답만 알려 줄게.', '답만 알려 주는 것도 베끼는 것과 같아. 보라가 스스로 풀게 도와줘야 해.'), o('그래, 이번 한 번만 보여 줄게. 대신 비밀이야.', '베끼게 해 주면 보라에게 도움이 안 돼. 안 되는 건 안 된다고 말해도 괜찮아.'), o('베끼는 건 안 될 것 같아. 대신 내일 혼자 해 봐.', '안 된다고만 하고 혼자 하라면 보라가 막막해. 도와줄 방법을 함께 말해 봐.')], react: 'nod', after: 'happy', note: '안 되는 일은 분명히 거절하고, 도울 방법을 함께 말해 봐.' },
      { id: 'e215', lv: 3, set: 'home', type: 'request', cast: [{ r: 'mom', feel: 'neutral' }, { r: 'kid', feel: 'worried', prop: 'crayon' }], intro: '집이야. 그림을 거의 다 그렸는데 엄마가 방을 치우라고 하셨어.', cue: { w: 0, t: '민아, 지금 방 좀 치워 줄래?' }, q: '민이는 엄마께 어떻게 부탁할까?', opts: [o('엄마, 이 그림만 끝내고 10분 뒤에 치울게요.'), o('엄마, 이 그림만 끝내고 이따가 저녁에 치울게요.', '저녁은 너무 늦어. 엄마는 지금 치우길 바라셔. 짧고 정확한 시간을 말해야 들어주시기 쉬워.'), o('엄마, 엄마가 대신 10분만 치워 주세요.', '민이 방이니까 민이가 치워야지. 엄마께 떠넘기는 건 부탁이 아니야.'), o('엄마, 그림 그리느라 방은 오늘 못 치워요.', '못 한다고만 하면 거절이 돼. 언제 할지 약속해야 미루는 부탁이 돼.')], react: 'nod', note: '미루고 싶을 땐 언제까지 할지 정확히 말하면 믿어 주셔.' },
      { id: 'e216', lv: 3, set: 'shop', type: 'request', cast: [{ r: 'shop', feel: 'neutral' }, { r: 'kid', feel: 'neutral' }], intro: '과일 가게야. 민이는 귤이 달콤한지 맛보고 싶어.', cue: null, q: '민이는 아저씨께 어떻게 부탁할까?', opts: [o('아저씨, 이 귤 하나만 맛봐도 될까요?'), o('아저씨, 이 귤 하나만 맛봐도 돼?', '가게 아저씨는 어른이야. "돼?" 대신 "될까요?"로 높여야 해.'), o('아저씨, 이 귤 하나만 맛보세요.', '"맛보세요"는 아저씨께 드시라는 말이야. 맛보고 싶은 건 민이야.'), o('아저씨, 이 귤 하나만 공짜로 주실래요?', '맛보고 싶은 건데 공짜로 달라는 말이 됐어. 무엇을 원하는지 정확히 말해야 해.')], react: 'nod', note: '"~해도 될까요?"로 허락을 구하면 어른도 기분 좋게 들어주셔.' },
      { id: 'e217', lv: 3, set: 'bus', type: 'request', cast: [{ r: 'man', feel: 'neutral' }, { r: 'kid', feel: 'worried' }], intro: '버스야. 옆자리 아저씨의 음악 소리가 너무 커.', cue: null, q: '민이는 아저씨께 어떻게 부탁할까?', opts: [o('저기요, 소리를 조금만 줄여 주실 수 있을까요?'), o('저기요, 소리를 조금만 줄여 줄 수 있어?', '처음 보는 어른께 "있어?"는 반말이야. "있을까요?"로 높여야 해.'), o('저기요, 소리를 조금만 키워 주실 수 있을까요?', '"키워"는 소리를 더 크게 해 달라는 말이야. 반대가 됐어.'), o('저기요, 소리가 너무 커서 제가 내릴게요.', '부탁하지 않고 내려 버리면 문제가 그대로야. 정중하게 부탁해 봐.')], react: 'nod', note: '모르는 어른께 부탁할 땐 "저기요, ~해 주실 수 있을까요?"라고 말해.' },
      { id: 'e218', lv: 3, set: 'street', type: 'refuse', beat: 'redLight', cast: [{ r: 'jun', feel: 'excited' }, { r: 'kid', feel: 'worried' }], intro: '횡단보도야. 빨간불인데 준이 그냥 건너자고 해.', cue: { w: 0, t: '차 안 와. 그냥 건너자!' }, q: '민이는 어떻게 거절할까?', opts: [o('안 돼, 빨간불이야. 초록불 되면 같이 건너자.'), o('안 돼, 빨간불이야. 너 혼자 먼저 건너.', '친구 혼자 위험하게 건너게 두면 안 돼. 같이 기다리자고 해야 해.'), o('안 돼, 빨간불이야. 저쪽으로 뛰어서 건너자.', '다른 곳으로 뛰어가도 빨간불이면 위험해. 초록불을 기다려야 해.'), o('안 돼, 차가 와. 초록불 되면 같이 건너자.', '준 말대로 차는 안 와. 진짜 이유는 신호야. 차가 없어도 빨간불엔 기다려.')], react: 'nod', note: '위험한 일은 분명히 "안 돼"라고 말하고, 진짜 이유와 함께 기다리자고 해.' },
      // lv4: reading between the lines
      { id: 'e219', lv: 4, set: 'classroom', type: 'between', cast: [{ r: 'friend', feel: 'tired', prop: 'box' }, { r: 'kid', feel: 'think' }], intro: '교실이야. 보라가 무거운 상자를 들고 한숨을 쉬어.', cue: { w: 0, t: '괜찮아… 나 혼자 할 수 있어.' }, q: '보라의 속마음을 생각하면, 민이는 뭐라고 말할까?', opts: [o('무거워 보인다. 내가 한쪽 들어 줄게.'), o('그렇구나. 그럼 나는 먼저 교실에 갈게.', '보라는 사실 도움이 필요해. 말 그대로만 들으면 한숨을 놓쳐.'), o('와, 힘이 세구나. 혼자서도 잘하네!', '한숨을 쉬는데 힘이 세다고 하면 보라 마음을 못 읽은 거야.'), o('무거워 보인다. 다 들고 나서 쉬어.', '힘든 걸 알아챘는데 돕지 않았어. 보라가 바라는 건 손 하나야.')], react: 'laugh', after: 'happy', note: '"괜찮아"라고 해도 한숨과 표정을 보면 도움이 필요한 걸 알 수 있어.' },
      { id: 'e220', lv: 4, set: 'home', type: 'between', cast: [{ r: 'little', feel: 'worried' }, { r: 'kid', feel: 'neutral', prop: 'snack' }], intro: '집이야. 동생이 민이의 과자를 빤히 쳐다봐.', cue: { w: 0, t: '누나 과자 맛있겠다…' }, q: '동생의 속마음을 생각하면, 민이는 뭐라고 말할까?', opts: [o('하나 먹어 볼래? 반씩 나눠 먹자.'), o('응, 진짜 맛있어. 너도 나중에 사.', '동생은 먹고 싶다는 뜻으로 말했어. 맛만 대답하면 마음을 몰라준 거야.'), o('응, 맛있겠지? 다 먹고 봉지 줄게.', '빈 봉지는 동생이 바라는 게 아니야. 장난처럼 넘기면 동생이 서운해.'), o('맛있겠다고? 엄마한테 사 달라고 해.', '동생은 지금 누나 과자를 같이 먹고 싶은 거야. 엄마께 미루면 마음을 몰라준 거야.')], react: 'cheer', after: 'happy', note: '"맛있겠다…"는 먹고 싶다는 뜻이야. 말 속의 마음을 읽어 봐.' },
      { id: 'e221', lv: 4, set: 'park', type: 'between', cast: [{ r: 'jun', feel: 'sad' }, { r: 'kid', feel: 'think', prop: 'ball' }], intro: '공원이야. 팀을 나누는데 준이 마지막까지 안 뽑혔어.', cue: { w: 0, t: '나 축구 별로 안 좋아해…' }, q: '준의 속마음을 생각하면, 민이는 뭐라고 말할까?', opts: [o('같이 하자. 너 우리 팀 골키퍼 해 줄래?'), o('그렇구나. 그럼 저기서 구경하고 있어.', '준은 속상해서 그렇게 말한 거야. 말 그대로 들으면 준이 더 서운해.'), o('그래도 해. 사람이 한 명 모자라거든.', '준을 사람 수 채우기로만 말했어. 준이 서운한 마음은 그대로야.'), o('축구 별로야? 그럼 다른 놀이 하러 가.', '말 그대로 들었어. 마지막까지 안 뽑혀서 속상한 마음을 읽어야 해.')], react: 'cheer', after: 'happy', note: '"별로 안 좋아해"는 속상해서 하는 말일 수 있어. 언제 한 말인지 봐.' },
      { id: 'e222', lv: 4, set: 'bus', type: 'between', cast: [{ r: 'grandma', feel: 'tired', prop: 'cane' }, { r: 'kid', feel: 'neutral' }], intro: '버스야. 민이가 모르는 할머니께 자리를 양보했는데, 할머니가 사양하셔.', cue: { w: 0, t: '괜찮다, 금방 내려.' }, q: '할머니의 마음을 생각하면, 민이는 뭐라고 말할까?', opts: [o('그래도 앉으세요. 저는 서 있어도 괜찮아요.'), o('네, 알겠어요. 그럼 제가 다시 앉을게요.', '할머니는 미안해서 사양하신 거야. 한 번 더 권해 드려.'), o('그래도 앉아. 나는 계속 서 있어도 괜찮아.', '마음은 좋은데 할머니께 반말이야. "앉으세요", "괜찮아요"로 높여야 해.'), o('그래도 앉으세요. 금방 내리시니까요.', '"금방 내리시니까" 앉으라는 건 이유가 이상해. 할머니가 편히 앉으시도록 권해야 해.')], react: 'nod', note: '어른이 미안해서 사양하시면 한 번 더 권하는 게 예의야.' },
      { id: 'e223', lv: 4, set: 'shop', type: 'between', cast: [{ r: 'mom', feel: 'worried' }, { r: 'kid', feel: 'think' }], intro: '신발 가게야. 엄마가 가격표를 보고 조용히 말씀하셨어.', cue: { w: 0, t: '이 신발 예쁘긴 한데… 음, 다음에 보자.' }, q: '엄마의 속마음을 생각하면, 민이는 뭐라고 말할까?', opts: [o('괜찮아요. 지금 신발도 아직 잘 맞아요.'), o('그럼 다음 주에 꼭 사 주세요. 약속!', '엄마는 값이 부담돼서 미루신 거야. 약속을 조르면 엄마가 더 곤란해.'), o('엄마도 예쁘대요! 그러니까 오늘 사요.', '"예쁘긴 한데…"는 사기 어렵다는 뜻이야. "예쁘다"만 듣고 조르면 마음을 놓친 거야.'), o('안 예뻐요? 그럼 다른 신발 볼까요?', '엄마는 예쁘다고 하셨어. 문제는 모양이 아니라 값이야.')], react: 'nod', note: '"다음에 보자"는 지금은 어렵다는 뜻일 때가 많아.' },
      // lv5: mixed, close distractors
      { id: 'e224', lv: 5, set: 'classroom', type: 'request', cast: [{ r: 'teacher', feel: 'neutral' }, { r: 'kid', feel: 'worried', prop: 'paper' }], intro: '교실이야. 발표 준비가 아직 덜 됐는데 선생님이 물어보셨어.', cue: { w: 0, t: '민아, 발표 준비 다 됐니?' }, q: '민이는 선생님께 뭐라고 말할까?', opts: [o('아직 조금 남았어요. 내일까지 해도 될까요?'), o('네, 다 됐어요. 그런데 내일 해도 될까요?', '다 됐다면서 미루면 앞뒤가 안 맞아. 솔직하게 말해야 해.'), o('아직 조금 남았어. 내일까지 해도 될까?', '솔직한 건 좋은데 선생님께 반말이야. "남았어요", "될까요?"로 높여야 해.'), o('아직 조금 남았어요. 보라가 대신 해도 될까요?', '내 발표를 친구에게 떠넘기는 건 부탁이 아니야. 내가 마칠 시간을 부탁해.')], react: 'nod', note: '솔직하게 상황을 말하고, 언제까지 할지 "~해도 될까요?"로 부탁해.' },
      { id: 'e225', lv: 5, set: 'street', type: 'between', cast: [{ r: 'jun', feel: 'shy' }, { r: 'kid', feel: 'happy' }], intro: '길이야. 준이 새 신발을 신고 와서 자꾸 발을 내려다봐.', cue: { w: 0, t: '별거 아니야, 그냥 산 거야.' }, q: '준의 속마음을 생각하면, 민이는 뭐라고 말할까?', opts: [o('와, 색깔 진짜 멋지다. 너한테 잘 어울려!'), o('그렇구나. 별거 아니면 안 봐도 되겠다.', '준은 사실 봐 주길 바라고 있어. 말 그대로 들으면 놓쳐.'), o('와, 색깔 진짜 멋지다. 얼마 주고 샀어?', '값을 물으면 이야기가 돈으로 가. 준이 바라는 건 칭찬이야.'), o('와, 색깔 진짜 멋지다. 내 것도 그거야.', '내 얘기로 돌리면 준의 신발이 주인공이 아니게 돼.')], react: 'laugh', after: 'happy', note: '"별거 아니야"라고 하면서 자꾸 보여 주면 칭찬받고 싶은 거야.' },
      { id: 'e226', lv: 5, set: 'home', type: 'connect', cast: [{ r: 'dad', feel: 'happy', prop: 'cup' }, { r: 'kid', feel: 'proud' }, { r: 'little', feel: 'proud', prop: 'ball' }], intro: '집이야. 동생이 축구 시합에서 돌아왔어.', cue: { w: 0, t: '동생 시합은 어땠대?' }, line: '아침에 감기 기운이 있었대요. {} 골을 두 개나 넣었대요.', q: '빈칸에 가장 어울리는 이어 주는 말은?', opts: [o('그런데도'), o('그러므로', '"그러므로"는 앞말이 이유일 때 써. 감기 때문에 골을 넣은 게 아니잖아.'), o('게다가', '"게다가"는 같은 쪽 이야기를 보탤 때 써. 아팠던 것과 골을 넣은 건 반대쪽 이야기야.'), o('반면에', '"반면에"는 서로 다른 두 가지를 견줄 때 써. 동생 한 사람에게 일어난 일을 이을 땐 어색해.')], react: 'cheer', after: 'happy', note: '앞 일로 보면 어려울 것 같은데 뒤 일이 일어났을 땐 "그런데도"를 써.' },
      { id: 'e227', lv: 5, set: 'classroom', type: 'between', cast: [{ r: 'teacher', feel: 'neutral' }, { r: 'kid', feel: 'shy' }, { r: 'friend', feel: 'laugh' }], intro: '교실이야. 수업 종이 울렸는데 민이와 보라는 아직 수다를 떨고 있어.', cue: { w: 0, t: '어머, 벌써 종이 쳤네? 둘이 하는 이야기가 정말 재미있나 보구나.' }, line: '{}', q: '선생님의 진짜 뜻을 생각하면, 민이는 뭐라고 말할까?', opts: [o('죄송해요, 선생님. 이제 조용히 할게요.'), o('네, 선생님. 정말 재미있는 얘기라서 그래요!', '선생님은 재미있냐고 물으신 게 아니야. 이제 조용히 하자는 뜻이야.'), o('죄송해요, 선생님. 종이 벌써 쳤어요?', '종이 친 건 맞아. 선생님이 하고 싶은 말은 "이제 수업하자"야.'), o('네, 선생님도 같이 들으실래요?', '선생님 말씀을 말 그대로 들은 거야. 진짜 뜻은 조용히 하자는 거야.')], react: 'nod', after: 'happy', note: '"이야기가 재미있나 보구나"는 이제 그만하자는 뜻일 때가 많아. 상황을 같이 봐.' },
      { id: 'e228', lv: 5, set: 'home', type: 'refuse', cast: [{ r: 'grandma', feel: 'happy', prop: 'cup' }, { r: 'kid', feel: 'tired' }], intro: '할머니 댁이야. 밥을 두 그릇이나 먹었는데 할머니가 또 밥을 퍼 오셨어.', cue: { w: 0, t: '우리 강아지, 한 그릇 더 먹으렴!' }, line: '{}', q: '민이는 할머니께 어떻게 부드럽게 거절할까?', opts: [o('정말 맛있었어요. 그런데 배가 불러서 더는 못 먹겠어요.'), o('정말 맛있었어요. 그래서 배가 터져도 한 그릇 더 먹을게요.', '배가 부른데 억지로 먹으면 탈이 나. 고마운 마음을 말하고 솔직하게 거절해도 돼.'), o('정말 맛있었어. 그런데 배가 불러서 더는 못 먹겠어.', '말은 좋은데 할머니께 반말이야. "맛있었어요", "못 먹겠어요"로 높여야 해.'), o('그만 주세요. 배가 불러서 더는 못 먹겠어요.', '고맙다는 말 없이 "그만 주세요"부터 하면 할머니가 서운하셔.')], react: 'laugh', after: 'happy', note: '고마운 마음을 먼저 말하고 "그런데"로 이유를 말하면 거절도 따뜻해져.' },
      { id: 'e229', lv: 5, set: 'home', type: 'idiom', cast: [{ r: 'grandma', feel: 'worried' }, { r: 'kid', feel: 'neutral' }, { r: 'little', feel: 'tired' }], intro: '집이야. 동생이 밥을 몇 숟가락만 먹고 내려놓았어. 할머니가 걱정하셔.', cue: { w: 0, t: '아이고, 우리 막내는 왜 이렇게 조금 먹니?' }, line: '할머니, 동생은 원래 {}.', q: '빈칸에 어울리는 관용어는?', opts: [o('입이 짧아요'), o('입이 무거워요', '"입이 무겁다"는 비밀을 잘 지킨다는 뜻이야. 먹는 것과는 상관없어.'), o('입이 가벼워요', '"입이 가볍다"는 비밀을 쉽게 말해 버린다는 뜻이야.'), o('손이 커요', '"손이 크다"는 넉넉하게 준비한다는 뜻이야.')], react: 'nod', note: '"입이 짧다"는 음식을 적게 먹거나 가려 먹는다는 뜻이야. "입"이 들어간 관용어도 뜻이 다 달라.' },
      { id: 'e230', lv: 5, set: 'park', type: 'proverb', cast: [{ r: 'jun', feel: 'shy' }, { r: 'kid', feel: 'happy' }, { r: 'friend', feel: 'happy' }], intro: '공원이야. 줄넘기를 제일 잘하는 준이 줄에 걸려 넘어졌어.', cue: { w: 0, t: '아, 창피해. 나 원래 이런 거 안 틀리는데.' }, line: '"{}"라더니, 괜찮아!', q: '빈칸에 어울리는 속담은?', opts: [o('원숭이도 나무에서 떨어진다'), o('소 잃고 외양간 고친다', '일이 벌어진 뒤에야 대비할 때 쓰는 말이야. 지금은 잘하는 사람도 실수한다는 뜻이 필요해.'), o('세 살 버릇 여든까지 간다', '어릴 때 버릇이 오래 간다는 뜻이야. 실수 한 번과는 상관없어.'), o('낮말은 새가 듣고 밤말은 쥐가 듣는다', '어디서든 말조심하라는 뜻이야. 실수를 위로하는 말이 아니야.')], react: 'nod', after: 'happy', note: '"원숭이도 나무에서 떨어진다": 아무리 잘하는 사람도 실수할 때가 있어.' },
      { id: 'e231', lv: 5, set: 'street', type: 'connect', cast: [{ r: 'dad', feel: 'neutral' }, { r: 'kid', feel: 'think' }], intro: '길이야. 지름길 앞에 "공사 중" 표지판이 서 있어.', cue: { w: 0, t: '이쪽 길로 가면 더 빠르지?' }, line: '이 길이 지름길이긴 해요. {} 오늘은 공사 중이라 못 지나가요.', q: '빈칸에 가장 어울리는 이어 주는 말은?', opts: [o('그런데'), o('그러므로', '"그러므로"는 앞말이 이유일 때 써. 지름길이라서 못 지나가는 게 아니야.'), o('게다가', '"게다가"는 같은 쪽 이야기를 보탤 때 써. 빠른 길인데 못 간다는 건 반대쪽 이야기야.'), o('그러니까', '"그러니까"는 앞말이 이유일 때 써. 지름길이라는 건 못 지나가는 이유가 아니야.')], react: 'nod', note: '앞말을 인정하면서 다른 사정을 말할 땐 "그런데"가 어울려.' },
    ],
    en: [
      { id: 'e201', lv: 1, set: 'classroom', type: 'connect', cast: [{ r: 'teacher', feel: 'neutral' }, { r: 'kid', feel: 'tired' }], intro: 'In the classroom. Min keeps yawning in class.', cue: { w: 0, t: 'Min, are you tired?' }, line: "I read until late last night, {} I'm a little sleepy today.", q: 'Which word fits the blank?', opts: [o('so'), o('but', 'With "but", reading late and feeling sleepy would be opposites. They are not.'), o('because', '"Because" must come before a reason. Feeling sleepy is the result, not the reason.'), o('or', '"Or" offers a choice between two things. Here one thing caused the other.')], react: 'nod', note: 'When the first part causes the second, join them with "so".' },
      { id: 'e202', lv: 1, set: 'park', type: 'connect', beat: 'rain', cast: [{ r: 'kid', feel: 'neutral' }, { r: 'friend', feel: 'proud', prop: 'ball' }], sp: 1, intro: "At the park. It poured all morning, but Bora's team still played.", cue: { w: 0, t: 'Bora, did the rain cancel your match?' }, line: 'It rained a lot, {} we played the whole match.', q: 'Which word fits the blank?', opts: [o('but'), o('so', '"So" would mean the rain made them play. Rain is not a reason to play.'), o('because', '"Because" would make the match the reason for the rain.'), o('or', '"Or" offers a choice. Both things really happened.')], react: 'cheer', after: 'happy', note: 'When the second part goes against what you expect, use "but".' },
      { id: 'e203', lv: 1, set: 'home', type: 'connect', cast: [{ r: 'mom', feel: 'neutral' }, { r: 'kid', feel: 'proud', prop: 'book' }], intro: 'At home. Mom asks about the homework.', cue: { w: 0, t: 'Did you finish your homework?' }, line: 'I finished my math homework, {} I finished my reading homework too.', q: 'Which word fits the blank?', opts: [o('and'), o('but', '"But" joins opposites. Finishing both is the same kind of good news.'), o('so', '"So" would mean the math homework made the reading homework get done.'), o('or', '"Or" offers a choice. Min did both.')], react: 'nod', after: 'happy', note: 'To add one more thing of the same kind, use "and".' },
