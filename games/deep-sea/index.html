<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>바다 탐험 잠수함 · MY SIA</title>
<style id="sia-kit-css">
/* MY SIA game kit — overlay UI. 1rem = 16 design px on a 1024x768 stage (kit.js scales the root font size). */
:root {
  --sk-ink: #22305C;
  --sk-ink-2: #44507E;
  --sk-paper: #FFFFFF;
  --sk-cream: #FFF7E8;
  --sk-blue: #4A86FF;  --sk-blue-2: #2F64E8;
  --sk-green: #63D85A; --sk-green-2: #2EA94A;
  --sk-yellow: #FFD23F; --sk-yellow-2: #F5A91A;
  --sk-pink: #FF74AE;  --sk-pink-2: #E4488A;
  --sk-orange: #FF9442; --sk-orange-2: #E86D1E;
  --sk-purple: #9673FF; --sk-purple-2: #6C4BE6;
  --sk-sky: #6FD0FF;   --sk-sky-2: #2EA3EC;
  --sk-red: #FF5C57;
  --sk-gold: #FFC83A;
  --sk-line: 0.22rem;
  --sk-font: "Apple SD Gothic Neo", "AppleSDGothicNeo-Heavy", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE9FF; overscroll-behavior: none; }
body { font-family: var(--sk-font); color: var(--sk-ink); -webkit-text-size-adjust: 100%; position: fixed; inset: 0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#sk-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* boot screen (pure CSS, visible until kit.js adds .sk-ready) */
body:not(.sk-ready)::before { content: ""; position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle at 50% 46%, #4A86FF 0 3.4rem, transparent 3.5rem), linear-gradient(180deg, #8FD8FF, #DDF6FF); animation: sk-boot 0.9s ease-in-out infinite alternate; }
body:not(.sk-ready)::after { content: "MY SIA"; position: fixed; left: 0; right: 0; top: 62%; text-align: center; z-index: 100; font: 900 2rem var(--sk-font); color: #fff; letter-spacing: .1em; text-shadow: 0 .18rem 0 var(--sk-ink); }
@keyframes sk-boot { from { background-position: 0 0, 0 0; } to { background-position: 0 -1.2rem, 0 0; } }
.sk-error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 200; background: linear-gradient(180deg, #8FD8FF, #DDF6FF); font: 800 1.6rem/1.5 var(--sk-font); color: var(--sk-ink); padding: 2rem; }

/* ---------- layers ---------- */
#sk-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: var(--sk-font);
  /* Korean line breaking: break between words, never inside one (자업자 / 득); a word too long for its box still wraps */
  word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
#sk-ui > div { position: absolute; inset: 0; pointer-events: none; }
#sk-ui .sk-hit, #sk-ui button { pointer-events: auto; }
.sk-hide { display: none !important; }

/* ---------- outlined chunky text ---------- */
.sk-ol { position: relative; display: inline-block; z-index: 0; color: #fff; }
.sk-ol::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; -webkit-text-stroke: var(--sk-ol-w, .55rem) var(--sk-ol-c, var(--sk-ink)); color: var(--sk-ol-c, var(--sk-ink)); text-shadow: 0 var(--sk-ol-drop, .3rem) 0 var(--sk-ol-c, var(--sk-ink)); }

/* ---------- buttons ---------- */
.sk-btn { --c1: var(--sk-green); --c2: var(--sk-green-2); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  font: 800 1.55rem/1 var(--sk-font); color: #fff; padding: .78rem 1.7rem .86rem; min-height: 3.6rem; border-radius: 999px; cursor: pointer;
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: inset 0 -.32rem 0 rgba(0,0,0,.13), 0 .34rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.22);
  text-shadow: 0 .12rem 0 rgba(0,0,0,.22); transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; outline: none; }
.sk-btn::before { content: ""; position: absolute; left: 10%; right: 10%; top: .22rem; height: 40%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.08)); pointer-events: none; }
.sk-btn > * { position: relative; }
.sk-btn svg { width: 1.5em; height: 1.5em; flex: none; }
.sk-btn:active, .sk-btn.sk-press { transform: translateY(.26rem); box-shadow: inset 0 -.2rem 0 rgba(0,0,0,.13), 0 .08rem 0 var(--sk-ink), 0 .3rem .6rem rgba(20,40,90,.2); }
.sk-btn[disabled], .sk-btn.sk-off { --c1: #D6DCE6; --c2: #AEB7C6; opacity: .8; }
.sk-btn.sk-blue { --c1: var(--sk-blue); --c2: var(--sk-blue-2); }
.sk-btn.sk-yellow { --c1: var(--sk-yellow); --c2: var(--sk-yellow-2); color: var(--sk-ink); text-shadow: 0 .1rem 0 rgba(255,255,255,.5); }
.sk-btn.sk-pink { --c1: var(--sk-pink); --c2: var(--sk-pink-2); }
.sk-btn.sk-orange { --c1: var(--sk-orange); --c2: var(--sk-orange-2); }
.sk-btn.sk-purple { --c1: var(--sk-purple); --c2: var(--sk-purple-2); }
.sk-btn.sk-sky { --c1: var(--sk-sky); --c2: var(--sk-sky-2); }
.sk-btn.sk-white { --c1: #FFFFFF; --c2: #E6EEFA; color: var(--sk-ink); text-shadow: none; }
.sk-btn.sk-big { font-size: 2.1rem; padding: 1rem 2.6rem 1.1rem; min-height: 4.6rem; }

.sk-icon { position: relative; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sk-ink);
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, #FFFFFF, #E4ECFA); box-shadow: inset 0 -.25rem 0 rgba(30,60,120,.12), 0 .26rem 0 var(--sk-ink), 0 .5rem .8rem rgba(20,40,90,.2);
  font: 900 1.15rem/1 var(--sk-font); transition: transform .08s, box-shadow .08s; touch-action: manipulation; padding: 0; outline: none; }
.sk-icon::before { content: ""; position: absolute; left: 18%; right: 18%; top: .16rem; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); pointer-events: none; }
.sk-icon svg { width: 58%; height: 58%; position: relative; }
.sk-icon:active, .sk-icon.sk-press { transform: translateY(.2rem); box-shadow: inset 0 -.15rem 0 rgba(30,60,120,.12), 0 .06rem 0 var(--sk-ink); }
.sk-icon.sk-on { background: linear-gradient(180deg, #FFE36B, #FFC22E); }

/* ---------- HUD ---------- */
.sk-top { position: absolute; top: 1.1rem; left: 1.2rem; right: 1.2rem; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.sk-top .sk-group { display: flex; gap: .7rem; align-items: center; pointer-events: none; }
.sk-top .sk-icon, .sk-top .sk-chip, .sk-top .sk-starbar { pointer-events: auto; }
.sk-chip { position: absolute; left: 50%; top: 1.1rem; transform: translateX(-50%); display: flex; align-items: center; gap: .7rem; padding: .35rem 1.3rem .35rem .45rem; min-height: 3.5rem;
  background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.2); font: 900 1.6rem/1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }
.sk-chip .sk-chip-ico { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: radial-gradient(circle at 35% 30%, #fff, #DFF3FF 70%); border: .16rem solid var(--sk-ink); }
.sk-chip .sk-chip-bar { width: 7.5rem; height: 1.05rem; border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); overflow: hidden; }
.sk-chip .sk-chip-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(180deg, #8CF06B, #34B84A); box-shadow: inset 0 .2rem 0 rgba(255,255,255,.5); transition: width .45s cubic-bezier(.3,1.6,.5,1); }
.sk-chip .sk-chip-label { font-size: 1.05rem; color: var(--sk-ink-2); font-weight: 800; }
.sk-bump { animation: sk-bump .42s cubic-bezier(.3,1.7,.5,1); }
@keyframes sk-bump { 0% { scale: 1; } 35% { scale: 1.22; } 100% { scale: 1; } }

.sk-starbar { display: flex; gap: .1rem; align-items: center; padding: .3rem .7rem; height: 3.5rem; background: rgba(255,255,255,.92); border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink); }
.sk-starbar svg { width: 2.35rem; height: 2.35rem; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
.sk-starbar svg.sk-lit { transform: scale(1.12) rotate(-6deg); }

/* ---------- star svg ---------- */
.sk-star-e path.f { fill: #D9E0EE; } .sk-star-e path.h { opacity: 0; }
.sk-star path.f { fill: url(#skGold); } .sk-star path { stroke: var(--sk-ink); stroke-width: 7; stroke-linejoin: round; }
.sk-star path.h, .sk-star-e path.h { stroke: none; fill: #fff; opacity: .55; }

/* ---------- speech bubble ---------- */
.sk-bubble { position: absolute; max-width: 23rem; min-width: 8rem; padding: .95rem 1.25rem 1rem; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 1.5rem;
  box-shadow: 0 .3rem 0 var(--sk-ink), 0 .8rem 1.4rem rgba(20,40,90,.2); font: 800 1.4rem/1.38 var(--sk-font); color: var(--sk-ink); transform: translate(-50%, -100%); transform-origin: 50% 100%;
  pointer-events: auto; cursor: pointer; word-break: keep-all; overflow-wrap: break-word; animation: sk-bubble-in .32s cubic-bezier(.3,1.6,.5,1); }
.sk-bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -.95rem; width: 1.3rem; height: 1.3rem; background: #fff; border-right: var(--sk-line) solid var(--sk-ink); border-bottom: var(--sk-line) solid var(--sk-ink); transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: .3rem; box-shadow: .3rem .3rem 0 -0.05rem rgba(34,48,92,1); }
.sk-bubble .sk-who { display: inline-flex; align-items: center; gap: .3rem; font-size: .95rem; color: #fff; background: var(--sk-blue); border: .14rem solid var(--sk-ink); border-radius: 999px; padding: .12rem .6rem .14rem; margin: 0 0 .4rem -.2rem; }
.sk-bubble .sk-who svg { width: 1rem; height: 1rem; }
.sk-bubble.sk-out { animation: sk-bubble-out .2s ease-in forwards; }
@keyframes sk-bubble-in { from { transform: translate(-50%, -100%) scale(.4); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
@keyframes sk-bubble-out { to { transform: translate(-50%, -100%) scale(.6); opacity: 0; } }

/* ---------- 3D-anchored tag ---------- */
.sk-tag { position: absolute; transform: translate(-50%, -50%); padding: .3rem .85rem .36rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: .9rem; box-shadow: 0 .2rem 0 var(--sk-ink); font: 800 1.15rem/1.1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }

/* ---------- pop text ---------- */
.sk-pop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 900 var(--size, 3rem)/1 var(--sk-font); pointer-events: none; animation: sk-pop var(--dur, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.sk-pop .sk-ol { color: var(--fill, #FF5C57); --sk-ol-c: #fff; --sk-ol-w: .7rem; --sk-ol-drop: 0rem; }
.sk-pop .sk-ol::after { content: attr(data-t); position: absolute; left: 0; top: .3rem; z-index: -2; -webkit-text-stroke: .7rem var(--sk-ink); color: var(--sk-ink); opacity: .9; }
@keyframes sk-pop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; } 26% { transform: translate(-50%, -50%) scale(.95) rotate(-1deg); } 34% { transform: translate(-50%, -50%) scale(1) rotate(0); } 78% { transform: translate(-50%, calc(-50% - var(--rise, 3rem))) scale(1); opacity: 1; } 100% { transform: translate(-50%, calc(-50% - var(--rise, 3rem) * 1.3)) scale(.9); opacity: 0; } }

.sk-fly { position: absolute; transform: translate(-50%, -50%); font-size: 2.6rem; line-height: 1; text-shadow: 0 .2rem 0 rgba(34,48,92,.35); pointer-events: none; }

/* ---------- toast ---------- */
.sk-toast { position: absolute; left: 50%; top: 5.6rem; transform: translateX(-50%); padding: .7rem 1.4rem .75rem; background: var(--sk-ink); color: #fff; border-radius: 999px; font: 800 1.3rem/1.2 var(--sk-font); box-shadow: 0 .5rem 1rem rgba(20,40,90,.3); animation: sk-toast 2.2s ease forwards; white-space: nowrap; display: flex; gap: .5rem; align-items: center; }
@keyframes sk-toast { 0% { transform: translate(-50%, -1.5rem); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -.6rem); opacity: 0; } }

/* ---------- panels ---------- */
.sk-card { position: absolute; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 2rem; box-shadow: 0 .42rem 0 var(--sk-ink), 0 1.2rem 2.4rem rgba(20,40,90,.28); pointer-events: auto; }
.sk-dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(20,40,90,.18), rgba(20,40,90,.48)); pointer-events: auto; animation: sk-fade .3s ease; }
@keyframes sk-fade { from { opacity: 0; } }
.sk-in { animation: sk-card-in .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-card-in { from { transform: translateY(2.5rem) scale(.8); opacity: 0; } }
.sk-in-r { animation: sk-card-in-r .55s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes sk-card-in-r { from { transform: translateX(6rem) scale(.9); opacity: 0; } }
.sk-out { animation: sk-card-out .25s ease-in forwards; pointer-events: none !important; }
@keyframes sk-card-out { to { transform: translateY(1.5rem) scale(.9); opacity: 0; } }

/* ---------- title screen ---------- */
.sk-title-head { position: absolute; left: 2.4rem; top: 5.6rem; max-width: 34rem; pointer-events: none; animation: sk-card-in .7s cubic-bezier(.3,1.5,.5,1) both; }
.sk-brand { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .9rem .32rem .35rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1rem/1 var(--sk-font); letter-spacing: .06em; color: var(--sk-ink); }
.sk-brand i { width: 1.45rem; height: 1.45rem; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; background: radial-gradient(circle at 35% 30%, #8DB4FF, #3E7BFF 60%); border: .14rem solid var(--sk-ink); display: inline-block; }
.sk-title-text { margin-top: .7rem; font: 900 4.4rem/1.04 var(--sk-font); letter-spacing: -.01em; --sk-ol-w: .75rem; --sk-ol-drop: .42rem; }
.sk-title-text .sk-ol { color: #fff; }
.sk-title-text .sk-ol.sk-c2 { color: #FFE14D; }
.sk-title-sub { margin-top: .9rem; display: inline-block; padding: .5rem 1.1rem .55rem; border-radius: 1rem; background: rgba(255,255,255,.9); border: .18rem solid var(--sk-ink); box-shadow: 0 .22rem 0 var(--sk-ink); font: 800 1.35rem/1.3 var(--sk-font); }
.sk-titlescreen, .sk-resultscreen { position: absolute; inset: 0; pointer-events: none; }
.sk-title-right { position: absolute; right: 2.2rem; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; }
.sk-title-card { position: relative; width: 25.5rem; padding: 1.5rem 1.6rem 1.6rem; display: flex; flex-direction: column; gap: 1rem; }
.sk-title-card .sk-hello { font: 900 1.65rem/1.2 var(--sk-font); }
.sk-title-card .sk-hello b { color: var(--sk-blue-2); }
.sk-lbl { font: 800 1rem/1 var(--sk-font); color: var(--sk-ink-2); margin-bottom: .5rem; display: flex; justify-content: space-between; align-items: baseline; }
.sk-lbl em { font-style: normal; color: var(--sk-blue-2); font-weight: 900; }
.sk-bands { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.sk-band { position: relative; padding: .6rem .4rem .62rem; border-radius: 1.1rem; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #fff, #EEF3FC); box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; touch-action: manipulation; transition: transform .08s; }
.sk-band small { display: block; margin-top: .25rem; font: 800 .78rem/1 var(--sk-font); color: var(--sk-ink-2); }
.sk-band.sk-sel { background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; }
.sk-band.sk-sel small { color: #E3EDFF; }
.sk-band:active { transform: translateY(.15rem); box-shadow: 0 .05rem 0 var(--sk-ink); }
.sk-bandchip { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: 999px; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; font: 900 1.2rem/1 var(--sk-font); box-shadow: 0 .2rem 0 var(--sk-ink); align-self: flex-start; }
.sk-bandchip small { font: 800 .85rem/1 var(--sk-font); opacity: .9; }
.sk-dial { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0; height: 3.6rem; }
.sk-dial::before { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); }
.sk-dial .sk-fill { position: absolute; left: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(180deg, #FFE36B, #FFB21E); border: .16rem solid var(--sk-ink); transition: width .35s cubic-bezier(.3,1.4,.5,1); }
.sk-dial button { position: relative; width: 2.8rem; height: 2.8rem; border-radius: 50%; border: .18rem solid var(--sk-ink); background: #fff; font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; box-shadow: 0 .18rem 0 var(--sk-ink); transition: transform .25s cubic-bezier(.3,1.8,.5,1), background .2s; padding: 0; touch-action: manipulation; }
.sk-dial button.sk-past { background: linear-gradient(180deg, #FFE36B, #FFB21E); }
.sk-dial button.sk-sel { transform: scale(1.32); background: linear-gradient(180deg, #FFE36B, #FFAE14); z-index: 1; }
.sk-dial button.sk-sel::after { content: ""; position: absolute; inset: -.5rem; border-radius: 50%; border: .16rem dashed rgba(34,48,92,.45); animation: sk-spin 6s linear infinite; }
@keyframes sk-spin { to { transform: rotate(360deg); } }
.sk-hint { word-break: keep-all; display: flex; gap: .65rem; align-items: center; padding: .7rem .85rem; border-radius: 1.1rem; background: #FFF6D9; border: .16rem solid #F0D48A; font: 800 1.05rem/1.35 var(--sk-font); color: #6B4A12; min-height: 3.6rem; }
.sk-hint svg { width: 1.9rem; height: 1.9rem; flex: none; }
.sk-title-card .sk-btn { width: 100%; }
.sk-need { font: 800 .95rem/1.2 var(--sk-font); color: var(--sk-pink-2); text-align: center; margin-top: -.4rem; }

/* ---------- results ---------- */
.sk-resultscreen { display: flex; align-items: center; justify-content: center; }
.sk-resultscreen.sk-res-right { justify-content: flex-end; padding-right: 6%; }
.sk-resultscreen.sk-res-right .sk-dim { background: linear-gradient(90deg, rgba(20,40,90,0) 0%, rgba(20,40,90,.12) 35%, rgba(20,40,90,.45) 100%); }
.sk-res { position: relative; width: 32rem; padding: 3.1rem 1.8rem 1.6rem; text-align: center; }
.sk-res.sk-in { animation: sk-res-in .55s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-res-in { from { transform: translateY(3rem) scale(.75); opacity: 0; } }
.sk-ribbon { position: absolute; z-index: 3; left: 50%; top: -1.9rem; transform: translateX(-50%); padding: .7rem 2.6rem .8rem; background: linear-gradient(180deg, #FF8EC0, #F0558F); border: var(--sk-line) solid var(--sk-ink); border-radius: 1.2rem; box-shadow: 0 .3rem 0 var(--sk-ink); white-space: nowrap; font: 900 2.1rem/1 var(--sk-font); }
.sk-ribbon .sk-ol { color: #fff; --sk-ol-w: .45rem; --sk-ol-drop: .2rem; }
.sk-res-stars { display: flex; justify-content: center; align-items: flex-end; gap: .2rem; height: 7.2rem; margin: .2rem 0 .3rem; }
.sk-res-stars svg { width: 5.6rem; height: 5.6rem; opacity: 0; }
.sk-res-stars svg:nth-child(2) { width: 7rem; height: 7rem; margin-bottom: .9rem; }
.sk-res-stars svg.sk-show { animation: sk-star-in .55s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes sk-star-in { 0% { opacity: 0; transform: scale(2.4) rotate(-40deg); } 60% { opacity: 1; transform: scale(.88) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.sk-res-sub { font: 800 1.2rem/1.35 var(--sk-font); color: var(--sk-ink-2); min-height: 1.6rem; word-break: keep-all; overflow-wrap: break-word; white-space: pre-line; text-wrap: pretty; }
/* the big moment: a cheering 2D Haru leans out of the card's top-left corner (beside the stars) */

<!--
  MY SIA · 바다 탐험 잠수함 / Deep-Sea Submarine
  Steer a little submarine (drag), dive with the depth lever through the sunlit, twilight and midnight zones, scan a creature, read its card, answer.
  URL: ?band=K|E1|E2|E3  &age=5..13  &level=1-5  &lang=ko|en  &name=시아
  Test hooks: window.__game  (phase(), task, answer, solution(), wrongTarget(), preview(), depth(), setDepth(), creatures(), perf() …)

<script data-inline="ocean.js">
/* Deep-Sea Submarine — the ocean: a water column from the sunlit surface (y 0) to the midnight floor (y -60).
 * The submarine sits at x 0, z 0 and only turns (yaw) and dives (y); creatures swim around it.
 * Layout: a coral reef slope in front (-Z) in the sunlit zone, a rock wall below it in the twilight zone, the sea floor
 * at y -60 with vents and a shipwreck in the midnight zone. Light, fog and particles change with the depth.
 * Exposes window.DS: merge(), TOY, glow(), zones, metres(y), yOfMetres(m), zoneOf(y), buildWorld(st), buildSub(st, haru).

  // ---------------------------------------------------------------- zones + depth
  // world y → metres shown to the child: sunlit 0–200 m (y 0..-20; the reef floor at y -13..-17 reads 30–40 m, then it steepens to 200 m),
  // twilight 200–1000 m (y -20..-40), midnight 1000–2000 m (y -40..-60)

      UI.text(UI.el('div', null, null, dex), { ko: '바다 도감 ' + have + ' / ' + all.length, en: 'Sea book ' + have + ' / ' + all.length });
      var row = UI.el('div', 'ds-row', null, dex);
      all.forEach(function (sp) { var got = S.dex.indexOf(sp) >= 0; UI.el('span', got && (S.newDex || []).indexOf(sp) >= 0 ? 'ds-new' : null, got && DS.icons[sp] ? '<img alt="" src="' + DS.icons[sp] + '">' : '?', row); });
      var nx = UI.el('div', 'ds-next', null, book);
      UI.button({ ko: '좋아!', en: 'Great!' }, { color: 'green', big: true, icon: 'check', id: 'ds-log-next', parent: nx, onTap: function () { wrap2.remove(); resolve(); } });
      K.setState('log');
      say({ ko: '와, 미션 다섯 개를 모두 해냈어! 멋진 탐험이었어.', en: 'Wow, you did all 5 missions! What a dive.' }, { hold: 0.2, bubble: false });
      K.expose({ task: { step: 'log' } });
    });
  }
  async function finish(token) {
    S.phase = 'result';
    var stars = starsFor(S.mistakes);
    var hint = DS.content.hint(L.band, L.level);
    var res = await K.learn.finish({ stars: stars, align: 'right', sub: { ko: '스캔 5번! ' + hint.ko, en: '5 scans! ' + hint.en } });
    if (S.token !== token) return;
    if (res.action === 'again') { await UI.wipe(function () { toTitleCam(); }); play(); }
    else toTitle();
  }
  function toTitleCam() { CAM.mode = 'title'; setDepth(-6, true); CAM.vyaw = 0; CAM.nudge = CAM.nudgeT = 0; sub.rotation.x = 0; sub.rotation.z = 0; }
  function toTitle() {
    S.token++; S.phase = 'title'; S.look = false; S.scanWait = null; showPlayUI(false); UI.closePanel(true); UI.hideSay(true); dropIdCard(); hideExtra(); card.classList.remove('ds-talk');
    if (S.chip) { S.chip.remove(); S.chip = null; }
    K.sound.music(false);
    toTitleCam(); st.sway = 0.03; haru.stop(); haru.set('idle');
    UI.topBar({ close: true, sound: true, lang: true });
    UI.title({ title: { ko: '바다 탐험\n잠수함', en: 'Deep-Sea\nSubmarine' }, subtitle: { ko: '잠수함을 타고 바다 친구를 스캔해요', en: 'Dive, scan sea creatures, learn!' }, hint: function (b, l) { return tr(DS.content.hint(b, l)); }, onStart: function () { play(); } });
    S.phase = 'title';
  }

  // ---------------------------------------------------------------- test hooks
  function aimYaw(p) { var rho = Math.hypot(p.x, p.z); return Math.atan2(p.x, -p.z) - Math.asin(clamp(CAM.SIDE / Math.max(rho, 0.01), -1, 1)); }
  function solution() {
    var m = S.m; if (!m) return null;
    var cand = DS.sea.list.filter(function (c) { return m.accept(c.sp, c); });
    if (!cand.length) return null;
    var best = null, bs = 1e9;
    cand.forEach(function (c) {
      var ctr = c.center(), dyaw = Math.abs(wrap(aimYaw(ctr) - CAM.yaw)), dy = Math.abs(ctr.y - CAM.y);
      var sc = dyaw * 2 + dy * 0.3 + (m.school && c.leader ? 50 : 0); if (sc < bs) { bs = sc; best = c; }
    });
    var ctr2 = best.center().addScaledVector(best.vel, 0.3); if (m.school) { var sch = DS.sea.list.filter(function (c) { return c.group === best.group; }); ctr2.set(0, 0, 0); sch.forEach(function (c) { ctr2.add(c.center()); }); ctr2.multiplyScalar(1 / sch.length); }
    return { id: best.id, sp: best.sp, variant: best.variant, zone: best.zone, center: ctr2, yaw: aimYaw(ctr2), dy: ctr2.y - CAM.yT, c: best };
  }
  K.expose({
    phase: function () { return S.phase; },
    zoneY: DS.ZONE_Y, zones: DS.ZONES,
    yaw: function () { return CAM.yaw; }, depth: function () { return { y: CAM.y, target: CAM.yT, metres: DS.metres(CAM.y), zone: DS.zoneOf(CAM.y) }; }, radPerPx: radPerPx,
    solution: function () { var s = solution(); if (!s) return null; var p = st.screenOf(s.center), rr = retRect(); return { id: s.id, sp: s.sp, variant: s.variant, zone: s.zone, x: Math.round(p.x), y: Math.round(p.y), visible: p.visible, dyaw: wrap(s.yaw - CAM.yaw), dy: Math.round(s.dy * 100) / 100, dist: Math.round(Math.hypot(p.x - rr.cx, p.y - rr.cy)), targetY: s.center.y }; },
    wrongTarget: function () { var m = S.m; if (!m) return null; var cur = DS.zoneOf(CAM.y); var l = DS.sea.list.filter(function (c) { return !m.accept(c.sp, c) && !(m.ambiguous && m.ambiguous(c.sp, c.variant)) && !c.leader; }); l.sort(function (p, q) { return (p.zone === cur ? 0 : 1) - (q.zone === cur ? 0 : 1) || Math.abs(p.center().y - CAM.y) - Math.abs(q.center().y - CAM.y); }); var c = l[0]; if (!c) return null; var ctr = c.center(); return { id: c.id, sp: c.sp, variant: c.variant, zone: c.zone, dyaw: wrap(aimYaw(ctr) - CAM.yaw), dy: ctr.y - CAM.yT, targetY: ctr.y }; },
    creatures: function () { var rr = retRect(); return DS.sea.list.map(function (c) { var s = st.screenOf(c.center()); return { id: c.id, sp: c.sp, variant: c.variant, zone: c.zone, group: c.group, x: Math.round(s.x), y: Math.round(s.y), visible: s.visible, inCircle: s.visible && Math.hypot(s.x - rr.cx, s.y - rr.cy) < rr.r }; }); },
    preview: function () { if (!S.m) return null; var sh = analyze(), v = judge(S.m, sh); return { ok: v.ok, why: v.why, main: v.main, count: v.count, missing: v.missing || 0 }; },
    reticle: function () { return retRect(); },
    occluders: function () { st.camera.updateMatrixWorld(); tmpR.setFromMatrixColumn(st.camera.matrixWorld, 0); return subShapes().map(function (o) { return { ax: Math.round(o.ax), ay: Math.round(o.ay), bx: Math.round(o.bx), by: Math.round(o.by), r: Math.round(o.r), d: +o.d.toFixed(2) }; }); },
    scanList: function () { var sh = analyze(); return sh.list.filter(function (x) { return x.inside || x.blocked; }).map(function (x) { return { sp: x.c.sp, x: Math.round(x.x), y: Math.round(x.y), inside: x.inside, blocked: x.blocked, small: x.small }; }); },
    leverRect: function () { var r = track.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, yMin: Y_MIN, yMax: Y_MAX }; },
    caption: function () { var c = document.querySelector('#ds-idcard .ds-cap'); return c ? c.textContent : null; },
    lastScan: function () { return S.lastScan || null; }, mistakes: function () { return S.mistakes; }, logSize: function () { return S.log.length; },
    perf: function () { var i = st.renderer.info; return { calls: i.render.calls, tris: i.render.triangles, geos: i.memory.geometries, fps: st.fps, creatures: DS.sea.list.length }; },
    icons: function () { return Object.keys(DS.icons).length; },
    setDepth: function (y) { setDepth(y, true); return CAM.y; },
    debugYaw: function (yaw) { CAM.yaw = yaw; CAM.vyaw = 0; return CAM.yaw; },
    debugCam: function (pos, look) { CAM.mode = 'dbg'; st.camTo(pos, look, 0); return true; },
    debugQuestion: function (q, img) { card.classList.add('ds-hide'); scan.classList.add('ds-off'); UI.hideSay(true); showIdCard(img || '', 'dolphin', null, true); S.token++; askQuestion(q, S.token); return true; },
    bubbleRect: function () { var b = UI.bubbleEl(); if (!b) return null; var r = b.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, mode: b.dataset.mode }; },
    round: function () { return S.round ? S.round.missions.map(function (m) { return { type: m.type, text: tr(m.text), zone: m.zone, knowledge: !!m.knowledge, school: !!m.school }; }) : null; },
  });

  toTitle();
  syncLever();
  K.ready();
})();
