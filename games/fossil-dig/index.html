<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7E4E2B">
<title>공룡 화석 발굴</title>
<style>
:root{--ink:#1C2333;--bone:#F6EEDC;--blue:#2F6BFF;--yellow:#F2C14E;--orange:#E88F4D;--green:#3F7D5B;--red:#DB5F52;--sand:#E9C07C;--wood:#B98B5E;--dirt:#7E4E2B;--sky:#BDE7FF}
html,body{margin:0;height:100%;background:#5B3A20;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:1024px;height:768px;transform-origin:center center;overflow:hidden;background:var(--sky);touch-action:none}
canvas#game{position:absolute;left:0;top:0;width:1024px;height:768px}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:none;display:none}
.screen.on{display:block}
.screen > *{pointer-events:auto}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;padding:0}
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:220px;height:74px;padding:0 34px;border-radius:40px;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(#8FC08A,#3F7D5B);box-shadow:0 6px 0 #2C5A40,0 12px 22px rgba(0,0,0,.25);border:4px solid #fff;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #2C5A40,0 6px 12px rgba(0,0,0,.25)}
.big[disabled]{opacity:.45;filter:grayscale(.7);cursor:default}
.big.blue{background:linear-gradient(#6B9BFF,#2F6BFF);box-shadow:0 6px 0 #1E48B0,0 12px 22px rgba(0,0,0,.25)}
.big.blue:active{box-shadow:0 2px 0 #1E48B0,0 6px 12px rgba(0,0,0,.25)}
.big.orange{background:linear-gradient(#F2B48B,#E88F4D);box-shadow:0 6px 0 #B5652A,0 12px 22px rgba(0,0,0,.25)}
.big.orange:active{box-shadow:0 2px 0 #B5652A,0 6px 12px rgba(0,0,0,.25)}
.rbtn{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--ink);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.rbtn:active{transform:translateY(3px);box-shadow:none}
#btnClose,#btnClose2{left:18px;top:18px}
#btnSound{right:18px;top:18px;font-size:26px}
#btnLang{right:96px;top:18px;font-size:20px;letter-spacing:1px}
/* title */
#logo{position:absolute;left:0;right:0;top:10px;pointer-events:none;text-align:center;font-size:60px;font-weight:900;color:#fff;letter-spacing:-1px;-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink),0 10px 24px rgba(0,0,0,.25);animation:bob 3s ease-in-out infinite}
#logo small{display:block;font-size:22px;-webkit-text-stroke:0;text-shadow:none;color:var(--ink);font-weight:700;margin-top:4px;letter-spacing:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#bandRow{position:absolute;left:0;right:0;top:126px;display:flex;justify-content:center;align-items:center;gap:12px}
#bandRow span{font-size:22px;font-weight:900;margin-right:2px}
#bandRow button{height:54px;min-width:112px;padding:0 18px;border-radius:28px;background:#fff;border:4px solid var(--ink);font-size:23px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#bandRow button.on{background:var(--blue);color:#fff;transform:scale(1.08)}
#bandChip{position:absolute;left:50%;top:130px;transform:translateX(-50%);height:46px;padding:0 22px;border-radius:24px;background:var(--yellow);border:4px solid var(--ink);font-size:22px;font-weight:900;display:flex;align-items:center;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#bandNote{position:absolute;left:0;right:0;top:182px;text-align:center;font-size:15px;font-weight:800;color:#1E48B0;word-break:keep-all}
#pick{position:absolute;left:0;right:0;top:200px;text-align:center;font-size:24px;font-weight:800}
#dinos{position:absolute;left:0;right:0;top:244px;display:flex;justify-content:center;gap:28px}
.dino{width:230px;height:222px;box-sizing:border-box;border-radius:28px;background:#fff;border:5px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9px;transition:transform .15s;position:relative}
.dino canvas{width:200px;height:130px}
.dino b{font-size:24px;margin-top:4px}
.dino .stars{margin-top:4px;font-size:26px;letter-spacing:2px;color:#D9C9A6}
.dino .stars i{font-style:normal;color:var(--yellow);text-shadow:0 0 0 var(--ink)}
.dino.sel{transform:scale(1.06) translateY(-6px);border-color:var(--blue);box-shadow:0 0 0 6px rgba(47,107,255,.25),0 10px 0 rgba(0,0,0,.18)}
.dino.sel::after{content:"✓";position:absolute;right:-14px;top:-14px;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;border:4px solid #fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center}
#btnStart{position:absolute;right:44px;top:650px}
#levels{position:absolute;left:0;right:0;top:480px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px;font-weight:800}
#levels span{margin-right:6px}
#levels button{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid var(--ink);font-size:26px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#levels button.on{background:var(--yellow);transform:scale(1.12)}
#lvlHint{position:absolute;left:50%;top:548px;transform:translateX(-50%);width:max-content;max-width:820px;box-sizing:border-box;line-height:1.35;padding:5px 16px;border-radius:18px;background:rgba(255,255,255,.82);text-align:center;font-size:17px;font-weight:800;color:#3A4358}
#lvlHint:empty{display:none}
#lvlHint.solo{top:482px}
#lvlBadge{position:absolute;left:96px;top:14px;min-height:56px;box-sizing:border-box;padding:3px 16px;border-radius:22px;background:var(--yellow);border:4px solid var(--ink);display:flex;flex-direction:column;justify-content:center;line-height:1.12;white-space:nowrap}
#lvlBadge small{font-size:15px;font-weight:800}
#lvlBadge b{font-size:22px;font-weight:900}
#lvlBadge i{font-style:normal;font-size:12px;font-weight:800;color:#7A4B00}
#feel{margin:4px 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#feel b{font-size:24px}
#feel .faces{display:flex;gap:12px}
#feel .faces button{width:150px;height:66px;border-radius:20px;background:#F6F8FC;border:4px solid var(--ink);font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
#feel .faces button i{font-style:normal;font-size:30px}
#feel .faces button.on{background:#FFF3C4;border-color:var(--orange);transform:scale(1.06)}
#feelMsg{font-size:20px;font-weight:800;color:var(--blue);min-height:26px;max-width:540px;line-height:1.35}
#s-title .bubble{max-width:360px}
#s-assemble .haru{top:10px;bottom:auto;left:92px;align-items:center}
#s-assemble .face{width:78px;height:78px}
#s-assemble .bubble{margin-bottom:0;max-width:720px;font-size:21px;padding:8px 16px}
/* haru */
.haru{position:absolute;left:22px;bottom:14px;display:flex;align-items:flex-end;gap:10px}
.haru .face{width:118px;height:118px;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.haru .face svg{width:100%;height:100%}
.bubble{position:relative;max-width:520px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:12px 18px;font-size:22px;font-weight:700;line-height:1.35;margin-bottom:26px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bubble::before{content:"";position:absolute;left:-18px;bottom:16px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-12px;bottom:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
/* hud */
#slots{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,255,255,.85);border:4px solid var(--ink);border-radius:40px;padding:6px 14px}
.slot{width:72px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#EEE6D3}
.slot canvas{width:64px;height:48px}
.slot.got{background:#FFF3C4;animation:slotpop .4s}
.slot.box{background:#FFF1EE;border:3px dashed var(--red);box-sizing:border-box;flex-direction:column;font-size:12px;font-weight:900;color:#A33A2F;line-height:1.05;text-align:center}
.slot.box b{font-size:18px}
@keyframes slotpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
#shovel{position:absolute;right:112px;top:20px;height:56px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:4px solid var(--ink);border-radius:32px;padding:0 18px 0 10px;font-size:28px;font-weight:900}
#shovel svg{width:34px;height:34px}
#shovel.low b{color:var(--red)}
#btnDetect{position:absolute;right:22px;bottom:22px;height:66px;display:flex;align-items:center;gap:8px;background:linear-gradient(#fff,#E8EEFF);border:4px solid var(--ink);border-radius:36px;padding:0 20px 0 12px;font-size:24px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#btnDetect:active{transform:translateY(3px);box-shadow:none}
#btnDetect svg{width:36px;height:36px}
#btnDetect[disabled]{opacity:.45}
/* popups */
.dim{position:absolute;inset:0;background:rgba(28,35,51,.45)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 rgba(0,0,0,.2);text-align:center;animation:cardin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#foundCard{width:560px;padding:22px 28px 26px}
#foundCard canvas{display:block;margin:0 auto;width:380px;height:220px}
#foundCard h2{margin:6px 0 4px;font-size:40px}
#foundCard p{margin:0 0 16px;font-size:22px;font-weight:700;color:#5A6377;line-height:1.4}
#foundCard.wide{width:640px}
#foundCard.wide h2{font-size:34px}
#foundCard.wide p{font-size:20px}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:20px;padding:4px 16px;font-size:20px;font-weight:800}
.tag.red{background:var(--red)}
#resultCard{width:720px;padding:22px 30px 28px}
#resultCard h2{margin:0 0 8px;font-size:38px}
#resultRow{display:flex;justify-content:center;gap:10px;margin:10px 0 18px;flex-wrap:wrap}
#resultRow div{width:104px;height:84px;background:#FFF3C4;border:3px solid var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center;animation:cardin .4s backwards}
#resultRow div.decoy{background:#FFF1EE;border:3px dashed var(--red)}
#resultRow canvas{width:92px;height:68px}
#dinoCard{width:760px;padding:22px 30px 26px;text-align:left;box-sizing:border-box}
#dinoCard .top{display:flex;gap:20px;align-items:center}
#cardCv{width:300px;height:180px;flex:none}
#dinoCard h2{margin:0 0 6px;font-size:40px}
#dinoCard ul{margin:0;padding-left:22px;font-size:21px;font-weight:700;line-height:1.5;color:#3A4358}
#quiz{margin-top:14px;border-top:3px dashed #DDE3EC;padding-top:12px}
#quizQ{font-size:26px;font-weight:900;margin:0 0 12px;display:flex;align-items:center;gap:10px;line-height:1.3}
#quizTip{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:18px;font-weight:800;color:#1E48B0}
#quizTip .mini{width:40px;height:40px;flex:none}
#quizTip .mini svg{width:100%;height:100%}
.spk{width:40px;height:40px;border-radius:50%;background:#EEF1F6;border:3px solid var(--ink);font-size:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#quizBody{display:flex;gap:14px;align-items:center}
#choices{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#quizPic{width:280px;height:150px;flex:none;border-radius:16px;background:#F6F8FC;border:3px solid #DDE3EC}
#quizPic.graph{width:320px;height:190px}
#quizTip{cursor:pointer}
#btnSpeakF{position:absolute;right:18px;top:18px}
#btnGate{position:absolute;left:18px;top:18px;height:46px;padding:0 18px;border-radius:24px;background:#fff;border:3px solid var(--ink);font-size:17px;font-weight:800;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.15);touch-action:none}
#btnGate b{position:relative}
#gateFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#FFE08A}
#btnGate.holding #gateFill{width:100%;transition:width 2s linear}
#gateCard{width:780px;padding:22px 30px 26px;box-sizing:border-box}
#gateCard h2{margin:0 0 6px;font-size:34px}
#gateCard .grow{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
#gateCard .grow > b{font-size:21px;min-width:110px;text-align:right}
#gateCard .grow > div{display:flex;gap:8px;flex-wrap:wrap}
#gateCard .grow button{height:52px;padding:0 14px;border-radius:26px;background:#fff;border:4px solid var(--ink);font-size:19px;font-weight:900}
#gateCard .grow button.on{background:var(--blue);color:#fff}
#gateCard p{font-size:17px;font-weight:700;color:#5A6377;margin:6px 0 14px;line-height:1.4;word-break:keep-all}
#gateCard p#gateAsk{font-size:21px;color:var(--ink);margin:8px 0 10px}
#gateYear{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
#gateYear span{width:50px;height:58px;box-sizing:border-box;border-radius:12px;border:3px solid var(--ink);background:#F6F8FC;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
#gatePad{display:grid;grid-template-columns:repeat(6,66px);gap:8px;justify-content:center;margin:0 0 16px}
#gatePad button{height:54px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:24px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#gatePad button:active{transform:translateY(2px);box-shadow:none}
#choices button{min-height:64px;border-radius:18px;background:#F6F8FC;border:4px solid var(--ink);font-size:23px;font-weight:800;text-align:left;padding:6px 18px;display:flex;align-items:center;gap:12px;line-height:1.2}
#choices button i{font-style:normal;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#choices button.ok{background:#DDF3DE;border-color:var(--green)}
#choices button.ok i{background:var(--green)}
#choices button.no{background:#FDE7E4;border-color:var(--red);opacity:.7}
#choices button[disabled]{cursor:default}
#quizE{margin:12px 0 0;font-size:21px;font-weight:700;color:#3F7D5B;min-height:30px;line-height:1.35}
#dinoCard .act{text-align:center;margin-top:10px}
#dinoCard.wide{width:920px;padding:20px 28px 22px}
#dinoCard.wide #cardCv{width:250px;height:150px}
#dinoCard.wide h2{font-size:34px;margin-bottom:4px}
#dinoCard.wide ul{font-size:18px;line-height:1.42}
#dinoCard.wide #quizQ{font-size:22px}
#dinoCard.wide #choices button{font-size:19px;min-height:56px;padding:5px 14px}
#dinoCard.wide #quizE{font-size:18px;min-height:50px}
#dinoCard.dense{padding:14px 24px 16px}
#dinoCard.dense ul{font-size:16px;line-height:1.35}
#dinoCard.dense #quiz{margin-top:8px;padding-top:8px}
#dinoCard.dense #quizQ{font-size:20px;margin-bottom:8px}
#dinoCard.dense #choices{gap:8px}
#dinoCard.dense #choices button{font-size:17px;min-height:48px}
#dinoCard.dense #quizE{font-size:16px;margin-top:8px;min-height:44px}
#dinoCard.dense .big{height:62px;font-size:26px}
#doneCard{width:640px;padding:26px 30px 30px}
#doneCard h2{margin:0;font-size:44px}
#bigStars{font-size:84px;letter-spacing:6px;margin:6px 0 10px;color:#D9C9A6}
#bigStars i{font-style:normal;display:inline-block;color:#D9C9A6;transform:scale(0)}
#bigStars i.on{color:var(--yellow);-webkit-text-stroke:2px var(--ink);animation:star .5s cubic-bezier(.2,1.6,.4,1) forwards}
#bigStars i.off{animation:star .4s forwards}
@keyframes star{to{transform:scale(1)}}
#doneCard p{font-size:24px;font-weight:800;color:#3A4358;margin:0 0 6px}
#doneCard p small{display:block;font-size:17px;font-weight:700;color:#8A93A6;margin:6px 0 14px}
#doneCard .row{display:flex;gap:16px;justify-content:center}
.hidden{display:none!important}
.invis{visibility:hidden}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:26px;font-weight:900;padding:10px 26px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
/* sound menu (🔊 on the title screen) and the parent voice hint */
#voiceMenu.hidden,#voiceHint.hidden,#vmVoiceRow.hidden{display:none!important}
#voiceMenu{position:absolute;inset:0;z-index:5}
#vmCard{position:absolute;right:18px;top:96px;width:400px;background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 rgba(0,0,0,.2);padding:16px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;text-align:left;animation:vmin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes vmin{0%{transform:translateX(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
#vmCard > b{font-size:19px;color:#5A6377}
.vmb{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border-radius:18px;border:4px solid var(--ink);background:linear-gradient(#fff,#EEF3FC);box-shadow:0 4px 0 var(--ink);font-size:22px;font-weight:900;color:var(--ink);text-align:left;cursor:pointer}
.vmb span{flex:1;word-break:keep-all}.vmb.on{background:linear-gradient(#FFE36B,#FFC22E)}.vmb.sm{font-size:19px;padding:10px 14px}.vmb.cl{background:#fff;color:#5A6377}
.vmb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.vmrow{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:#5A6377}
.vmrow select{flex:1;min-width:0;font-size:17px;font-weight:800;border:4px solid var(--ink);border-radius:14px;padding:8px 10px;background:#F2F6FD;color:var(--ink)}
.vmnew{display:inline-block;width:10px;height:10px;border-radius:50%;background:#FF5D5D;margin-left:8px;vertical-align:middle;box-shadow:0 0 0 2px #fff}
#voiceHint{position:absolute;inset:0;z-index:6}
#vhCard{width:660px;padding:22px 28px 24px;box-sizing:border-box;text-align:left;font-size:19px;font-weight:700;line-height:1.5;word-break:keep-all}
#vhCard #vhWho{display:inline-block;padding:4px 12px;border-radius:999px;background:#EEF3FC;border:3px solid var(--ink);font-size:15px;font-weight:900;color:#5A6377}
#vhCard h2{margin:8px 0 6px;font-size:32px}
#vhCard #vhNow{margin:0 0 8px;padding:8px 12px;border-radius:14px;background:#FFF6D9;border:3px solid #F0D48A;color:#6B4A12;font-size:18px}
#vhCard p{margin:6px 0}#vhCard ol{margin:6px 0 6px 26px;padding:0;font-weight:800}#vhCard li{margin:4px 0}
#vhCard small{display:block;color:#5A6377;font-size:16px;margin-top:6px;line-height:1.45}
#vhCard .big{margin-top:14px;width:100%}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="game"></canvas>
<div id="ui">
  <div id="s-title" class="screen">
    <button class="rbtn" id="btnSound" title="소리">🔊</button>
    <button class="rbtn" id="btnLang">EN</button>
    <div id="voiceMenu" class="hidden"><div id="vmCard">
      <b id="vmTitle">소리</b>
      <button id="vmMute" class="vmb on">🔊<span>소리 켜짐</span></button>
      <div id="vmVoiceRow" class="vmrow hidden"><span id="vmVoiceL">목소리</span><select id="vmVoice"></select></div>
      <button id="vmSample" class="vmb sm">▶<span>들어보기</span></button>
      <button id="vmHint" class="vmb sm">💡<span>더 자연스러운 목소리 받기</span></button>

  [{ko:{q:'발굴단이 티라노사우루스 이빨 화석을 오전에 27개, 오후에 15개 찾았어. 모두 몇 개일까?',c:['32개','42개','43개','312개'],a:1,e:'일의 자리 7 + 5 = 12. 10은 십의 자리로 올려. 20 + 10 + 10 = 40, 그래서 42개야.'},

  [{ko:{q:'티라노사우루스는 약 12 m, 트리케라톱스는 약 9 m, 스테고사우루스는 약 9 m야. 세 공룡이 한 줄로 서면 모두 몇 m일까?',c:['30 m','21 m','39 m','29 m'],a:0,e:'12 + 9 = 21, 21 + 9 = 30. 모두 30 m야.'},

  [{ko:{q:'박물관 가게에서 티라노사우루스 열쇠고리가 650원이야. 1,000원을 내면 거스름돈은 얼마일까?',c:['250원','350원','450원','300원'],a:1,e:'650원에서 50원을 더하면 700원, 300원을 더하면 1,000원. 50 + 300 = 350원이야.'},
    en:{q:'A T. rex key ring costs 650 won. You pay with 1,000 won. How much change do you get?',c:['250 won','350 won','450 won','300 won'],a:1,e:'Count up from 650: 50 more makes 700, then 300 more makes 1,000. 50 + 300 = 350 won.'}},

 tri:[

  [{ko:{q:'발굴단이 트리케라톱스 뼈 조각을 머리 쪽에서 186개, 몸 쪽에서 247개 찾았어. 모두 몇 조각일까?',c:['433조각','323조각','533조각','423조각'],a:0,e:'일의 자리 6 + 7 = 13, 십의 자리 8 + 4 + 1 = 13, 백의 자리 1 + 2 + 1 = 4. 모두 433조각이야.'},

   {ko:{q:'트리케라톱스 눈 위 뿔은 1 m 가까이 자랐어. 96 cm 뿔 화석과 87 cm 뿔 화석을 이으면 모두 몇 cm일까?',c:['173 cm','183 cm','193 cm','9 cm'],a:1,e:'96 + 4 = 100, 87 − 4 = 83. 100 + 83 = 183 cm, 1 m 83 cm야.'},

  [{ko:{q:'9시 40분에 티라노사우루스 머리뼈를 파기 시작해서 1시간 35분 뒤에 다 꺼냈어. 몇 시 몇 분이었을까?',c:['10시 15분','11시 5분','11시 15분','12시 15분'],a:2,e:'9시 40분 + 1시간 = 10시 40분. 20분 뒤 11시, 15분 더 가면 11시 15분이야.'},

  [{ko:{q:'막대그래프는 발굴단이 찾은 뼈 화석 수야. 눈금 한 칸은 5개야. 티라노사우루스 뼈는 트리케라톱스 뼈보다 몇 개 더 많을까?',c:['75개','3개','5개','15개'],a:3,e:'티라노사우루스 9칸, 트리케라톱스 6칸. 3칸 차이고, 한 칸이 5개니까 3 × 5 = 15개야.'},
    en:{q:'The bar graph shows how many bone fossils the team found. Each step on the scale is 5 bones. How many more T. rex bones than Triceratops bones were found?',c:['75','3','5','15'],a:3,e:'T. rex is 9 steps and Triceratops 6 steps: 3 steps apart. 3 × 5 = 15.'},pic:{graph:{step:5,bars:[['trex',45],['tri',30],['steg',35]]}}},
   {ko:{q:'티라노사우루스 이빨 모형이 한 개 850원이야. 3개를 사고 10,000원을 내면 거스름돈은 얼마일까?',c:['2,550원','7,450원','7,550원','8,450원'],a:1,e:'850 × 3 = 2,550원. 10,000 − 2,550 = 7,450원이야.'},
