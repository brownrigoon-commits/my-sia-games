<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>뜰까 가라앉을까 실험실 · MY SIA</title>
<style id="sia-kit-css">
/* MY SIA game kit — overlay UI. 1rem = 16 design px on a 1024x768 stage (kit.js scales the root font size). */
:root {
  --sk-ink: #22305C;
  --sk-ink-2: #44507E;
  --sk-paper: #FFFFFF;
  --sk-cream: #FFF7E8;
  --sk-blue: #4A86FF;  --sk-blue-2: #2F64E8;
  --sk-green: #63D85A; --sk-green-2: #2EA94A;
  --sk-yellow: #FFD23F; --sk-yellow-2: #F5A91A;
  --sk-pink: #FF74AE;  --sk-pink-2: #E4488A;
  --sk-orange: #FF9442; --sk-orange-2: #E86D1E;
  --sk-purple: #9673FF; --sk-purple-2: #6C4BE6;
  --sk-sky: #6FD0FF;   --sk-sky-2: #2EA3EC;
  --sk-red: #FF5C57;
  --sk-gold: #FFC83A;
  --sk-line: 0.22rem;
  --sk-font: "Apple SD Gothic Neo", "AppleSDGothicNeo-Heavy", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE9FF; overscroll-behavior: none; }
body { font-family: var(--sk-font); color: var(--sk-ink); -webkit-text-size-adjust: 100%; position: fixed; inset: 0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#sk-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* boot screen (pure CSS, visible until kit.js adds .sk-ready) */
body:not(.sk-ready)::before { content: ""; position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle at 50% 46%, #4A86FF 0 3.4rem, transparent 3.5rem), linear-gradient(180deg, #8FD8FF, #DDF6FF); animation: sk-boot 0.9s ease-in-out infinite alternate; }
body:not(.sk-ready)::after { content: "MY SIA"; position: fixed; left: 0; right: 0; top: 62%; text-align: center; z-index: 100; font: 900 2rem var(--sk-font); color: #fff; letter-spacing: .1em; text-shadow: 0 .18rem 0 var(--sk-ink); }
@keyframes sk-boot { from { background-position: 0 0, 0 0; } to { background-position: 0 -1.2rem, 0 0; } }
.sk-error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 200; background: linear-gradient(180deg, #8FD8FF, #DDF6FF); font: 800 1.6rem/1.5 var(--sk-font); color: var(--sk-ink); padding: 2rem; }

/* ---------- layers ---------- */
#sk-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: var(--sk-font);
  /* Korean line breaking: break between words, never inside one (자업자 / 득); a word too long for its box still wraps */
  word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
#sk-ui > div { position: absolute; inset: 0; pointer-events: none; }
#sk-ui .sk-hit, #sk-ui button { pointer-events: auto; }
.sk-hide { display: none !important; }

/* ---------- outlined chunky text ---------- */
.sk-ol { position: relative; display: inline-block; z-index: 0; color: #fff; }
.sk-ol::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; -webkit-text-stroke: var(--sk-ol-w, .55rem) var(--sk-ol-c, var(--sk-ink)); color: var(--sk-ol-c, var(--sk-ink)); text-shadow: 0 var(--sk-ol-drop, .3rem) 0 var(--sk-ol-c, var(--sk-ink)); }

/* ---------- buttons ---------- */
.sk-btn { --c1: var(--sk-green); --c2: var(--sk-green-2); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  font: 800 1.55rem/1 var(--sk-font); color: #fff; padding: .78rem 1.7rem .86rem; min-height: 3.6rem; border-radius: 999px; cursor: pointer;
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: inset 0 -.32rem 0 rgba(0,0,0,.13), 0 .34rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.22);
  text-shadow: 0 .12rem 0 rgba(0,0,0,.22); transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; outline: none; }
.sk-btn::before { content: ""; position: absolute; left: 10%; right: 10%; top: .22rem; height: 40%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.08)); pointer-events: none; }
.sk-btn > * { position: relative; }
.sk-btn svg { width: 1.5em; height: 1.5em; flex: none; }
.sk-btn:active, .sk-btn.sk-press { transform: translateY(.26rem); box-shadow: inset 0 -.2rem 0 rgba(0,0,0,.13), 0 .08rem 0 var(--sk-ink), 0 .3rem .6rem rgba(20,40,90,.2); }
.sk-btn[disabled], .sk-btn.sk-off { --c1: #D6DCE6; --c2: #AEB7C6; opacity: .8; }
.sk-btn.sk-blue { --c1: var(--sk-blue); --c2: var(--sk-blue-2); }
.sk-btn.sk-yellow { --c1: var(--sk-yellow); --c2: var(--sk-yellow-2); color: var(--sk-ink); text-shadow: 0 .1rem 0 rgba(255,255,255,.5); }
.sk-btn.sk-pink { --c1: var(--sk-pink); --c2: var(--sk-pink-2); }
.sk-btn.sk-orange { --c1: var(--sk-orange); --c2: var(--sk-orange-2); }
.sk-btn.sk-purple { --c1: var(--sk-purple); --c2: var(--sk-purple-2); }
.sk-btn.sk-sky { --c1: var(--sk-sky); --c2: var(--sk-sky-2); }
.sk-btn.sk-white { --c1: #FFFFFF; --c2: #E6EEFA; color: var(--sk-ink); text-shadow: none; }
.sk-btn.sk-big { font-size: 2.1rem; padding: 1rem 2.6rem 1.1rem; min-height: 4.6rem; }

.sk-icon { position: relative; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sk-ink);
  border: var(--sk-line) solid var(--sk-ink); background: linear-gradient(180deg, #FFFFFF, #E4ECFA); box-shadow: inset 0 -.25rem 0 rgba(30,60,120,.12), 0 .26rem 0 var(--sk-ink), 0 .5rem .8rem rgba(20,40,90,.2);
  font: 900 1.15rem/1 var(--sk-font); transition: transform .08s, box-shadow .08s; touch-action: manipulation; padding: 0; outline: none; }
.sk-icon::before { content: ""; position: absolute; left: 18%; right: 18%; top: .16rem; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); pointer-events: none; }
.sk-icon svg { width: 58%; height: 58%; position: relative; }
.sk-icon:active, .sk-icon.sk-press { transform: translateY(.2rem); box-shadow: inset 0 -.15rem 0 rgba(30,60,120,.12), 0 .06rem 0 var(--sk-ink); }
.sk-icon.sk-on { background: linear-gradient(180deg, #FFE36B, #FFC22E); }

/* ---------- HUD ---------- */
.sk-top { position: absolute; top: 1.1rem; left: 1.2rem; right: 1.2rem; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.sk-top .sk-group { display: flex; gap: .7rem; align-items: center; pointer-events: none; }
.sk-top .sk-icon, .sk-top .sk-chip, .sk-top .sk-starbar { pointer-events: auto; }
.sk-chip { position: absolute; left: 50%; top: 1.1rem; transform: translateX(-50%); display: flex; align-items: center; gap: .7rem; padding: .35rem 1.3rem .35rem .45rem; min-height: 3.5rem;
  background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink), 0 .6rem 1rem rgba(20,40,90,.2); font: 900 1.6rem/1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }
.sk-chip .sk-chip-ico { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: radial-gradient(circle at 35% 30%, #fff, #DFF3FF 70%); border: .16rem solid var(--sk-ink); }
.sk-chip .sk-chip-bar { width: 7.5rem; height: 1.05rem; border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); overflow: hidden; }
.sk-chip .sk-chip-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(180deg, #8CF06B, #34B84A); box-shadow: inset 0 .2rem 0 rgba(255,255,255,.5); transition: width .45s cubic-bezier(.3,1.6,.5,1); }
.sk-chip .sk-chip-label { font-size: 1.05rem; color: var(--sk-ink-2); font-weight: 800; }
.sk-bump { animation: sk-bump .42s cubic-bezier(.3,1.7,.5,1); }
@keyframes sk-bump { 0% { scale: 1; } 35% { scale: 1.22; } 100% { scale: 1; } }

.sk-starbar { display: flex; gap: .1rem; align-items: center; padding: .3rem .7rem; height: 3.5rem; background: rgba(255,255,255,.92); border: var(--sk-line) solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .26rem 0 var(--sk-ink); }
.sk-starbar svg { width: 2.35rem; height: 2.35rem; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
.sk-starbar svg.sk-lit { transform: scale(1.12) rotate(-6deg); }

/* ---------- star svg ---------- */
.sk-star-e path.f { fill: #D9E0EE; } .sk-star-e path.h { opacity: 0; }
.sk-star path.f { fill: url(#skGold); } .sk-star path { stroke: var(--sk-ink); stroke-width: 7; stroke-linejoin: round; }
.sk-star path.h, .sk-star-e path.h { stroke: none; fill: #fff; opacity: .55; }

/* ---------- speech bubble ---------- */
.sk-bubble { position: absolute; max-width: 23rem; min-width: 8rem; padding: .95rem 1.25rem 1rem; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 1.5rem;
  box-shadow: 0 .3rem 0 var(--sk-ink), 0 .8rem 1.4rem rgba(20,40,90,.2); font: 800 1.4rem/1.38 var(--sk-font); color: var(--sk-ink); transform: translate(-50%, -100%); transform-origin: 50% 100%;
  pointer-events: auto; cursor: pointer; word-break: keep-all; overflow-wrap: break-word; animation: sk-bubble-in .32s cubic-bezier(.3,1.6,.5,1); }
.sk-bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -.95rem; width: 1.3rem; height: 1.3rem; background: #fff; border-right: var(--sk-line) solid var(--sk-ink); border-bottom: var(--sk-line) solid var(--sk-ink); transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: .3rem; box-shadow: .3rem .3rem 0 -0.05rem rgba(34,48,92,1); }
.sk-bubble .sk-who { display: inline-flex; align-items: center; gap: .3rem; font-size: .95rem; color: #fff; background: var(--sk-blue); border: .14rem solid var(--sk-ink); border-radius: 999px; padding: .12rem .6rem .14rem; margin: 0 0 .4rem -.2rem; }
.sk-bubble .sk-who svg { width: 1rem; height: 1rem; }
.sk-bubble.sk-out { animation: sk-bubble-out .2s ease-in forwards; }
@keyframes sk-bubble-in { from { transform: translate(-50%, -100%) scale(.4); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
@keyframes sk-bubble-out { to { transform: translate(-50%, -100%) scale(.6); opacity: 0; } }

/* ---------- 3D-anchored tag ---------- */
.sk-tag { position: absolute; transform: translate(-50%, -50%); padding: .3rem .85rem .36rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: .9rem; box-shadow: 0 .2rem 0 var(--sk-ink); font: 800 1.15rem/1.1 var(--sk-font); color: var(--sk-ink); white-space: nowrap; }

/* ---------- pop text ---------- */
.sk-pop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 900 var(--size, 3rem)/1 var(--sk-font); pointer-events: none; animation: sk-pop var(--dur, 1.2s) cubic-bezier(.2,.9,.3,1) forwards; }
.sk-pop .sk-ol { color: var(--fill, #FF5C57); --sk-ol-c: #fff; --sk-ol-w: .7rem; --sk-ol-drop: 0rem; }
.sk-pop .sk-ol::after { content: attr(data-t); position: absolute; left: 0; top: .3rem; z-index: -2; -webkit-text-stroke: .7rem var(--sk-ink); color: var(--sk-ink); opacity: .9; }
@keyframes sk-pop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; } 26% { transform: translate(-50%, -50%) scale(.95) rotate(-1deg); } 34% { transform: translate(-50%, -50%) scale(1) rotate(0); } 78% { transform: translate(-50%, calc(-50% - var(--rise, 3rem))) scale(1); opacity: 1; } 100% { transform: translate(-50%, calc(-50% - var(--rise, 3rem) * 1.3)) scale(.9); opacity: 0; } }

.sk-fly { position: absolute; transform: translate(-50%, -50%); font-size: 2.6rem; line-height: 1; text-shadow: 0 .2rem 0 rgba(34,48,92,.35); pointer-events: none; }

/* ---------- toast ---------- */
.sk-toast { position: absolute; left: 50%; top: 5.6rem; transform: translateX(-50%); padding: .7rem 1.4rem .75rem; background: var(--sk-ink); color: #fff; border-radius: 999px; font: 800 1.3rem/1.2 var(--sk-font); box-shadow: 0 .5rem 1rem rgba(20,40,90,.3); animation: sk-toast 2.2s ease forwards; white-space: nowrap; display: flex; gap: .5rem; align-items: center; }
@keyframes sk-toast { 0% { transform: translate(-50%, -1.5rem); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -.6rem); opacity: 0; } }

/* ---------- panels ---------- */
.sk-card { position: absolute; background: #fff; border: var(--sk-line) solid var(--sk-ink); border-radius: 2rem; box-shadow: 0 .42rem 0 var(--sk-ink), 0 1.2rem 2.4rem rgba(20,40,90,.28); pointer-events: auto; }
.sk-dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(20,40,90,.18), rgba(20,40,90,.48)); pointer-events: auto; animation: sk-fade .3s ease; }
@keyframes sk-fade { from { opacity: 0; } }
.sk-in { animation: sk-card-in .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-card-in { from { transform: translateY(2.5rem) scale(.8); opacity: 0; } }
.sk-in-r { animation: sk-card-in-r .55s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes sk-card-in-r { from { transform: translateX(6rem) scale(.9); opacity: 0; } }
.sk-out { animation: sk-card-out .25s ease-in forwards; pointer-events: none !important; }
@keyframes sk-card-out { to { transform: translateY(1.5rem) scale(.9); opacity: 0; } }

/* ---------- title screen ---------- */
.sk-title-head { position: absolute; left: 2.4rem; top: 5.6rem; max-width: 34rem; pointer-events: none; animation: sk-card-in .7s cubic-bezier(.3,1.5,.5,1) both; }
.sk-brand { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .9rem .32rem .35rem; background: #fff; border: .18rem solid var(--sk-ink); border-radius: 999px; box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1rem/1 var(--sk-font); letter-spacing: .06em; color: var(--sk-ink); }
.sk-brand i { width: 1.45rem; height: 1.45rem; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; background: radial-gradient(circle at 35% 30%, #8DB4FF, #3E7BFF 60%); border: .14rem solid var(--sk-ink); display: inline-block; }
.sk-title-text { margin-top: .7rem; font: 900 4.4rem/1.04 var(--sk-font); letter-spacing: -.01em; --sk-ol-w: .75rem; --sk-ol-drop: .42rem; }
.sk-title-text .sk-ol { color: #fff; }
.sk-title-text .sk-ol.sk-c2 { color: #FFE14D; }
.sk-title-sub { margin-top: .9rem; display: inline-block; padding: .5rem 1.1rem .55rem; border-radius: 1rem; background: rgba(255,255,255,.9); border: .18rem solid var(--sk-ink); box-shadow: 0 .22rem 0 var(--sk-ink); font: 800 1.35rem/1.3 var(--sk-font); }
.sk-titlescreen, .sk-resultscreen { position: absolute; inset: 0; pointer-events: none; }
.sk-title-right { position: absolute; right: 2.2rem; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; }
.sk-title-card { position: relative; width: 25.5rem; padding: 1.5rem 1.6rem 1.6rem; display: flex; flex-direction: column; gap: 1rem; }
.sk-title-card .sk-hello { font: 900 1.65rem/1.2 var(--sk-font); }
.sk-title-card .sk-hello b { color: var(--sk-blue-2); }
.sk-lbl { font: 800 1rem/1 var(--sk-font); color: var(--sk-ink-2); margin-bottom: .5rem; display: flex; justify-content: space-between; align-items: baseline; }
.sk-lbl em { font-style: normal; color: var(--sk-blue-2); font-weight: 900; }
.sk-bands { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.sk-band { position: relative; padding: .6rem .4rem .62rem; border-radius: 1.1rem; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #fff, #EEF3FC); box-shadow: 0 .2rem 0 var(--sk-ink); font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; touch-action: manipulation; transition: transform .08s; }
.sk-band small { display: block; margin-top: .25rem; font: 800 .78rem/1 var(--sk-font); color: var(--sk-ink-2); }
.sk-band.sk-sel { background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; }
.sk-band.sk-sel small { color: #E3EDFF; }
.sk-band:active { transform: translateY(.15rem); box-shadow: 0 .05rem 0 var(--sk-ink); }
.sk-bandchip { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: 999px; border: .18rem solid var(--sk-ink); background: linear-gradient(180deg, #6FA0FF, #3A72F2); color: #fff; font: 900 1.2rem/1 var(--sk-font); box-shadow: 0 .2rem 0 var(--sk-ink); align-self: flex-start; }
.sk-bandchip small { font: 800 .85rem/1 var(--sk-font); opacity: .9; }
.sk-dial { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0; height: 3.6rem; }
.sk-dial::before { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: #E3EAF6; border: .16rem solid var(--sk-ink); }
.sk-dial .sk-fill { position: absolute; left: 1.4rem; top: 50%; height: .7rem; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(180deg, #FFE36B, #FFB21E); border: .16rem solid var(--sk-ink); transition: width .35s cubic-bezier(.3,1.4,.5,1); }
.sk-dial button { position: relative; width: 2.8rem; height: 2.8rem; border-radius: 50%; border: .18rem solid var(--sk-ink); background: #fff; font: 900 1.25rem/1 var(--sk-font); color: var(--sk-ink); cursor: pointer; box-shadow: 0 .18rem 0 var(--sk-ink); transition: transform .25s cubic-bezier(.3,1.8,.5,1), background .2s; padding: 0; touch-action: manipulation; }
.sk-dial button.sk-past { background: linear-gradient(180deg, #FFE36B, #FFB21E); }
.sk-dial button.sk-sel { transform: scale(1.32); background: linear-gradient(180deg, #FFE36B, #FFAE14); z-index: 1; }
.sk-dial button.sk-sel::after { content: ""; position: absolute; inset: -.5rem; border-radius: 50%; border: .16rem dashed rgba(34,48,92,.45); animation: sk-spin 6s linear infinite; }
@keyframes sk-spin { to { transform: rotate(360deg); } }
.sk-hint { word-break: keep-all; display: flex; gap: .65rem; align-items: center; padding: .7rem .85rem; border-radius: 1.1rem; background: #FFF6D9; border: .16rem solid #F0D48A; font: 800 1.05rem/1.35 var(--sk-font); color: #6B4A12; min-height: 3.6rem; }
.sk-hint svg { width: 1.9rem; height: 1.9rem; flex: none; }
.sk-title-card .sk-btn { width: 100%; }
.sk-need { font: 800 .95rem/1.2 var(--sk-font); color: var(--sk-pink-2); text-align: center; margin-top: -.4rem; }

/* ---------- results ---------- */
.sk-resultscreen { display: flex; align-items: center; justify-content: center; }
.sk-resultscreen.sk-res-right { justify-content: flex-end; padding-right: 6%; }
.sk-resultscreen.sk-res-right .sk-dim { background: linear-gradient(90deg, rgba(20,40,90,0) 0%, rgba(20,40,90,.12) 35%, rgba(20,40,90,.45) 100%); }
.sk-res { position: relative; width: 32rem; padding: 3.1rem 1.8rem 1.6rem; text-align: center; }
.sk-res.sk-in { animation: sk-res-in .55s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes sk-res-in { from { transform: translateY(3rem) scale(.75); opacity: 0; } }
.sk-ribbon { position: absolute; z-index: 3; left: 50%; top: -1.9rem; transform: translateX(-50%); padding: .7rem 2.6rem .8rem; background: linear-gradient(180deg, #FF8EC0, #F0558F); border: var(--sk-line) solid var(--sk-ink); border-radius: 1.2rem; box-shadow: 0 .3rem 0 var(--sk-ink); white-space: nowrap; font: 900 2.1rem/1 var(--sk-font); }
.sk-ribbon .sk-ol { color: #fff; --sk-ol-w: .45rem; --sk-ol-drop: .2rem; }
.sk-res-stars { display: flex; justify-content: center; align-items: flex-end; gap: .2rem; height: 7.2rem; margin: .2rem 0 .3rem; }
.sk-res-stars svg { width: 5.6rem; height: 5.6rem; opacity: 0; }
.sk-res-stars svg:nth-child(2) { width: 7rem; height: 7rem; margin-bottom: .9rem; }
.sk-res-stars svg.sk-show { animation: sk-star-in .55s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes sk-star-in { 0% { opacity: 0; transform: scale(2.4) rotate(-40deg); } 60% { opacity: 1; transform: scale(.88) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.sk-res-sub { font: 800 1.2rem/1.35 var(--sk-font); color: var(--sk-ink-2); min-height: 1.6rem; word-break: keep-all; overflow-wrap: break-word; white-space: pre-line; text-wrap: pretty; }
/* the big moment: a cheering 2D Haru leans out of the card's top-left corner (beside the stars) */

  font: 800 1rem/1 var(--sk-font); color: var(--sk-ink); animation: fl-row-in .35s ease-out both; }
.fl-nb-row.fl-nb-head { height: 1.7rem; border-top: 0; background: #EEF3FB; font: 900 .82rem/1 var(--sk-font); color: var(--sk-ink-2); animation: none; }
.fl-nb-head span { font: 900 1rem/1 var(--sk-font); color: var(--sk-blue-2, #2F64E8); }
.fl-nb-head b, .fl-nb-head em { font: inherit; text-align: center; }
.fl-nb-row i { width: 1.85rem; height: 1.85rem; display: flex; align-items: center; justify-content: center; }

.fl-nb-row.fl-float u { background: #2F97F0; }
.fl-nb-row.fl-sink u { background: #7652EE; }
@keyframes fl-row-in { from { opacity: 0; transform: translateX(-.6rem); } }
/* decimal pad */
.fl-pad .sk-key.fl-wide { grid-column: span 3; }

.fl-pad .sk-disp.fl-good { background: linear-gradient(180deg, #E6FFDC, #C4F5AE); color: #1F7A2E; }

<body>
<script data-inline="objects.js">
/* Float Lab — low-poly toy objects for the sink-or-float tank.
 * FLO.make(id) → THREE.Group, centred on its bounding box. userData: {id, srot, frot, rrot}
 *   srot = how it sits on the shelf, frot = how it floats, rrot = how it rests on the tank floor.
 * Sizes are in world units (Haru ≈ 1.2 tall).
 */
(function () {
  'use strict';
  var K = window.SiaKit, T = window.THREE;
  if (!K || !T) return;
  var col = K.col, PI = Math.PI;
  var FLO = window.FLO = {};

  // ---------------------------------------------------------------- materials
  var MAT = {};
  function mat(name) {
    if (MAT[name]) return MAT[name];
    var m;
    if (name === 'metal') m = new T.MeshStandardMaterial({ vertexColors: true, metalness: 0.82, roughness: 0.27, envMapIntensity: 1.35 });
    else if (name === 'metal2') m = new T.MeshStandardMaterial({ vertexColors: true, metalness: 0.82, roughness: 0.27, envMapIntensity: 1.35, side: T.DoubleSide });
    else if (name === 'gold') m = new T.MeshStandardMaterial({ vertexColors: true, metalness: 0.75, roughness: 0.3, envMapIntensity: 1.4, emissive: col('#5A3A00'), emissiveIntensity: 0.25 });
    else if (name === 'clay') m = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0, envMapIntensity: 0.55 });
    else if (name === 'clay2') m = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0, envMapIntensity: 0.55, side: T.DoubleSide });
    else if (name === 'glass') m = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.5, envMapIntensity: 2.0, depthWrite: false });
    else if (name === 'ice') m = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.08, metalness: 0.0, transparent: true, opacity: 0.88, envMapIntensity: 1.8, emissive: col('#BFF0FF'), emissiveIntensity: 0.3, depthWrite: false });
    else if (name === 'rubber') m = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.4, metalness: 0, envMapIntensity: 0.9 });
    else if (name === 'soft') m = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0, envMapIntensity: 0.45 });
    MAT[name] = m; return m;
  }
  FLO.mat = mat;
  /** a merged mesh from parts; kit materials 'flat' | 'smooth' | 'glossy' or ours. */
  function mesh(parts, name, opt) {
    opt = Object.assign({ vary: 0.02, ao: 0.14 }, opt || {});
    var m;
    if (name === 'flat' || name === 'smooth' || name === 'glossy') m = K.partsMesh(parts, Object.assign({ mat: name }, opt));
    else { m = new T.Mesh(K.mergeParts(parts, opt), mat(name)); m.castShadow = opt.cast !== false; m.receiveShadow = true; }
    if (name === 'glass' || name === 'ice') { m.castShadow = false; m.renderOrder = 4; }
    return m;
  }
  FLO.mesh = mesh;
  var rb = K.roundedBox;
  function grp() { var g = new T.Group(); for (var i = 0; i < arguments.length; i++) if (arguments[i]) g.add(arguments[i]); return g; }

  // ---------------------------------------------------------------- shapes
  function lathe(pts, seg) { return new T.LatheGeometry(pts.map(function (p) { return new T.Vector2(p[0], p[1]); }), seg || 24); }
  function bottleGeo(r, h) { // upright bottle body, base at y=0
    return lathe([[0, 0], [r * 0.85, 0], [r, r * 0.12], [r, h * 0.62], [r * 0.92, h * 0.74], [r * 0.5, h * 0.86], [r * 0.36, h * 0.9], [r * 0.36, h], [0, h]], 24);
  }
  function eggGeo(r, hh) {
    var pts = [];
    for (var i = 0; i <= 18; i++) { var th = i / 18 * PI; pts.push([Math.max(0.0001, r * Math.sin(th) * (1 + 0.14 * Math.cos(th))), -hh * Math.cos(th)]); }
    pts[0][0] = 0; pts[18][0] = 0; return lathe(pts, 24);
  }
  function leafShape(L, W) {
    var s = new T.Shape(); s.moveTo(-L / 2, 0);
    s.quadraticCurveTo(-L * 0.1, W, L / 2, 0); s.quadraticCurveTo(-L * 0.1, -W, -L / 2, 0); return s;
  }
  function grain(parts, w, h, z, c, n) { // wood grain strokes on a face
    for (var i = 0; i < n; i++) { var y = -h / 2 + h * (i + 0.6) / (n + 0.2); parts.push({ g: new T.BoxGeometry(w * (0.55 + 0.3 * ((i * 37) % 7) / 7), h * 0.035, 0.01), c: c, p: [((i * 13) % 5 - 2) * w * 0.05, y, z], vary: 0 }); }
  }

  // ---------------------------------------------------------------- builders
  var B = {};
  B.duck = function () {
    var p = [], Y = '#FFD43B';
    p.push({ g: new T.SphereGeometry(0.2, 22, 16), c: Y, p: [0, 0, 0], s: [1.3, 0.82, 1.0] });
    p.push({ g: new T.ConeGeometry(0.09, 0.16, 14), c: Y, p: [-0.27, 0.07, 0], r: [0, 0, 1.05] });
    p.push({ g: new T.SphereGeometry(0.14, 20, 14), c: Y, p: [0.16, 0.21, 0] });
    p.push({ g: new T.SphereGeometry(0.068, 14, 10), c: '#FF8A1E', p: [0.3, 0.185, 0], s: [1.4, 0.48, 1.15] });
    [-1, 1].forEach(function (sd) {
      p.push({ g: new T.SphereGeometry(0.11, 14, 10), c: '#FFC21E', p: [-0.03, 0.04, sd * 0.155], s: [1.35, 0.62, 0.35], r: [0, 0, 0.3] });
      p.push({ g: new T.SphereGeometry(0.024, 10, 8), c: '#1E2240', p: [0.235, 0.255, sd * 0.078] });
      p.push({ g: new T.SphereGeometry(0.009, 6, 4), c: '#FFFFFF', p: [0.252, 0.268, sd * 0.086] });
    });
    return grp(mesh(p, 'glossy', { vary: 0, ao: 0.12 }));
  };
  B.coin = function () {
    var p = [{ g: new T.CylinderGeometry(0.17, 0.17, 0.045, 36), c: '#FFC83A' }, { g: new T.TorusGeometry(0.15, 0.012, 6, 36), c: '#F0A81E', r: [PI / 2, 0, 0], p: [0, 0.024, 0] }];
    var st = K.starGeo(0.07, 0.01); p.push({ g: st, c: '#FFE07A', p: [0, 0.026, 0], r: [-PI / 2, 0, 0] });
    return grp(mesh(p, 'gold', { vary: 0, ao: 0.05 }));
  };
  B.key = function () {
    var p = [], c = '#E9C25B';
    p.push({ g: new T.TorusGeometry(0.075, 0.028, 10, 26), c: c, p: [-0.17, 0, 0] });
    p.push({ g: rb(0.28, 0.05, 0.035, 0.012, 2), c: c, p: [0.03, 0, 0] });
    p.push({ g: rb(0.035, 0.07, 0.035, 0.01, 2), c: c, p: [0.12, -0.05, 0] });
    p.push({ g: rb(0.03, 0.05, 0.035, 0.01, 2), c: c, p: [0.16, -0.04, 0] });
    return grp(mesh(p, 'gold', { vary: 0, ao: 0.05 }));
  };
  B.leaf = function () {
    var g = new T.ExtrudeGeometry(leafShape(0.44, 0.16), { depth: 0.012, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.008, bevelSegments: 1, curveSegments: 10 });
    g.translate(0, 0, -0.006);
    var p = [{ g: g, c: '#6CCB4A', vary: 0.04 }, { g: rb(0.4, 0.012, 0.02, 0.004, 1), c: '#3F9A34', p: [0.01, 0, 0.012] }, { g: new T.CylinderGeometry(0.008, 0.01, 0.1, 5), c: '#5A8A2E', p: [-0.26, 0, 0], r: [0, 0, PI / 2] }];
    for (var i = 0; i < 3; i++) [-1, 1].forEach(function (sd) { p.push({ g: rb(0.1, 0.008, 0.012, 0.003, 1), c: '#4FA83A', p: [-0.1 + i * 0.1, sd * 0.03, 0.012], r: [0, 0, sd * 0.6] }); });
    return grp(mesh(p, 'smooth', { vary: 0.03, ao: 0.08 }));
  };
  B.boat = function () {
    var s = new T.Shape(); s.moveTo(-0.26, 0.09); s.lineTo(0.2, 0.09); s.quadraticCurveTo(0.33, 0.09, 0.3, 0.02); s.quadraticCurveTo(0.22, -0.08, 0.05, -0.08); s.lineTo(-0.2, -0.08); s.quadraticCurveTo(-0.26, -0.06, -0.26, 0.09);
    var hull = new T.ExtrudeGeometry(s, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.025, bevelSegments: 2, curveSegments: 8 }); hull.translate(0, 0, -0.1);
    var sail = new T.Shape(); sail.moveTo(0, 0); sail.lineTo(0, 0.3); sail.lineTo(0.2, 0.02); sail.lineTo(0, 0);
    var sg = new T.ExtrudeGeometry(sail, { depth: 0.012, bevelEnabled: false }); sg.translate(0.02, 0, -0.006);
    var p = [{ g: hull, c: '#FF5A5F' }, { g: rb(0.44, 0.03, 0.22, 0.012, 1), c: '#FFFFFF', p: [0.0, 0.12, 0] }, { g: rb(0.44, 0.035, 0.27, 0.015, 1), c: '#FFD23F', p: [0.0, 0.035, 0] },
      { g: new T.CylinderGeometry(0.014, 0.016, 0.42, 6), c: '#9A6440', p: [-0.04, 0.33, 0] }, { g: sg, c: '#FFFFFF', p: [-0.03, 0.16, 0] },
      { g: rb(0.07, 0.045, 0.01, 0.005, 1), c: '#4A86FF', p: [0.0, 0.52, 0] }];
    for (var i = 0; i < 3; i++) p.push({ g: new T.CylinderGeometry(0.022, 0.022, 0.01, 12), c: '#4A86FF', p: [-0.14 + i * 0.12, 0.04, 0.142], r: [PI / 2, 0, 0] });
    return grp(mesh(p, 'glossy', { vary: 0.02, ao: 0.1 }));
  };
  B.spoon = function (wood) {
    var c = wood ? '#D9A066' : '#D8E0E8';
    var bowl = new T.SphereGeometry(0.085, 18, 10, 0, PI * 2, PI / 2, PI / 2);
    var p = [{ g: bowl, c: c, p: [0.15, 0.03, 0], s: [1.45, 0.5, 1.1] }, { g: rb(0.3, wood ? 0.034 : 0.022, wood ? 0.05 : 0.042, 0.01, 2), c: c, p: [-0.08, 0.035, 0], r: [0, 0, -0.08] },
      { g: new T.SphereGeometry(0.03, 10, 8), c: c, p: [-0.235, 0.048, 0], s: [1.2, 0.6, 1.2] }];
    if (wood) return grp(mesh(p, 'clay2', { vary: 0.03 }));
    return grp(mesh(p, 'metal2', { vary: 0, ao: 0.05 }));
  };
  B.woodSpoon = function () { return B.spoon(true); };
  B.sponge = function () {
    var p = [{ g: rb(0.42, 0.16, 0.27, 0.05, 2), c: '#FFD95A', p: [0, 0, 0] }, { g: rb(0.42, 0.055, 0.27, 0.02, 1), c: '#4CC26B', p: [0, 0.105, 0] }];
    var r = K.rng(5);
    for (var i = 0; i < 14; i++) { var face = i % 2; p.push({ g: new T.SphereGeometry(0.018 + r() * 0.012, 6, 4), c: '#E0A92A', p: face ? [(r() - 0.5) * 0.36, (r() - 0.5) * 0.1 - 0.01, 0.13] : [0.205, (r() - 0.5) * 0.1 - 0.01, (r() - 0.5) * 0.22], s: [1, 1, 0.5] }); }
    return grp(mesh(p, 'soft', { vary: 0.02 }));
  };
  B.rock = function () {
    var g = K.jitter(new T.DodecahedronGeometry(0.17, 1), 0.03, 17);
    return grp(mesh([{ g: g, c: '#9AA3AF', s: [1.25, 0.82, 1.05], grad: [0.8, 1.08] }, { g: K.jitter(new T.DodecahedronGeometry(0.07, 0), 0.015, 3), c: '#AEB6C2', p: [0.17, -0.07, 0.06] }], 'flat', { vary: 0.07, ao: 0.25 }));
  };
  function stripedBall(r) {
    var cs = ['#FF5C6E', '#FFFFFF', '#4A86FF', '#FFFFFF', '#FFD23F', '#FFFFFF'], p = [];
    for (var i = 0; i < 6; i++) p.push({ g: new T.SphereGeometry(r, 5, 16, i * PI / 3, PI / 3), c: cs[i] });
    p.push({ g: new T.SphereGeometry(r * 0.2, 10, 6), c: '#FFFFFF', p: [0, r * 0.94, 0], s: [1, 0.35, 1] });
    return grp(mesh(p, 'glossy', { vary: 0, ao: 0.1 }));
  }
  B.ball = function () { return stripedBall(0.15); };
  B.bigBall = function () { return stripedBall(0.56); }; // ~1.1 wide: bigger than the duck, the boat, the log is wider
  B.apple = function () { var a = K.world.fruit('apple'); a.scale.setScalar(1.2); return grp(a); };
  B.woodBlock = function () {
    var p = [{ g: rb(0.34, 0.3, 0.3, 0.04, 2), c: '#E3AC6E', vary: 0.03 }]; grain(p, 0.3, 0.26, 0.152, '#C88A4E', 4);
    return grp(mesh(p, 'smooth', { vary: 0.02 }));

        }

    var y = m.position.y, vy = 0, entered = false, landed = false, tIn = 0, tAll = 0, wob = 0.25, side = (Math.random() - 0.5) * 0.4;
    var rho = floats ? Math.max(0.12, Math.min(0.97, rel)) : rel;

        var f = Math.max(0, Math.min(1, (water - bottom) / h)), yEq = restY(it, rho, dE, water);
        if (!entered && f > 0) {
          entered = true;
          var sp = V(m.position.x, TANK.water + 0.02, m.position.z), big = Math.min(1.6, 0.6 + Math.abs(vy) * 0.25 + dE.w);
          lab.splash(sp.x, sp.z, big); K.sound.play('splash', { vol: 0.9 });
          lab.ripple(sp.x, sp.z, 0.9 + big * 0.3); lab.ripple(sp.x + 0.05, sp.z - 0.04, 0.5);
          lab.bubbles(sp.x, TANK.water - 0.2, sp.z, 10, 0.4); st.shake(0.05, 0.25);
          if (floats) vy *= 0.35 + 0.35 * rho; // the water takes the fall

        }

  // ---------------------------------------------------------------- to the tray
  /** a place on the tray: 3 × 2 cells; a long BIG item (the log) takes a whole row, a round big one (the beach ball) two cells,

    for (var r = 0; r < 2; r++) for (var c = 0; c + span <= 3; c++) {
      var free = true; for (var k = 0; k < span; k++) if (cells[r * 3 + c + k]) free = false;
      if (!free) continue;

      var a = tr.slots[r * 3 + c], b = tr.slots[r * 3 + c + span - 1];
      return { x: (a.x + b.x) / 2, y: a.y, z: a.z, w: tr.cellW * span - 0.08, d: tr.cellD - (big ? 0 : 0.08) };
    }
    var s = tr.slots[tr.items.length % tr.slots.length]; // full: stack in a cell
    return { x: s.x, y: s.y, z: s.z, w: tr.cellW - 0.08, d: tr.cellD - 0.08 };
  }
  /** a sticker picture of an object for the results card: rendered once with the main renderer into a small target. */
  var thumbRT = null, thumbScene = null, thumbCam = null, thumbCv = null;
  function thumbOf(it) {
    var R = st.renderer, N = 160, obj = it.mesh, keep = null, rt = null;
    // a lost WebGL context (low memory, GPU reset) cannot render: the sticker shows the object's name instead
    try { if (R.getContext().isContextLost()) return null; } catch (e) { return null; }
    try {
      if (!thumbRT) {
        thumbRT = new T.WebGLRenderTarget(N, N); thumbRT.texture.encoding = T.sRGBEncoding;
        thumbScene = new T.Scene(); thumbScene.environment = st.scene.environment || null;
        thumbScene.add(new T.HemisphereLight(0xFFF6EA, 0xE9C79B, 0.75));
        var dl = new T.DirectionalLight(0xFFF1DC, 1.35); dl.position.set(-1.2, 2.2, 2.6); thumbScene.add(dl);
        thumbCam = new T.PerspectiveCamera(28, 1, 0.01, 60);
        thumbCv = document.createElement('canvas'); thumbCv.width = N; thumbCv.height = N;
      }
      // borrow the object itself for one synchronous render (a clone would deep-copy userData, which links back to the tap target)
      var r = obj.userData.srot;
      keep = { parent: obj.parent, p: obj.position.clone(), q: obj.quaternion.clone(), s: obj.scale.clone() };
      obj.position.set(0, 0, 0); obj.scale.setScalar(1); obj.rotation.set(r[0], r[1], r[2]);
      thumbScene.add(obj); obj.updateMatrixWorld(true);
      var box = new T.Box3().setFromObject(obj), c = box.getCenter(V()), rad = Math.max(0.05, box.getSize(V()).length() / 2);
      var dist = rad / Math.sin(14 * PI / 180) / 1.3; // a little tighter than the bounding sphere: stickers are small
      thumbCam.position.set(c.x + dist * 0.18, c.y + dist * 0.42, c.z + dist * 0.89); thumbCam.lookAt(c);
      rt = { t: R.getRenderTarget(), c: R.getClearColor(new T.Color()), a: R.getClearAlpha(), sh: R.shadowMap.autoUpdate };
      R.shadowMap.autoUpdate = false;
      R.setRenderTarget(thumbRT); R.setClearColor(0x000000, 0); R.clear(); R.render(thumbScene, thumbCam);
      var px = new Uint8Array(N * N * 4); R.readRenderTargetPixels(thumbRT, 0, 0, N, N, px);
      var g = thumbCv.getContext('2d'), img = g.createImageData(N, N);
      for (var y = 0; y < N; y++) img.data.set(px.subarray((N - 1 - y) * N * 4, (N - y) * N * 4), y * N * 4);

        K.fx.pop({ ko: '소금물!', en: 'Salt water!' }, V(0, TANK.water + 0.4, 0.9), { color: '#4A86FF', size: 2.8 });
        await haru.say(Q('짭짤한 소금물이 됐어!', "Now it's salty water!"), { hold: 0.2 }); live(id);
      } else {
        say(Q('새 맹물로 바꿔 줄게!', "Let's change to fresh water!"), { hold: 0.2 });
        K.sound.play('whoosh', { vol: 0.5, pitch: 0.6 }); lab.bubbles(0, 0.6, 0, 26, 2.4); lab.ripple(-0.5, 0, 1); lab.ripple(0.6, 0.2, 1);
        var sv2 = { v: 1 }; await K.tween(sv2, { v: 0 }, { dur: 1.2, onUpdate: function () { if (id === S.run) lab.salt(sv2.v); } }); live(id);

  }
  function removeSaltJars() { st.scene.children.filter(function (o) { return o.name === 'obj-saltJar'; }).forEach(function (o) { st.scene.remove(o); }); }

  // ---------------------------------------------------------------- E1 / E3 extra steps
  async function askMaterial(id, it) {
    var mats = S.R.matQ, ans = mats.indexOf(it.fact.mat);
    if (ans < 0) return;
    var nm = nameOf(it), q = Q(K.josa(nm.ko, '은', '는') + ' 무엇으로 만들었을까?', 'What is the ' + nm.en + ' made of?');
    await askChoice(id, { q: q, opts: mats.map(function (m) { return FL.MAT[m]; }), hint: Q('색과 느낌을 잘 봐!', 'Look at its color and shine!') }, { keepOrder: true, answer: ans, icons: mats.map(function (m) { return IC[m]; }), cls: 'fl-mat', step: 'material', key: 'material' });
  }
  /** E3 L3-5: the child compares the numbers to predict; the gauge marks the density only after the guess. L1-2 show it first. */
  function markBeforeGuess() { return band() === 'E3' && (L.level || 1) <= 2; }
  async function askDensity(id, it) {
    var tr = it.tr, d = Math.round(tr.m / tr.v * 100) / 100, q = Q(it.fact.ko + '의 밀도는 몇 g/cm³일까?', 'What is the density of the ' + it.fact.en + '?');
    var hint1 = Q('질량 ÷ 부피 = ' + tr.m + ' ÷ ' + tr.v + '. 1 cm³마다 몇 g인지 생각해 봐!', 'Mass ÷ volume = ' + tr.m + ' ÷ ' + tr.v + '. How many grams in each cm³?');
    var onRight = function () { setCardDensity(d); if (markBeforeGuess()) gaugeMark(d); K.sound.play('pop', { pitch: 1.4 }); };
    if (S.R.calc === 'choice') {
      var alts = [d * 10, d / 10, d + 1];
      if (L.level >= 2) { alts = [Math.round(tr.v / tr.m * 10) / 10, d * 10, d + 0.5]; }
      var opts = [d].concat(alts).map(function (x) { return Math.round(x * 100) / 100; }).filter(function (x, i, a) { return x > 0 && a.indexOf(x) === i; });
      while (opts.length < 4) opts.push(Math.round((d + opts.length * 0.3) * 100) / 100);
      await askChoice(id, { q: q, opts: opts.slice(0, 4).map(function (x) { return fmt(x); }), hint: hint1 }, { step: 'density', key: 'density', cam: 'claw' });
      onRight();
    } else {
      await askNumber(id, { q: q, answer: d, unit: 'g/cm³', decimal: true, key: 'density', hint1: hint1, hint2: Q(tr.m + ' ÷ ' + tr.v + ' = ' + K.josa(fmt(d), '이야', '야') + '. 같이 계속해 보자!', tr.m + ' ÷ ' + tr.v + ' = ' + fmt(d) + ". Let's keep going!"), onRight: onRight });
    }
  }
  /** E3 L5 — what share is under water. The first % object is read off a ruler and Haru names the rule (density 0.6 →
   *  60 %); after that the child PREDICTS the % from the density before the drop, and the ruler checks it. The object has
   *  settled at its resting height (watch() waits for that), so the ruler — as tall as the object, 0 % at its bottom —
   *  shows the real waterline. Reading or predicting is ±2 %, so 90-94 counts for ice. */
  function pctInfo(it) { var rel = it.rho || trueDensity(it.tr) / liquidDensity(S.liquid); return { rel: rel, pct: Math.round(rel * 100), d: fmt(trueDensity(it.tr)) }; }
  function showRuler(it) {
    var rel = pctInfo(it).rel, m = it.mesh, dE = it.dE || FLO.dims(m, m.userData.frot), bottom = restY(it, rel, dE, TANK.water) - dE.off;
    var rw = dE.h * 320 / 944, rx = m.position.x + dE.wx / 2 + 0.05 + rw / 2, cx = (m.position.x - dE.wx / 2 + rx + rw / 2) / 2;
    var dist = Math.max(1.35, (dE.h * 2.6) / (2 * vTan()), (dE.wx + rw + 0.3) / (2 * hTan() * 0.42));
    // an aquarium side view from just above the surface: the part under water is seen through the front glass, the rest in the air
    st.camTo([cx, TANK.water + 0.035, m.position.z + dist], [cx, bottom + dE.h * 0.5, m.position.z], 0.9);
    lab.ruler({ x: rx, z: m.position.z + Math.min(0.25, (dE.wz || 0.3) / 2 + 0.02), bottom: bottom, h: dE.h, frac: rel });
    return { bottom: +bottom.toFixed(3), top: +(bottom + dE.h).toFixed(3), water: TANK.water, frac: +rel.toFixed(3), objY: +m.position.y.toFixed(3), restY: +restY(it, rel, dE, TANK.water).toFixed(3) };
  }
  async function askPct(id, it) {
    var P = pctInfo(it), rulerInfo = showRuler(it);
    await askNumber(id, { extra: { ruler: rulerInfo, tolerance: 2 }, q: Q('물에 잠긴 부분은 전체의 몇 %일까?', 'What percent of it is under water?'), answer: P.pct, tolerance: 2, unit: '%', decimal: false, key: 'percent',
      hint1: Q('자를 봐! 파란 부분이 몇 칸일까? 한 칸이 10%, 작은 눈금은 2%야.', 'Look at the ruler! How far does the blue go? Each big part is 10%, each small tick is 2%.'),
      hint2: Q('파란 부분은 ' + P.pct + '%까지 올라왔어.', 'The blue part reaches ' + P.pct + '%.'),
      near: Q('맞아! 정확히는 ' + P.pct + '%야.', 'Yes! Exactly ' + P.pct + '%.') });
    // the rule, said once it has been seen: density compared with water = the share under water
    var rule = Q('밀도 ' + P.d + ' → ' + P.pct + '%가 잠겼어! 밀도가 물의 몇 배인지가 물에 잠기는 비율이야.', 'Density ' + P.d + ' → ' + P.pct + "% under water! The density compared with water's is the share under water.");
    S.pctRef = { ko: it.fact.ko, en: it.fact.en, d: P.d, pct: P.pct };
    await nextOrSpeech(id, haru.say(rule, { hold: 0.4 }), 'explain', rule);
    lab.ruler(null); cam('watch', 0.7);
  }
  async function askPctGuess(id, it) {
    var P = pctInfo(it), ref = S.pctRef;
    await askNumber(id, { q: Q('뜬다면 물에 잠기는 부분은 몇 %일까? 예상해 봐!', 'If it floats, what percent will be under water? Predict it!'), answer: P.pct, tolerance: 2, unit: '%', decimal: false, key: 'percent-guess',
      hint1: Q(K.josa(ref.ko, '은', '는') + ' 밀도 ' + ref.d + ' → ' + ref.pct + '%가 잠겼지? 같은 규칙이야!', 'The ' + ref.en + ': density ' + ref.d + ' → ' + ref.pct + '% under water. Same rule!'),
      hint2: Q('밀도 ' + P.d + ' → ' + P.pct + '%가 잠길 거야. 넣어서 확인해 보자!', 'Density ' + P.d + ' → ' + P.pct + "% under water. Let's drop it and check!"),
      near: Q('좋은 예상이야! 정확히는 ' + P.pct + '%일 거야.', 'Close! It should be exactly ' + P.pct + '%.') });
  }
  async function confirmPct(id, it) {
    var P = pctInfo(it); showRuler(it);
    var line = Q('자로 재 보니 ' + P.pct + '%가 잠겼어. 밀도 ' + K.josa(P.d, '과', '와') + ' 같은 비율이야!', 'The ruler shows ' + P.pct + '% under water, just like the density, ' + P.d + '!');
    await nextOrSpeech(id, haru.say(line, { hold: 0.4 }), 'explain', line);
    lab.ruler(null); cam('watch', 0.7);
  }

  // ---------------------------------------------------------------- one trial
  async function runTrial(id, i) {
    var R = S.R, b = band();
    S.trial = i;
    cam('over', 1.0);
    if (!R.free) { var need = R.trials[i].liquid || 'fresh'; if (need !== S.liquid) { await changeLiquid(id, need); await cam('over', 1.0); live(id); } }
    var it = await pickStep(id, i), tr = it.tr;
    S.cur = it;
    if (R.free && (tr.liquid || 'fresh') !== S.liquid) await changeLiquid(id, tr.liquid || 'fresh');
    await toClaw(id, it);
    if (b === 'E3') { showCard(it); showGauge(); gaugeMark(null); }
    if (R.matQ) await askMaterial(id, it);
    if (b === 'E3' && tr.m != null && tr.dens == null) await askDensity(id, it);
    if (b === 'E3' && tr.dens != null) { setCardDensity(tr.dens); if (markBeforeGuess()) gaugeMark(tr.dens); }
    if (tr.pre) for (var p = 0; p < tr.pre.length; p++) await askChoice(id, FL.Q[tr.pre[p]], { n: R.opts || 0, step: 'pre', key: tr.pre[p], cam: 'claw' });
    cam('claw', 0.8);
    var guess = await askPredict(id, it);
    if (b === 'E3' && !markBeforeGuess()) { gaugeMark(trueDensity(tr)); K.sound.play('pop', { pitch: 1.4 }); }
    // E3 L5: the first % object is read off the ruler (the rule is found there); later ones are predicted before the drop
    var pctPlan = b === 'E3' && tr.pct ? (S.pctRef && guess === 0 ? 'predict' : 'read') : null;
    if (pctPlan === 'predict') await askPctGuess(id, it);
    await dropStep(id, it);
    cam('drop', 0.6);
    var floats = floatsIn(tr, S.liquid);
    await watch(id, it, floats);
    await reveal(id, it, floats, guess);
    if (pctPlan && floats) await (pctPlan === 'predict' ? confirmPct(id, it) : askPct(id, it));
    hideCard(); hideGauge();
    await toTray(id, it, floats);
    it.done = true; it.busy = false;
    // questions about a pair: ask over the two trays, where both results sit side by side
    if (tr.post) for (p = 0; p < tr.post.length; p++) await askChoice(id, FL.Q[tr.post[p]], { n: R.opts || 0, step: 'post', key: tr.post[p], cam: 'trays' });
  }

  // ---------------------------------------------------------------- round
  function currentRound() { return roundDef(band(), L.level || 1); }
  async function runRound(id) {
    var R = S.R = currentRound(), b = band();
    S.phase = 'intro'; S.score = { n: 0, ok: 0 }; S.done = 0; S.floatN = 0; S.sinkN = 0; S.liquid = 'fresh'; S.log = []; S.pctRef = null; lab.salt(0);
    K.setState('play'); K.sound.music(true); showTrayTags(true);

    S.bar = K.ui.topBar({ close: true, sound: true, lang: true, stars: 3, onClose: function () { K.sound.stopSpeech(); title(true); } });
    S.bar.stars.set(0);
    S.chip = K.ui.progress({ icon: IC.flask, total: R.trials.length, value: 0 });
    showLiquidTag(b === 'E2' || b === 'E3');
    cam('over', 1.4);
    var hp1 = haru.group.position, far1 = Math.hypot(hp1.x - HARU_PLAY[0], hp1.z - HARU_PLAY[1]) > 1.5;
    await (far1 ? haru.flyTo(HARU_PLAY[0], 0, HARU_PLAY[1], { thenLook: 'camera' }) : haru.hopTo(HARU_PLAY[0], HARU_PLAY[1], { thenLook: 'camera' })); live(id);
    haru.play('hello');
    var who = K.nameCall(), intro = b === 'K' ? FL.INTRO.K : FL.INTRO[b][(L.level || 1) - 1];
    var sp = haru.say(who ? Q(who + ', ' + intro.ko, who + ', ' + intro.en) : intro, { hold: 0.2 });
    await Promise.race([sp, K.wait(2.2)]); live(id);
    for (var i = 0; i < R.trials.length; i++) { await runTrial(id, i); live(id); }
    if (S.liquid !== 'fresh') { /* leave the salt water for the result screen */ }

  }
  async function finalQ(id, key) {

      haru.lookAt('camera');

    try { await finalQ2(id, key); } finally { if (S.hideCounts) { S.hideCounts = false; updateTrayTag('float'); updateTrayTag('sink'); } }
  }
  async function finalQ2(id, key) {
    if (key === 'countK') {
      cam('trays', 1.0);
      var n = S.floatN, opts = [n - 1, n, n + 1, n + 2].filter(function (x) { return x >= 0; }); if (opts.length < 4) opts.push(n + 3);
      opts.sort(function (a, b) { return a - b; });
      await askChoice(id, { q: Q('파란 쟁반에 뜬 물건은 모두 몇 개야?', 'How many things are on the blue "Floats" tray?'), opts: opts.map(function (x) { return String(x); }), hint: Q('하나씩 손가락으로 세어 봐!', 'Count them one by one!') }, { keepOrder: true, answer: opts.indexOf(n), step: 'final', key: key });

  /** the results card shows what happened: the floaters and the sinkers as stickers, in two groups with their counts */

  /** E3: a lab-notebook table instead of stickers: object, density, and the comparison that decided it ("0.6 < 1 → 뜸") */

    K.ui.topBar({ close: true, sound: true, lang: true });
    lab.salt(0); S.liquid = 'fresh'; lab.setClaw(0, 0.1); lab.setDrop(0.05); lab.ruler(null); lab.spot(null); showTrayTags(false); removeSaltJars();
    setupShelf(roundDef(band(), L.level || 1), false); drawTray('float'); drawTray('sink'); bandLook();
    haru.stop(); haruLand(); haru.place(HARU_TITLE[0], HARU_TITLE[1]); haru.set('idle'); haru.lookAt('camera');

    K.ui.title({ title: { ko: '뜰까?\n가라앉을까?', en: 'Sink or\nFloat Lab' }, subtitle: { ko: '물에 넣어 보고 알아내자!', en: 'Drop it in and find out!' }, hint: hint, onStart: play });
  }

  var titleT = 0;

  function play() {
    abortAll(); var id = S.run;
    runRound(id).catch(function (e) { if (!(e && e.abort)) console.error(e); });
  }

  // ---------------------------------------------------------------- little extras: tap the water, tap Haru
  var tapRay = new T.Raycaster(), tapNdc = new T.Vector2(), waterPlane = new T.Plane(new T.Vector3(0, 1, 0), -TANK.water), hitP = new T.Vector3(), lastWaterTap = 0;
  st.onTap(function (info) {
    if (info.target) return;
    tapNdc.set(info.x / st.w * 2 - 1, -(info.y / st.h) * 2 + 1); tapRay.setFromCamera(tapNdc, st.camera);
    if (!tapRay.ray.intersectPlane(waterPlane, hitP)) return;
    if (Math.abs(hitP.x) > TANK.hx - 0.05 || Math.abs(hitP.z) > TANK.hz - 0.05 || K.time - lastWaterTap < 0.25) return;
    lastWaterTap = K.time; lab.ripple(hitP.x, hitP.z, 0.55); lab.bubbles(hitP.x, TANK.water - 0.25, hitP.z, 4, 0.2);
    K.sound.play('pop', { pitch: 1.5 + Math.random() * 0.4, vol: 0.4 });
  });
  var haruBusy = false;
  st.addTarget(haru.group, { id: 'haru', radius: 0.62, center: V(0, 0.7, 0), minPx: 30, onTap: function () {
    if (haruBusy || S.phase === 'watch' || S.phase === 'fly') return; haruBusy = true;
    K.sound.play('bounce', { pitch: 1.4 }); K.fx.burst(haru.head(), 'hearts', { count: 5 });
    haru.play(K.pick(['jump', 'spin', 'wow'])).then(function () { haruBusy = false; });
  } });

  // ---------------------------------------------------------------- test hooks
  K.expose({
    phase: function () { return S.phase; },
    shelf: function () { return S.items.map(function (it) { var s = st.screenOf(it.mesh); return { i: it.i, id: it.tr.id, done: it.done, enabled: it.target.enabled, x: Math.round(s.x), y: Math.round(s.y) }; }); },
    progress: function () { return { trial: S.trial, done: S.done, score: S.score, floatN: S.floatN, sinkN: S.sinkN, liquid: S.liquid, stars: starsNow(), guesses: S.log }; },
    /** the object in the tank: height, resting height and how much of it is under water (for tests) */
    inTank: function () { var it = S.cur; if (!it || !it.dE) return null; var m = it.mesh, dE = it.dE, b = m.position.y - dE.off; return { id: it.tr.id, floats: it.floats, y: +m.position.y.toFixed(3), restY: it.floats ? +restY(it, it.rho, dE, TANK.water).toFixed(3) : null, under: +Math.max(0, Math.min(1, (TANK.water - b) / dE.h)).toFixed(3), rho: +it.rho.toFixed(3), settledT: it.settledT || null }; },
    trayItems: function () { var o = {}; ['float', 'sink'].forEach(function (k) { o[k] = lab.trays[k].items.map(function (it) { var s = st.screenOf(it.mesh), b = new T.Box3().setFromObject(it.mesh); return { id: it.tr.id, x: Math.round(s.x), y: Math.round(s.y), w: +(b.max.x - b.min.x).toFixed(3) }; }); }); return o; },
    shelfSizes: function () { return S.items.map(function (it) { var b = new T.Box3().setFromObject(it.mesh); return { id: it.tr.id, w: +(b.max.x - b.min.x).toFixed(3) }; }); },
    haruScreen: function () { var top = st.screenOf(haru.group, V(0, 1.45, 0)), base = st.screenOf(haru.group); return { top: Math.round(top.y), bottom: Math.round(base.y), x: Math.round(base.x), visible: top.visible && base.visible }; },
    current: function () { if (!S.cur) return null; var s = st.screenOf(S.cur.mesh); return { id: S.cur.tr.id, x: Math.round(s.x), y: Math.round(s.y), y3: +S.cur.mesh.position.y.toFixed(3) }; },
    camTo: function (n) { cam(n, 0); return n; },
    fit: function (n, o) { if (o) Object.assign(fitFor(n), o); cam(n, 0); return camDef(n); },
    camSet: function (p, l) { st.camTo(p, l, 0); return true; },
    haruAt: function (x, z) { haru.place(x, z); return true; },
    thumbTest: function (i) { var u = thumbOf(S.items[i || 0]); return { len: u ? u.length : 0, err: S.thumbErr || null, url: u ? u.slice(0, 40) : null }; },
    haruHover: function (x, y, z) { haru.place(x, z); haru.group.children[0].position.y = y; return true; },
  });

  makeTrayTags();
  title(false);
  redrawSigns();
  K.ready();
})();

</script>
